                                <div style="font-size:10px; font-weight:bold; text-transform:uppercase; color:#6b7280; margin-bottom:4px;">Adresse de facturation & livraison</div>
                                <div style="font-size:13px; font-weight:bold; color:#1a2b4c;">${AMICALE_INFO.nom}</div>
                                <div style="font-size:12px; color:#1f2937; margin-top:4px; line-height:1.5;">
                                    ${AMICALE_INFO.adresse}<br/>
                                    Contact : <strong>${AMICALE_INFO.contact}</strong><br/>
                                    Tél : <strong>${AMICALE_INFO.telFormat}</strong><br/>
                                    E-mail : ${AMICALE_INFO.email}
                                </div>
                            </td>
                            <td style="width:4%;"></td>
                            <td style="width:48%; vertical-align:top; background-color:#eff6ff; border:2px solid #1a2b4c; border-radius:6px; padding:12px;">
                                <div style="font-size:10px; font-weight:bold; text-transform:uppercase; color:#1a2b4c; margin-bottom:4px;">Fournisseur Destinataire</div>
                                <div style="font-size:16px; font-weight:800; color:#1a2b4c;">${fData.nom}</div>
                                ${fData.numCompte ? `<div style="margin-top:8px; display:inline-block; background-color:#1a2b4c; color:#ffffff; font-size:11px; font-weight:bold; padding:4px 8px; border-radius:4px;">N° DE COMPTE CLIENT : ${fData.numCompte}</div>` : `<div style="font-size:11px; color:#6b7280; font-style:italic; margin-top:4px;">Pas de numéro de compte client renseigné</div>`}
                                <div style="font-size:11px; color:#374151; margin-top:8px; line-height:1.5;">
                                    ${fData.email ? `E-mail : <strong>${fData.email}</strong><br/>` : ''}
                                    ${fData.tel ? `Téléphone : <strong>${fData.tel}</strong>` : ''}
                                </div>
                            </td>
                        </tr>
                    </table>

                    <table style="width:100%; border-collapse:collapse; margin-top:10px;">
                        <thead>
                            <tr style="background-color:#1a2b4c; color:#ffffff;">
                                <th style="padding:8px 10px; font-size:11px; text-transform:uppercase; border:1px solid #1a2b4c; width:40px; text-align:center;">Réf.</th>
                                <th style="padding:8px 10px; font-size:11px; text-transform:uppercase; border:1px solid #1a2b4c; text-align:left;">Désignation de l'article</th>
                                <th style="padding:8px 10px; font-size:11px; text-transform:uppercase; border:1px solid #1a2b4c; width:95px; text-align:left;">Famille</th>
                                <th style="padding:8px 10px; font-size:11px; text-transform:uppercase; border:1px solid #1a2b4c; width:120px; text-align:left;">Conditionnement</th>
                                <th style="padding:8px 10px; font-size:11px; text-transform:uppercase; border:1px solid #1a2b4c; width:80px; text-align:center;">Quantité</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                        <tfoot>
                            <tr style="background-color:#f3f4f6;">
                                <td colspan="4" style="padding:10px 12px; font-size:12px; font-weight:bold; color:#1a2b4c; text-align:right; border:1px solid #d1d5db;">TOTAL D'UNITÉS COMMANDÉES (${items.length} référence${items.length > 1 ? 's' : ''}) :</td>
                                <td style="padding:10px 12px; font-size:15px; font-weight:800; color:#1a2b4c; text-align:center; border:1px solid #d1d5db;">${totalUnitCount}</td>
                            </tr>
                        </tfoot>
                    </table>

                    ${note ? `
                        <div style="margin-top:18px; background-color:#fffbeb; border:1px solid #f59e0b; border-radius:6px; padding:10px 12px;">
                            <div style="font-size:10px; font-weight:bold; text-transform:uppercase; color:#92400e; margin-bottom:4px;">Observations / Consignes de livraison :</div>
                            <div style="font-size:12px; color:#78350f; white-space:pre-line;">${note}</div>
                        </div>
                    ` : ''}

                    <table style="width:100%; border-collapse:collapse; margin-top:28px;">
                        <tr>
                            <td style="width:55%; vertical-align:top; padding-right:16px; font-size:11px; color:#4b5563; line-height:1.5;">
                                <strong>Merci de nous confirmer la bonne prise en compte de ce bon de commande.</strong><br/>
                                Pour toute question concernant la livraison ou la facturation, merci de contacter ${AMICALE_INFO.contact} au <strong>${AMICALE_INFO.telFormat}</strong> ou par mail à <strong>${AMICALE_INFO.email}</strong>.
                            </td>
                            <td style="width:45%; vertical-align:top; border:1.5px solid #cbd5e1; background-color:#f9fafb; border-radius:8px; padding:12px; text-align:center;">
                                <div style="font-size:10px; font-weight:bold; text-transform:uppercase; color:#1a2b4c;">Bon pour commande — Le Président</div>
                                <div style="font-size:13px; font-weight:bold; color:#111827; margin-top:4px;">${AMICALE_INFO.signataire}</div>
                                <div style="font-size:10px; color:#6b7280; margin-top:2px;">Fait à Rieumes, le ${dateStr}</div>
                                <div style="height:35px;"></div>
                            </td>
                        </tr>
                    </table>
                </body>
                </html>
                `;

                const compteTxt = fData.numCompte ? `\nN° de compte client : ${fData.numCompte}` : '';
                const textFallback = `Bonjour,\n\nVeuillez trouver en pièce jointe notre Bon de Commande ${numBon} (${dateStr}) pour l'${AMICALE_INFO.nom}.\nFournisseur : ${fData.nom}${compteTxt}\n\nArticles commandés :\n${textLines}\n${note ? `\nObservations : ${note}\n` : ''}\n--- Coordonnées de facturation et livraison ---\n${AMICALE_INFO.nom}\n${AMICALE_INFO.adresse}\nE-mail : ${AMICALE_INFO.email}\nContact : ${AMICALE_INFO.contact} (${AMICALE_INFO.telFormat})`;

                const payload = {
                    destinataires: targetEmails,
                    sujet: `📄 Bon de Commande ${numBon} — ${AMICALE_INFO.nom}${fData.numCompte ? ` (Compte ${fData.numCompte})` : ''}`,
                    message: textFallback,
                    htmlMessage: htmlEmailBody,
                    pdfHtml: htmlForPdfAttachment,
                    pdfFileName: pdfFileName
                };

                fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                }).catch(err => console.error("Erreur d'envoi du bon :", err));

                alert(`✅ Le Bon de Commande ${numBon} (avec la pièce jointe PDF "${pdfFileName}") a bien été envoyé par e-mail à ${targetLabel} !`);
            };

            const handleSMS = (fId, items) => {
                const fData = fournisseurs[fId];
                if (!fData || !fData.tel) return alert("Numéro du fournisseur non renseigné.");
                const activeItems = items.filter(i => (orderQties[i.id] || 0) > 0);
                if (activeItems.length === 0) return alert("Aucune quantité sélectionnée.");
                const list = activeItems.map(i => `- ${orderQties[i.id]}x ${i.nom} (${i.format})`).join('\n');
                const hasCompte = fData.numCompte && fData.numCompte.trim() !== '';
                const compteSms = hasCompte ? `\nN° Compte client : ${fData.numCompte.trim()}` : '';

                const body = `Bonjour, voici la commande pour l'${AMICALE_INFO.nom} :${compteSms}\n${list}\n\nAdresse : ${AMICALE_INFO.adresse}\nContact : ${AMICALE_INFO.contact} (${AMICALE_INFO.telFormat})\nMerci !`;
                window.location.href = `sms:${fData.tel.replace(/\s+/g, '')}?body=${encodeURIComponent(body)}`;
            };

            // Si un fournisseur est ouvert dans le Centre d'Impression A4 / PDF
            if (previewSupplierId) {
                const fId = previewSupplierId;
                const fData = fId === 'unassigned' ? { nom: "Sans Fournisseur Associé", numCompte: "", email: "", tel: "" } : (fournisseurs[fId] || { nom: "Fournisseur inconnu" });
                const itemsToPrint = (groupedOrders[fId] || []).filter(i => (orderQties[i.id] || 0) > 0);
                const numBon = getOrderNumber(fId);
                const dateStr = new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const totalUnits = itemsToPrint.reduce((acc, i) => acc + (Number(orderQties[i.id]) || 0), 0);
                const currentRecipient = selectedRecipientBySupplier[fId] || (fData.email ? 'fournisseur' : 'tous_contacts');

                return (
                    <div>
                        {/* Barre d'outils du Centre d'Impression (masquée à l'impression papier/PDF) */}
                        <div class="no-print bg-white p-4 rounded-xl shadow-md border-2 border-pompier-navy mb-6 flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4">
                            <div class="flex items-center space-x-3">
                                <button 
                                    onClick={() => setPreviewSupplierId(null)} 
                                    class="bg-gray-100 hover:bg-gray-200 text-pompier-navy font-bold px-3.5 py-2 rounded-lg text-sm flex items-center space-x-2 transition"
                                >
                                    <i class="fa-solid fa-arrow-left"></i>
                                    <span>Retour aux bons</span>
                                </button>
                                <div>
                                    <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-blue-100 text-pompier-navy">Centre d'impression & PDF</span>
                                    <h2 class="font-bold text-lg text-pompier-navy">Bon de commande — {fData.nom}</h2>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                {/* Sélecteur d'envoi par mail direct avec pièce jointe PDF */}
                                <div class="flex items-center bg-gray-50 border border-gray-300 rounded-lg p-1">
                                    <select 
                                        value={currentRecipient}
                                        onChange={e => setSelectedRecipientBySupplier(prev => ({ ...prev, [fId]: e.target.value }))}
                                        class="bg-transparent text-xs font-semibold text-pompier-navy px-2 py-1.5 outline-none"
                                    >
                                        {fData.email && <option value="fournisseur">📧 Fournisseur : {fData.nom} ({fData.email})</option>}
                                        <option value="tous_contacts">🔔 Tous les contacts d'alerte actifs</option>
                                        {Object.entries(contactsAlerte).map(([cId, c]) => (
                                            <option key={cId} value={`contact:${cId}`}>👤 Contact : {c.nom} ({c.email})</option>
                                        ))}
                                    </select>
                                    <button 
                                        onClick={() => handleSendPurchaseOrderEmail(fId, currentRecipient)}
                                        class="bg-pompier-red hover:bg-red-700 text-white text-xs font-bold px-3 py-1.5 rounded-md shadow-sm flex items-center space-x-1.5 transition"
                                    >
                                        <i class="fa-solid fa-file-pdf"></i>
                                        <span>Envoyer Mail + PDF</span>
                                    </button>
                                </div>

                                <button 
                                    onClick={() => window.print()} 
                                    class="bg-pompier-navy hover:bg-blue-900 text-white font-bold px-4 py-2.5 rounded-lg shadow flex items-center space-x-2 text-sm transition"
                                >
                                    <i class="fa-solid fa-print"></i>
                                    <span>Imprimer / Enregistrer en PDF</span>
                                </button>
                            </div>
                        </div>

                        {/* FEUILLE A4 OFFICIELLE DU BON DE COMMANDE */}
                        <div class="print-sheet bg-white max-w-4xl mx-auto p-8 sm:p-10 rounded-xl shadow-lg border border-gray-200 text-gray-900">
                            <div class="flex flex-col sm:flex-row justify-between items-start border-b-4 border-pompier-red pb-6 gap-4">
                                <div class="flex items-start space-x-4">
                                    <img src="./logo.png" alt="Logo Amicale" class="h-20 w-20 object-contain shrink-0" />
                                    <div>
                                        <span class="text-[11px] font-extrabold uppercase tracking-widest text-pompier-red block">Réserve du Foyer</span>
                                        <h1 class="text-xl sm:text-2xl font-extrabold text-pompier-navy uppercase leading-tight">{AMICALE_INFO.nom}</h1>
                                        <div class="text-xs text-gray-600 mt-2 space-y-0.5">
                                            <p><i class="fa-solid fa-location-dot text-pompier-red w-4"></i> <strong>{AMICALE_INFO.adresse}</strong></p>
                                            <p><i class="fa-solid fa-envelope text-pompier-red w-4"></i> {AMICALE_INFO.email}</p>
                                            <p><i class="fa-solid fa-phone text-pompier-red w-4"></i> Contact : <strong>{AMICALE_INFO.contact} ({AMICALE_INFO.telFormat})</strong></p>
                                        </div>
                                    </div>
                                </div>

                                <div class="bg-gray-50 border-2 border-pompier-navy rounded-xl p-4 text-right min-w-[210px] self-stretch sm:self-auto flex flex-col justify-center">
                                    <span class="text-[10px] font-bold uppercase tracking-wider text-gray-500">Document Officiel</span>
                                    <h2 class="text-lg font-extrabold text-pompier-navy uppercase">Bon de Commande</h2>
                                    <p class="text-sm font-mono font-bold text-pompier-red mt-1">N° {numBon}</p>
                                    <p class="text-xs text-gray-600 mt-0.5">Date : <strong>{dateStr}</strong></p>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 my-6">
                                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                                    <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400 block mb-1">Adresse de facturation & livraison</span>
                                    <p class="font-bold text-sm text-pompier-navy">{AMICALE_INFO.nom}</p>
                                    <p class="text-xs text-gray-700 mt-1">{AMICALE_INFO.adresse}</p>
                                    <p class="text-xs text-gray-700 mt-1">Contact réception : <strong>{AMICALE_INFO.contact}</strong></p>
                                    <p class="text-xs text-gray-700">Tél : <strong>{AMICALE_INFO.telFormat}</strong></p>
                                    <p class="text-xs text-gray-700">E-mail : {AMICALE_INFO.email}</p>
                                </div>

                                <div class="bg-blue-50/50 p-4 rounded-lg border-2 border-pompier-navy">
                                    <span class="text-[10px] font-bold uppercase tracking-wider text-pompier-navy block mb-1">Fournisseur Destinataire</span>
                                    <p class="font-extrabold text-lg text-pompier-navy">{fData.nom}</p>
                                    {fData.numCompte ? (
                                        <div class="mt-2 inline-block bg-pompier-navy text-white text-xs font-bold px-3 py-1 rounded">
                                            N° DE COMPTE CLIENT : {fData.numCompte}
                                        </div>
                                    ) : (
                                        <p class="text-xs text-gray-400 italic mt-1">Pas de numéro de compte client renseigné</p>
                                    )}
                                    <div class="text-xs text-gray-700 mt-2 space-y-0.5">
                                        {fData.email && <p>E-mail : <strong>{fData.email}</strong></p>}
                                        {fData.tel && <p>Téléphone : <strong>{fData.tel}</strong></p>}
                                    </div>
                                </div>
                            </div>

                            <div class="mt-6">
                                <table class="w-full border-collapse border border-gray-300 text-left">
                                    <thead>
                                        <tr class="bg-pompier-navy text-white text-xs uppercase">
                                            <th class="py-2.5 px-3 border border-gray-300 w-12 text-center">Réf.</th>
                                            <th class="py-2.5 px-3 border border-gray-300">Désignation de l'article</th>
                                            <th class="py-2.5 px-3 border border-gray-300 w-28">Famille</th>
                                            <th class="py-2.5 px-3 border border-gray-300 w-36">Conditionnement</th>
                                            <th class="py-2.5 px-3 border border-gray-300 w-28 text-center">Quantité</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-200 text-sm">
                                        {itemsToPrint.length === 0 ? (
                                            <tr>
                                                <td colSpan="5" class="py-8 text-center text-gray-400 italic">Aucun article sélectionné dans ce bon.</td>
                                            </tr>
                                        ) : (
                                            itemsToPrint.map((item, idx) => (
                                                <tr key={item.id} class={idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'}>
                                                    <td class="py-2.5 px-3 border border-gray-300 text-center font-mono text-xs text-gray-500">{idx + 1}</td>
                                                    <td class="py-2.5 px-3 border border-gray-300 font-bold text-pompier-navy">{item.nom}</td>
                                                    <td class="py-2.5 px-3 border border-gray-300 text-xs text-gray-600">{item.famille}</td>
                                                    <td class="py-2.5 px-3 border border-gray-300 text-xs text-gray-700 font-semibold">{item.format}</td>
                                                    <td class="py-2.5 px-3 border border-gray-300 text-center font-extrabold text-base text-pompier-red">{orderQties[item.id]}</td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                    <tfoot>
                                        <tr class="bg-gray-100 font-bold text-pompier-navy text-sm border-t-2 border-pompier-navy">
                                            <td colSpan="4" class="py-2.5 px-3 text-right uppercase text-xs">Total d'unités commandées ({itemsToPrint.length} référence{itemsToPrint.length > 1 ? 's' : ''}) :</td>
                                            <td class="py-2.5 px-3 text-center font-extrabold text-base">{totalUnits}</td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>

                            {(orderNotes[fId] || '').trim() !== '' && (
                                <div class="mt-6 bg-amber-50/70 border border-amber-300 rounded-lg p-3.5">
                                    <span class="text-[10px] font-bold uppercase tracking-wider text-amber-900 block mb-1">Observations / Consignes de livraison :</span>
                                    <p class="text-xs text-gray-800 whitespace-pre-line">{orderNotes[fId]}</p>
                                </div>
                            )}

                            <div class="mt-8 pt-6 border-t border-gray-200 grid grid-cols-1 sm:grid-cols-2 gap-6 items-end">
                                <div class="text-xs text-gray-500 space-y-1">
                                    <p class="font-bold text-gray-700">Merci de nous confirmer la bonne prise en compte de ce bon de commande.</p>
                                    <p>Pour toute question sur cette commande, veuillez contacter {AMICALE_INFO.contact} au {AMICALE_INFO.telFormat}.</p>
                                </div>
                                <div class="border-2 border-gray-300 rounded-xl p-4 bg-gray-50/50 text-center">
                                    <p class="text-[11px] font-bold uppercase text-pompier-navy">Bon pour commande — Le Président</p>
                                    <p class="text-sm font-extrabold text-gray-900 mt-1">{AMICALE_INFO.signataire}</p>
                                    <p class="text-[11px] text-gray-500 mt-0.5">Fait à Rieumes, le {dateStr}</p>
                                    <div class="h-10"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // VUE PRINCIPALE DE L'ONGLET COMMANDES & BONS PAR FOURNISSEUR
            const visibleSupplierIds = supplierIds.filter(fId => {
                if (selectedFournisseurFilter !== 'Tous' && fId !== selectedFournisseurFilter) return false;
                if (fId === 'unassigned' && (!groupedOrders[fId] || groupedOrders[fId].length === 0)) return false;
                return true;
            });

            return (
                <div class="no-print space-y-6">
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="bg-pompier-red text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">Centre d'impression & Envoi PDF</span>
                            </div>
                            <h2 class="text-2xl font-bold text-pompier-navy mt-1">Bons de Commande par Fournisseur</h2>
                            <p class="text-xs text-gray-500">
                                Chaque e-mail envoyé inclut un message de présentation et le Bon de Commande officiel en fichier PDF en pièce jointe.
                            </p>
                        </div>

                        <div class="flex items-center space-x-2 self-stretch md:self-auto">
                            <span class="text-xs font-bold text-gray-500 uppercase shrink-0">Afficher :</span>
                            <select 
                                value={selectedFournisseurFilter}
                                onChange={e => setSelectedFournisseurFilter(e.target.value)}
                                class="border-2 border-pompier-navy rounded-lg px-3 py-2 text-xs font-bold text-pompier-navy bg-white outline-none w-full md:w-auto"
                            >
                                <option value="Tous">Tous les fournisseurs ({supplierIds.length})</option>
                                {supplierIds.map(fId => {
                                    const nom = fId === 'unassigned' ? 'Sans fournisseur associé' : (fournisseurs[fId]?.nom || 'Fournisseur');
                                    return <option key={fId} value={fId}>{nom}</option>;
                                })}
                            </select>
                        </div>
                    </div>

                    {visibleSupplierIds.length === 0 ? (
                        <div class="bg-white p-8 rounded-xl shadow-sm border text-center text-gray-500">
                            Aucun fournisseur enregistré. Ajoutez vos fournisseurs dans l'onglet <strong>Fournisseurs</strong>.
                        </div>
                    ) : (
                        <div class="space-y-6">
                            {visibleSupplierIds.map(fId => {
                                const fData = fId === 'unassigned' 
                                    ? { nom: "Articles sans fournisseur associé", numCompte: "", email: "", tel: "", siteWeb: "" } 
                                    : (fournisseurs[fId] || { nom: "Fournisseur" });
                                const itemsInOrder = groupedOrders[fId] || [];
                                const activeCount = itemsInOrder.filter(i => (orderQties[i.id] || 0) > 0).length;

                                const otherCatalogItems = stock.filter(item => {
                                    const itemFId = (item.fournisseurId && fournisseurs[item.fournisseurId]) ? item.fournisseurId : 'unassigned';
                                    return itemFId === fId && !itemsInOrder.some(o => o.id === item.id);
                                });

                                const currentRecipient = selectedRecipientBySupplier[fId] || (fData.email ? 'fournisseur' : 'tous_contacts');

                                return (
                                    <div key={fId} class="bg-white rounded-xl shadow-sm border-2 border-gray-200 overflow-hidden">
                                        <div class="bg-pompier-navy text-white px-5 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b-4 border-pompier-red">
                                            <div>
                                                <div class="flex flex-wrap items-center gap-2">
                                                    <h3 class="font-bold text-lg uppercase tracking-wide">{fData.nom}</h3>
                                                    {fData.numCompte && (
                                                        <span class="bg-white text-pompier-navy text-xs font-extrabold px-2.5 py-0.5 rounded shadow-sm">
                                                            <i class="fa-solid fa-id-card mr-1 text-pompier-red"></i>N° Compte : {fData.numCompte}
                                                        </span>
                                                    )}
                                                    <span class="bg-pompier-red text-white text-xs font-bold px-2.5 py-0.5 rounded-full">
                                                        {activeCount} réf. à commander
                                                    </span>
                                                </div>
                                                <p class="text-xs text-gray-300 mt-1">
                                                    {fData.email ? `📧 ${fData.email}` : 'Pas d\'e-mail renseigné'} 
                                                    {fData.tel ? ` · 📞 ${fData.tel}` : ''}
                                                    {` · Bon N° ${getOrderNumber(fId)}`}
                                                </p>
                                            </div>

                                            <div class="flex items-center space-x-2 self-stretch sm:self-auto">
                                                <button 
                                                    onClick={() => setPreviewSupplierId(fId)}
                                                    class="flex-1 sm:flex-initial bg-white hover:bg-gray-100 text-pompier-navy font-bold px-3.5 py-2 rounded-lg text-xs shadow flex items-center justify-center space-x-1.5 transition"
                                                >
                                                    <i class="fa-solid fa-file-pdf text-pompier-red text-sm"></i>
                                                    <span>Aperçu Bon A4 / Imprimer / PDF</span>
                                                </button>
                                            </div>
                                        </div>

                                        <div class="p-5 space-y-4">
                                            {itemsInOrder.length === 0 ? (
                                                <p class="text-sm text-gray-400 italic text-center py-4 bg-gray-50 rounded-lg border border-dashed">
                                                    Aucun article en rupture chez ce fournisseur. Vous pouvez ajouter un article manuellement ci-dessous.
                                                </p>
                                            ) : (
                                                <div class="divide-y divide-gray-100 border rounded-lg overflow-hidden">
                                                    {itemsInOrder.map(item => {
                                                        const isAlert = item.alerteActive !== false && item.quantite <= item.seuil;
                                                        const qty = orderQties[item.id] || 0;
                                                        return (
                                                            <div key={item.id} class={`p-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 ${qty > 0 ? 'bg-white' : 'bg-gray-50 opacity-60'}`}>
                                                                <div>
                                                                    <div class="flex items-center space-x-2">
                                                                        <span class="font-bold text-pompier-navy">{item.nom}</span>
                                                                        <span class="text-xs bg-gray-200 text-gray-700 px-2 py-0.5 rounded font-semibold">{item.format}</span>
                                                                        {isAlert && <span class="text-[10px] bg-red-100 text-red-700 font-bold px-2 py-0.5 rounded uppercase">Stock : {item.quantite} (Seuil : {item.seuil})</span>}
                                                                        {!isAlert && <span class="text-[10px] bg-blue-50 text-blue-700 font-bold px-2 py-0.5 rounded">Stock : {item.quantite}</span>}
                                                                    </div>
                                                                </div>

                                                                <div class="flex items-center space-x-2 self-end sm:self-auto">
                                                                    <span class="text-xs text-gray-500 font-semibold mr-1">Qté à commander :</span>
                                                                    <div class="flex items-center space-x-1 bg-gray-50 border border-gray-300 rounded-lg px-1.5 py-1">
                                                                        <button type="button" onClick={() => adjustQty(item.id, -1)} class="w-7 h-7 flex items-center justify-center text-gray-600 hover:text-pompier-red rounded font-bold">-</button>
                                                                        <input 
                                                                            type="number" 
                                                                            min="0" 
                                                                            value={qty} 
                                                                            onChange={e => setDirectQty(item.id, e.target.value)}
                                                                            onFocus={e => e.target.select()}
                                                                            class="w-12 text-center font-bold text-pompier-navy bg-transparent outline-none text-sm"
                                                                        />
                                                                        <button type="button" onClick={() => adjustQty(item.id, 1)} class="w-7 h-7 flex items-center justify-center text-gray-600 hover:text-emerald-600 rounded font-bold">+</button>
                                                                    </div>
                                                                    <button 
                                                                        type="button" 
                                                                        onClick={() => handleRemoveFromOrder(item.id)} 
                                                                        class="text-gray-400 hover:text-red-500 p-1.5" 
                                                                        title="Retirer du bon"
                                                                    >
                                                                        <i class="fa-solid fa-xmark"></i>
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            )}

                                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
                                                <div class="flex items-center space-x-2">
                                                    <select 
                                                        value={addArticleSelect[fId] || ''}
                                                        onChange={e => setAddArticleSelect(prev => ({ ...prev, [fId]: e.target.value }))}
                                                        class="flex-1 border rounded-lg px-3 py-2 text-xs bg-gray-50 outline-none focus:border-pompier-navy"
                                                    >
                                                        <option value="">+ Ajouter un autre article de ce fournisseur ({otherCatalogItems.length})...</option>
                                                        {otherCatalogItems.map(item => (
                                                            <option key={item.id} value={item.id}>{item.nom} ({item.format}) — En stock : {item.quantite}</option>
                                                        ))}
                                                    </select>
                                                    <button 
                                                        type="button"
                                                        onClick={() => handleAddExtraProduct(fId)}
                                                        disabled={!addArticleSelect[fId]}
                                                        class={`px-3 py-2 rounded-lg text-xs font-bold shrink-0 ${addArticleSelect[fId] ? 'bg-pompier-navy text-white hover:bg-blue-900' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
                                                    >
                                                        Ajouter
                                                    </button>
                                                </div>

                                                <div>
                                                    <input 
                                                        type="text" 
                                                        placeholder="Note / consigne sur ce bon (ex: Livraison souhaitée vendredi matin...)" 
                                                        value={orderNotes[fId] || ''}
                                                        onChange={e => setOrderNotes(prev => ({ ...prev, [fId]: e.target.value }))}
                                                        class="w-full border rounded-lg px-3 py-2 text-xs bg-gray-50 outline-none focus:border-pompier-navy"
                                                    />
                                                </div>
                                            </div>

                                            <div class="pt-4 border-t border-gray-200 flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-3">
                                                <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 bg-red-50/60 border border-red-200 p-2 rounded-xl flex-1">
                                                    <span class="text-xs font-bold text-pompier-navy px-2 shrink-0">
                                                        <i class="fa-solid fa-file-pdf text-pompier-red mr-1.5"></i>Envoyer Mail + PDF joint à :
                                                    </span>
                                                    <select 
                                                        value={currentRecipient}
                                                        onChange={e => setSelectedRecipientBySupplier(prev => ({ ...prev, [fId]: e.target.value }))}
                                                        class="flex-1 bg-white border border-gray-300 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-pompier-navy outline-none"
                                                    >
                                                        {fData.email && <option value="fournisseur">🏢 Fournisseur : {fData.nom} ({fData.email})</option>}
                                                        <option value="tous_contacts">🔔 Tous les contacts d'alerte actifs</option>
                                                        {Object.entries(contactsAlerte).map(([cId, c]) => (
                                                            <option key={cId} value={`contact:${cId}`}>👤 Contact : {c.nom} ({c.email})</option>
                                                        ))}
                                                    </select>
                                                    <button 
                                                        type="button"
                                                        onClick={() => handleSendPurchaseOrderEmail(fId, currentRecipient)}
                                                        disabled={activeCount === 0}
                                                        class={`px-4 py-2 rounded-lg text-xs font-bold shadow-sm flex items-center justify-center space-x-1.5 shrink-0 transition ${activeCount > 0 ? 'bg-pompier-red hover:bg-red-700 text-white' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}
                                                    >
                                                        <i class="fa-solid fa-paper-plane"></i>
                                                        <span>Envoyer Mail + PDF</span>
                                                    </button>
                                                </div>

                                                <div class="flex flex-wrap items-center gap-2">
                                                    <button 
                                                        type="button"
                                                        onClick={() => setPreviewSupplierId(fId)}
                                                        disabled={activeCount === 0}
                                                        class={`px-3.5 py-2 rounded-lg text-xs font-bold shadow-sm flex items-center space-x-1.5 ${activeCount > 0 ? 'bg-pompier-navy hover:bg-blue-900 text-white' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
                                                    >
                                                        <i class="fa-solid fa-print"></i>
                                                        <span>Imprimer / PDF</span>
                                                    </button>

                                                    {fId !== 'unassigned' && fData.tel && (
                                                        <button 
                                                            type="button"
                                                            onClick={() => handleSMS(fId, itemsInOrder)}
                                                            disabled={activeCount === 0}
                                                            class={`px-3.5 py-2 rounded-lg text-xs font-bold shadow-sm flex items-center space-x-1.5 ${activeCount > 0 ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
                                                        >
                                                            <i class="fa-solid fa-comment-sms"></i>
                                                            <span>SMS</span>
                                                        </button>
                                                    )}

                                                    {fId !== 'unassigned' && fData.siteWeb && (
                                                        <a 
                                                            href={fData.siteWeb.startsWith('http') ? fData.siteWeb : `https://${fData.siteWeb}`} 
                                                            target="_blank" 
                                                            rel="noopener noreferrer" 
                                                            class="px-3.5 py-2 rounded-lg text-xs font-bold shadow-sm bg-gray-700 hover:bg-gray-800 text-white flex items-center space-x-1.5"
                                                        >
                                                            <i class="fa-solid fa-globe"></i>
                                                            <span>Site web</span>
                                                        </a>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        function SortiesTab({ stock, fullStock, onUpdateQty, db, utilisateur, setUtilisateur, triggerEmailAlerts }) {
            const [cart, setCart] = useState({});

            const handleCartChange = (id, delta, maxStock) => {
                setCart(prev => {
                    const current = Number(prev[id]) || 0;
                    const next = Math.max(0, Math.min(maxStock, current + delta));
                    if (next === 0) {
                        const copy = { ...prev };
                        delete copy[id];
                        return copy;
                    }
                    return { ...prev, [id]: next };
                });
            };

            const handleDirectCartInput = (id, rawValue, maxStock) => {
                if (rawValue === '') {
                    setCart(prev => {
                        const copy = { ...prev };
                        delete copy[id];
                        return copy;
                    });
                    return;
                }
                const parsed = parseInt(rawValue, 10);
                if (isNaN(parsed) || parsed <= 0) {
                    setCart(prev => {
                        const copy = { ...prev };
                        delete copy[id];
                        return copy;
                    });
                    return;
                }
                const clamped = Math.min(maxStock, parsed);
                setCart(prev => ({ ...prev, [id]: clamped }));
            };

            const confirmValidation = () => {
                if (Object.keys(cart).length === 0) return;
                if (!utilisateur.trim()) return alert("🚨 Merci d'indiquer ton nom ou surnom avant de valider la sortie.");

                localStorage.setItem('foyer_utilisateur', utilisateur.trim());
                const articlesSortis = [];
                const catalog = fullStock || stock;
                const nouveauxIds = [];
                const itemsEnAlerteActuels = [];

                Object.entries(cart).forEach(([id, qtyToRemove]) => {
                    const qty = Number(qtyToRemove) || 0;
                    const item = catalog.find(i => i.id === id);
                    if (item && qty > 0) {
                        const ancienStock = item.quantite;
                        const nouveauStock = ancienStock - qty;
                        onUpdateQty(id, ancienStock, -qty);
                        articlesSortis.push({ id, nom: item.nom, quantite: qty, format: item.format });

                        if (item.alerteActive !== false && nouveauStock <= item.seuil) {
                            if (ancienStock > item.seuil) {
                                nouveauxIds.push(item.id);
                            }
                            itemsEnAlerteActuels.push({ ...item, quantite: nouveauStock });
                        }
                    }
                });

                if (articlesSortis.length === 0) return;

                db.ref('historique').push({
                    date: firebase.database.ServerValue.TIMESTAMP,
                    type: 'sortie',
                    utilisateur: utilisateur.trim(),
                    articles: articlesSortis
                });

                if (nouveauxIds.length > 0) {
                    const autresEnAlerte = catalog.filter(i => i.alerteActive !== false && i.quantite <= i.seuil && !cart[i.id]);
                    const tousLesAlerte = [...itemsEnAlerteActuels, ...autresEnAlerte];
                    triggerEmailAlerts(utilisateur.trim(), tousLesAlerte, nouveauxIds, false);
                }

                setCart({});
                alert("Sorties enregistrées avec succès !");
            };

            const totalItemsCount = Object.values(cart).reduce((a, b) => a + (Number(b) || 0), 0);
            const catalogForCart = fullStock || stock;

            return (
                <div class="no-print grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 space-y-4">
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-xl font-bold text-pompier-navy">
                                    <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i> Sortir de la réserve
                                </h2>
                                <span class="text-xs text-gray-400 hidden sm:inline">Utilisez +/- ou cliquez sur le chiffre pour saisir</span>
                            </div>

                            {stock.length === 0 ? (
                                <p class="text-center text-gray-400 py-8 italic">Aucun article ne correspond à la recherche.</p>
                            ) : (
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    {stock.map(item => {
                                        const qtyInCart = cart[item.id] || 0;
                                        const remainingStock = item.quantite - qtyInCart;
                                        const isSelected = qtyInCart > 0;
                                        const isAlertActive = item.alerteActive !== false;
                                        return (
                                            <div key={item.id} class={`border rounded-xl p-3 flex flex-col justify-between transition ${isSelected ? 'bg-red-50/40 border-pompier-red ring-1 ring-red-200' : 'bg-gray-50 border-gray-200'}`}>
                                                <div class="flex justify-between items-start mb-2">
                                                    <div>
                                                        <h3 class="font-bold text-pompier-navy">{item.nom}</h3>
                                                        <span class="text-xs text-gray-500">
                                                            Dispo réserve : <strong class={(isAlertActive && remainingStock <= item.seuil) ? "text-red-600" : "text-gray-800"}>{remainingStock}</strong>
                                                        </span>
                                                    </div>
                                                    <span class="text-xs bg-gray-200 text-gray-700 px-2 py-0.5 rounded shrink-0">{item.format}</span>
                                                </div>
                                                <div class="flex items-center justify-between mt-2 pt-2 border-t border-gray-200">
                                                    <span class="text-xs font-semibold text-gray-600">À sortir :</span>
                                                    <div class="flex items-center space-x-1 bg-white border border-gray-300 rounded-lg px-1.5 py-1 shadow-sm focus-within:border-pompier-navy">
                                                        <button 
                                                            type="button"
                                                            onClick={() => handleCartChange(item.id, -1, item.quantite)} 
                                                            class="w-7 h-7 flex items-center justify-center text-gray-600 hover:text-pompier-red hover:bg-gray-100 rounded transition"
                                                        >
                                                            <i class="fa-solid fa-minus text-xs"></i>
                                                        </button>
                                                        <input 
                                                            type="number"
                                                            min="0"
                                                            max={item.quantite}
                                                            placeholder="0"
                                                            value={qtyInCart === 0 ? '' : qtyInCart}
                                                            onChange={e => handleDirectCartInput(item.id, e.target.value, item.quantite)}
                                                            onFocus={e => e.target.select()}
                                                            disabled={item.quantite <= 0}
                                                            class="w-12 text-center font-bold text-pompier-navy outline-none bg-transparent text-sm"
                                                        />
                                                        <button 
                                                            type="button"
                                                            onClick={() => handleCartChange(item.id, 1, item.quantite)} 
                                                            class={`w-7 h-7 flex items-center justify-center rounded text-white transition ${remainingStock > 0 ? 'bg-pompier-navy hover:bg-blue-900' : 'bg-gray-300 cursor-not-allowed'}`} 
                                                            disabled={remainingStock <= 0}
                                                        >
                                                            <i class="fa-solid fa-plus text-xs"></i>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>

                    <div class="lg:col-span-1">
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 sticky top-4">
                            <h3 class="font-bold text-lg text-pompier-navy mb-3 flex items-center justify-between">
                                <span><i class="fa-solid fa-list-check mr-2"></i> Validation</span>
                                <span class="bg-pompier-red text-white text-xs px-2 py-1 rounded-full">{totalItemsCount} art.</span>
                            </h3>
                            <div class="space-y-3 mb-4 max-h-60 overflow-y-auto pr-1">
                                {Object.entries(cart).map(([id, qty]) => {
                                    const item = catalogForCart.find(i => i.id === id);
                                    if (!item) return null;
                                    return (
                                        <div key={id} class="flex justify-between items-center text-sm border-b pb-2">
                                            <div>
                                                <span class="font-semibold">{item.nom}</span>
                                                <span class="text-xs text-gray-400 block">{item.format}</span>
                                            </div>
                                            <div class="flex items-center space-x-2">
                                                <span class="font-bold text-pompier-red">-{qty}</span>
                                                <button onClick={() => handleDirectCartInput(id, '', item.quantite)} class="text-gray-400 hover:text-red-600"><i class="fa-solid fa-trash text-xs"></i></button>
                                            </div>
                                        </div>
                                    );
                                })}
                                {Object.keys(cart).length === 0 && <p class="text-sm text-gray-400 italic text-center py-4">Panier de sortie vide.</p>}
                            </div>
                            <div class="mt-4 pt-4 border-t border-gray-200 mb-4">
                                <label class="block text-sm font-bold text-pompier-navy mb-2">Qui enregistre cette sortie ?</label>
                                <div class="flex items-center bg-gray-50 border rounded-lg px-3 py-2 focus-within:ring-2 ring-pompier-red">
                                    <i class="fa-solid fa-user text-gray-400 mr-2"></i>
                                    <input type="text" placeholder="Ton nom / surnom..." value={utilisateur} onChange={e => setUtilisateur(e.target.value)} class="bg-transparent outline-none flex-1 text-sm font-semibold text-pompier-navy" />
                                </div>
                            </div>
                            <button onClick={confirmValidation} class={`w-full py-3 rounded-lg font-bold shadow transition-colors flex items-center justify-center space-x-2 ${totalItemsCount > 0 ? 'bg-pompier-red text-white hover:bg-red-700' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`} disabled={totalItemsCount === 0}>
                                <i class="fa-solid fa-check"></i><span>Valider la sortie</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function HistoriqueTab({ db, CODE_PURGE, isSuperAdmin }) {
            const [logs, setLogs] = useState([]);
            const [showPinPrompt, setShowPinPrompt] = useState(false);
            const [pinCode, setPinCode] = useState('');
            
            useEffect(() => {
                const ref = db.ref('historique').orderByChild('date').limitToLast(50);
                ref.on('value', snap => {
                    const data = snap.val();
                    if(data) {
                        const logArray = Object.entries(data).map(([id, val]) => ({ id, ...val })).reverse();
                        setLogs(logArray);
                    } else {
                        setLogs([]);
                    }
                });
                return () => ref.off();
            }, []);

            const handleVerifyPinAndClear = (e) => {
                e.preventDefault();
                if (pinCode === CODE_PURGE) {
                    if(confirm("Action irréversible. Es-tu sûr de vouloir vider tout l'historique ?")) {
                        db.ref('historique').remove();
                        setShowPinPrompt(false);
                        setPinCode('');
                        alert("Historique effacé avec succès !");
                    }
                } else {
                    alert("Code de purge incorrect.");
                    setPinCode('');
                }
            };

            const getLogStyle = (type) => {
                if (type === 'sortie') return { color: '#e3001b', badgeClass: 'bg-red-100 text-red-700', label: 'Sortie' };
                if (type === 'inventaire') return { color: '#f59e0b', badgeClass: 'bg-amber-100 text-amber-800', label: 'Correction Inventaire' };
                return { color: '#059669', badgeClass: 'bg-emerald-100 text-emerald-700', label: 'Entrée' };
            };

            return (
                <div class="no-print max-w-3xl mx-auto relative">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-pompier-navy">Journal des mouvements</h2>
                        {logs.length > 0 && isSuperAdmin && (
                            <button onClick={() => {setShowPinPrompt(true); setPinCode('');}} class="text-xs bg-red-100 text-red-600 hover:bg-red-200 px-3 py-1.5 rounded-lg font-bold transition flex items-center space-x-1 shadow-sm">
                                <i class="fa-solid fa-trash-can"></i><span>Vider</span>
                            </button>
                        )}
                    </div>

                    {logs.length === 0 ? (
                        <p class="text-center text-gray-500 py-8 bg-white rounded-xl shadow-sm">Aucun historique pour le moment.</p>
                    ) : (
                        <div class="space-y-4">
                            {logs.map(log => {
                                const style = getLogStyle(log.type);
                                return (
                                    <div key={log.id} class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-gray-200" style={{ borderLeftColor: style.color }}>
                                        <div class="flex justify-between items-start mb-3">
                                            <div><span class="font-bold text-gray-800 text-lg"><i class="fa-solid fa-user-pen text-gray-400 mr-2 text-sm"></i>{log.utilisateur}</span></div>
                                            <div class="text-right">
                                                <div class="text-xs text-gray-500 font-semibold mb-1">{new Date(log.date).toLocaleString('fr-FR', {day: '2-digit', month: 'short', hour: '2-digit', minute:'2-digit'})}</div>
                                                <span class={`text-[10px] font-bold px-2 py-0.5 rounded uppercase ${style.badgeClass}`}>{style.label}</span>
                                            </div>
                                        </div>
                                        <ul class="text-sm space-y-1.5 bg-gray-50 p-3 rounded-lg border border-gray-100">
                                            {log.articles && log.articles.map((art, idx) => {
                                                if (log.type === 'inventaire') {
                                                    const diff = Number(art.quantite) || 0;
                                                    return (
                                                        <li key={idx} class="flex justify-between items-center">
                                                            <span>
                                                                {art.nom} <span class="text-gray-400 text-xs ml-1">({art.format})</span>
                                                                <span class="text-xs text-gray-500 ml-2">[{art.ancien} → <strong>{art.nouveau}</strong>]</span>
                                                            </span>
                                                            <span class={`font-bold ${diff > 0 ? 'text-emerald-600' : 'text-red-600'}`}>{diff > 0 ? `+${diff}` : diff}</span>
                                                        </li>
                                                    );
                                                }
                                                return (
                                                    <li key={idx} class="flex justify-between items-center">
                                                        <span>{art.nom} <span class="text-gray-400 text-xs ml-1">({art.format})</span></span>
                                                        <span class={`font-bold ${log.type === 'sortie' ? 'text-red-600' : 'text-emerald-600'}`}>{log.type === 'sortie' ? '-' : '+'}{art.quantite}</span>
                                                    </li>
                                                );
                                            })}
                                        </ul>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                    
                    {showPinPrompt && isSuperAdmin && (
                        <div class="fixed inset-0 bg-pompier-anthracite bg-opacity-75 flex items-center justify-center p-4 z-50">
                            <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full overflow-hidden">
                                <div class="bg-red-600 text-white px-5 py-4 flex justify-between items-center">
                                    <h2 class="text-lg font-bold"><i class="fa-solid fa-lock mr-2"></i>Purge de l'historique</h2>
                                    <button onClick={() => setShowPinPrompt(false)} class="text-white hover:text-red-200"><i class="fa-solid fa-times text-xl"></i></button>
                                </div>
                                <form onSubmit={handleVerifyPinAndClear} class="p-6 space-y-5">
                                    <p class="text-sm text-gray-600 text-center">Saisis le code secret Administrateur (Purge) pour effacer ce journal.</p>
                                    <div><input autoFocus required type="password" pattern="[0-9]*" inputMode="numeric" maxLength="4" placeholder="Code à 4 chiffres" value={pinCode} onChange={e => setPinCode(e.target.value)} class="w-full border-2 border-red-500 rounded-lg p-3 text-2xl font-bold text-center outline-none tracking-[0.5em] focus:ring-2 focus:ring-red-400" /></div>
                                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg shadow-md transition-colors">Valider et Effacer</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function SecuriteTab({ db, codesBureau, contactsAlerte, CODE_PURGE, isSuperAdmin, itemsInAlert, stockArray, triggerEmailAlerts, utilisateur }) {
            const [newNom, setNewNom] = useState('');
            const [newPin, setNewPin] = useState('');
            
            const [newContactNom, setNewContactNom] = useState('');
            const [newContactEmail, setNewContactEmail] = useState('');

            const handleAddCode = (e) => {
                e.preventDefault();
                const trimmedPin = newPin.trim();
                if (trimmedPin.length !== 4) return alert("Le code PIN doit comporter exactement 4 chiffres.");
                if (trimmedPin === CODE_PURGE) return alert("Ce code est réservé à l'Administrateur.");
                
                const exists = Object.values(codesBureau).some(c => c.pin === trimmedPin);
                if (exists) return alert("Ce code PIN existe déjà.");

                db.ref('parametres/codesBureau').push({ nom: newNom.trim(), pin: trimmedPin });
                alert(`Le code d'accès Bureau pour "${newNom}" a été créé.`);
                setNewNom('');
                setNewPin('');
            };

            const handleDeleteCode = (id, nom) => {
                if (Object.keys(codesBureau).length <= 1) return alert("Impossible de supprimer le dernier code.");
                if (confirm(`Supprimer l'accès Bureau pour "${nom}" ?`)) db.ref(`parametres/codesBureau/${id}`).remove();
            };

            const handleAddContact = (e) => {
                e.preventDefault();
                if (!newContactNom.trim() || !newContactEmail.trim()) return;
                db.ref('parametres/contactsAlerte').push({
                    nom: newContactNom.trim(),
                    email: newContactEmail.trim(),
                    actif: true
                });
                setNewContactNom('');
                setNewContactEmail('');
            };

            const handleToggleContact = (id, currentStatus) => {
                db.ref(`parametres/contactsAlerte/${id}`).update({ actif: !currentStatus });
            };

            const handleDeleteContact = (id, nom) => {
                if (confirm(`Supprimer le contact "${nom}" des alertes mail ?`)) db.ref(`parametres/contactsAlerte/${id}`).remove();
            };

            const handleTestEmail = () => {
                const activeContacts = Object.values(contactsAlerte).filter(c => c.actif && c.email);
                if (activeContacts.length === 0) {
                    return alert("Aucun contact actif ! Ajoute ou active au moins une adresse e-mail ci-dessous.");
                }
                const activeStock = stockArray.filter(i => i.alerteActive !== false);
                const sampleItems = itemsInAlert.length > 0 
                    ? itemsInAlert 
                    : (activeStock.length > 0 ? [activeStock[0]] : [{ id: 'test', nom: 'Pack Coca-Cola (Exemple)', famille: 'Boissons', format: 'Pack 24x33cl', quantite: 2, seuil: 5 }]);
                
                triggerEmailAlerts(utilisateur.trim() || "Administrateur (Test)", sampleItems, [sampleItems[0].id], true);
                alert(`📧 E-mail de test HTML envoyé à ${activeContacts.length} contact(s) actif(s) !`);
            };

            return (
                <div class="no-print max-w-4xl mx-auto space-y-8">
                    <div class="mb-6">
                        <h2 class="text-2xl font-bold text-pompier-navy">Sécurité & Gestion des Alertes</h2>
                        <p class="text-sm text-gray-500 mt-1">
                            {isSuperAdmin ? "Connecté en Administrateur. Gestion complète des codes et des destinataires d'e-mails d'alerte." : "Connecté en Bureau standard."}
                        </p>
                    </div>

                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
                            <div>
                                <h3 class="font-bold text-lg text-pompier-navy"><i class="fa-solid fa-envelope-circle-check mr-2"></i>Destinataires des e-mails d'alerte</h3>
                                <p class="text-xs text-gray-500 mt-1">Ajoutez les personnes à prévenir en cas de rupture de stock. Vous pouvez mettre en pause un contact (ex: congés).</p>
                            </div>
                            {isSuperAdmin && (
                                <button 
                                    type="button"
                                    onClick={handleTestEmail}
                                    class="bg-pompier-red hover:bg-red-700 text-white text-xs font-bold px-3.5 py-2 rounded-lg shadow-sm flex items-center space-x-1.5 self-start sm:self-auto shrink-0 transition"
                                >
                                    <i class="fa-solid fa-paper-plane"></i>
                                    <span>Envoyer un mail de test</span>
                                </button>
                            )}
                        </div>
                        
                        {isSuperAdmin && (
                            <form onSubmit={handleAddContact} class="flex flex-col sm:flex-row gap-2 mb-6">
                                <input required type="text" placeholder="Nom ou prénom..." value={newContactNom} onChange={e => setNewContactNom(e.target.value)} class="border rounded-lg px-3 py-2 text-sm outline-none flex-1" />
                                <input required type="email" placeholder="Adresse e-mail..." value={newContactEmail} onChange={e => setNewContactEmail(e.target.value)} class="border rounded-lg px-3 py-2 text-sm outline-none flex-1" />
                                <button type="submit" class="bg-pompier-navy hover:bg-blue-900 text-white font-bold px-4 py-2 rounded-lg text-sm transition"><i class="fa-solid fa-plus mr-1"></i> Ajouter</button>
                            </form>
                        )}

                        <div class="divide-y border rounded-lg overflow-hidden">
                            {Object.entries(contactsAlerte).length === 0 ? (
                                <p class="p-4 text-sm text-gray-400 text-center italic">Aucun contact d'alerte enregistré.</p>
                            ) : (
                                Object.entries(contactsAlerte).map(([id, contact]) => (
                                    <div key={id} class="flex justify-between items-center p-4 hover:bg-gray-50">
                                        <div>
                                            <p class="font-bold text-gray-800">{contact.nom}</p>
                                            <p class="text-xs text-gray-500">{contact.email}</p>
                                        </div>
                                        <div class="flex items-center space-x-3">
                                            <button 
                                                onClick={() => handleToggleContact(id, contact.actif)} 
                                                class={`px-3 py-1 rounded-full text-xs font-bold transition ${contact.actif ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'}`}
                                                title="Activer ou désactiver l'envoi pour ce contact"
                                            >
                                                {contact.actif ? '● Actif' : '○ En pause'}
                                            </button>
                                            {isSuperAdmin && (
                                                <button onClick={() => handleDeleteContact(id, contact.nom)} class="text-gray-400 hover:text-red-500 p-1"><i class="fa-solid fa-trash"></i></button>
                                            )}
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>

                    <div class={`grid grid-cols-1 ${isSuperAdmin ? 'md:grid-cols-3' : 'max-w-md mx-auto'} gap-6`}>
                        <div class="md:col-span-1 bg-white p-5 rounded-xl shadow-sm border border-gray-200 self-start">
                            <h3 class="font-bold text-lg text-pompier-navy mb-4"><i class="fa-solid fa-key mr-2"></i>Nouveau code</h3>
                            <form onSubmit={handleAddCode} class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-gray-600 mb-1">Nom / Fonction</label>
                                    <input required type="text" placeholder="ex: Président, Trésorier..." value={newNom} onChange={e => setNewNom(e.target.value)} class="w-full border rounded-lg p-2 text-sm outline-none focus:border-pompier-navy" />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-600 mb-1">Code PIN (4 chiffres)</label>
                                    <input required type="password" pattern="[0-9]*" inputMode="numeric" maxLength="4" placeholder="****" value={newPin} onChange={e => setNewPin(e.target.value)} class="w-full border rounded-lg p-2 text-center text-lg font-bold tracking-[0.2em] outline-none focus:border-pompier-navy" />
                                </div>
                                <button type="submit" class="w-full bg-pompier-navy hover:bg-blue-900 text-white font-bold py-2 rounded-lg transition-colors text-sm shadow-sm">
                                    <i class="fa-solid fa-plus mr-1"></i> Créer ce code
                                </button>
                            </form>
                        </div>

                        {isSuperAdmin && (
                            <div class="md:col-span-2 bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                                <div class="bg-gray-50 px-5 py-3 border-b border-gray-200">
                                    <h3 class="font-bold text-gray-700">Codes autorisés</h3>
                                </div>
                                <div class="divide-y divide-gray-100">
                                    {Object.entries(codesBureau).map(([id, data]) => (
                                        <div key={id} class="flex justify-between items-center px-5 py-4 hover:bg-gray-50">
                                            <div class="flex items-center space-x-3">
                                                <div class="w-10 h-10 rounded-full bg-blue-100 text-pompier-navy flex items-center justify-center font-bold text-xl">
                                                    <i class="fa-solid fa-user-shield text-sm"></i>
                                                </div>
                                                <div>
                                                    <p class="font-bold text-gray-800">{data.nom}</p>
                                                    <p class="text-xs text-gray-500 font-mono">PIN: {data.pin}</p>
                                                </div>
                                            </div>
                                            <button onClick={() => handleDeleteCode(id, data.nom)} class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 rounded transition-colors" title="Supprimer">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>
                                        </div>
                                    ))}
                                    <div class="flex justify-between items-center px-5 py-4 bg-gray-50 border-t-2 border-gray-200 opacity-60">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-10 h-10 rounded-full bg-gray-300 text-gray-600 flex items-center justify-center font-bold text-xl">
                                                <i class="fa-solid fa-crown text-sm"></i>
                                            </div>
                                            <div>
                                                <p class="font-bold text-gray-700">Code Administrateur & Purge</p>
                                                <p class="text-xs text-gray-500 italic">Codé en dur dans l'application</p>
                                            </div>
                                        </div>
                                        <div class="text-xs text-gray-400 px-2"><i class="fa-solid fa-lock"></i></div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
