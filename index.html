                                                        <p class="text-[11px] text-gray-500">{item.format} · Seuil {item.seuil}</p>
                                                        {eanCount > 0 && (
                                                            <span class="inline-block mt-1 text-[9px] font-bold px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200">
                                                                <i class="fa-solid fa-barcode mr-0.5"></i>{eanCount} EAN
                                                            </span>
                                                        )}
                                                    </div>

                                                    <div class="mt-3 pt-2 border-t border-gray-200 flex items-center justify-between">
                                                        {!inventoryMode ? (
                                                            <>
                                                                <button onClick={() => handleOpenRestock(item, null)} class="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] px-2.5 py-1.5 rounded-lg font-bold shadow-sm">
                                                                    + Entrée
                                                                </button>
                                                                <div class="text-right">
                                                                    <span class="text-[9px] text-gray-400 uppercase block leading-none">Stock</span>
                                                                    <span class={`font-extrabold text-lg leading-none ${isAlert ? 'text-red-600' : 'text-pompier-navy'}`}>{item.quantite}</span>
                                                                </div>
                                                            </>
                                                        ) : (
                                                            <div class="w-full flex items-center justify-between">
                                                                <span class="text-[10px] text-gray-500">Théo: {item.quantite}</span>
                                                                <div class="flex items-center bg-white border border-amber-400 rounded px-1">
                                                                    <button type="button" onClick={() => handleInventoryChange(item.id, Math.max(0, Number(invVal) - 1))} class="px-1.5 font-bold">-</button>
                                                                    <input type="number" min="0" value={invVal} onChange={e => handleInventoryChange(item.id, e.target.value)} class="w-10 text-center font-bold text-sm outline-none" />
                                                                    <button type="button" onClick={() => handleInventoryChange(item.id, Number(invVal) + 1)} class="px-1.5 font-bold">+</button>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'commandes' && isAdmin && (
                            <CommandesTab 
                                stock={stockArray} 
                                fournisseurs={fournisseurs} 
                                contactsAlerte={contactsAlerte} 
                            />
                        )}

                        {activeTab === 'historique' && isAdmin && (
                            <HistoriqueTab db={db} CODE_PURGE={CODE_PURGE} isSuperAdmin={isSuperAdmin} />
                        )}

                        {activeTab === 'fournisseurs' && isAdmin && (
                            <div class="no-print">
                                <div class="bg-blue-50 border-l-4 border-pompier-navy p-4 rounded-xl shadow-sm mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                    <div class="space-y-1">
                                        <div class="flex items-center space-x-2">
                                            <span class="bg-pompier-navy text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">Coordonnées Officielles (Figées)</span>
                                        </div>
                                        <h3 class="font-bold text-pompier-navy text-base">{AMICALE_INFO.nom}</h3>
                                        <p class="text-xs text-gray-700">
                                            <i class="fa-solid fa-location-dot text-pompier-red mr-1"></i> {AMICALE_INFO.adresse} · 
                                            <i class="fa-solid fa-envelope text-pompier-red mx-1.5"></i> {AMICALE_INFO.email}
                                        </p>
                                        <p class="text-xs text-gray-700">
                                            <i class="fa-solid fa-user-tie text-pompier-navy mr-1"></i> Contact : <strong>{AMICALE_INFO.contact}</strong> ({AMICALE_INFO.telFormat})
                                        </p>
                                    </div>
                                    <button 
                                        onClick={handleCopyAmicaleInfo}
                                        class="bg-white hover:bg-gray-100 text-pompier-navy border border-blue-200 px-3 py-2 rounded-lg text-xs font-bold shadow-sm flex items-center space-x-1.5 shrink-0 transition"
                                    >
                                        <i class="fa-regular fa-copy"></i>
                                        <span>Copier nos coordonnées</span>
                                    </button>
                                </div>

                                <div class="flex justify-between items-center mb-6">
                                    <h2 class="text-2xl font-bold text-pompier-navy">Fournisseurs</h2>
                                    <button onClick={handleAddFournisseur} class="bg-pompier-navy text-white px-4 py-2 rounded shadow hover:bg-blue-900">
                                        <i class="fa-solid fa-plus mr-2"></i> Ajouter
                                    </button>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {Object.entries(fournisseurs).map(([id, f]) => (
                                        <div key={id} class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 relative group">
                                            <button onClick={() => handleRemoveFournisseur(id)} class="absolute top-4 right-4 text-gray-400 hover:text-red-500 transition-colors" title="Supprimer ce fournisseur"><i class="fa-solid fa-trash"></i></button>
                                            <h3 class="font-bold text-lg mb-3 text-pompier-navy pr-8">{f.nom}</h3>
                                            <div class="space-y-2">
                                                <div class="flex items-center">
                                                    <i class="fa-solid fa-id-card w-6 text-pompier-navy" title="Numéro de compte client"></i>
                                                    <input 
                                                        type="text" 
                                                        placeholder="N° de compte client (optionnel)" 
                                                        value={f.numCompte || ''} 
                                                        onChange={(e) => handleUpdateFournisseur(id, 'numCompte', e.target.value)} 
                                                        class="flex-1 bg-blue-50/60 border border-blue-200 rounded px-2 py-1 text-sm font-semibold text-pompier-navy outline-none focus:border-pompier-red"
                                                    />
                                                </div>
                                                <div class="flex items-center">
                                                    <i class="fa-solid fa-location-dot w-6 text-gray-400" title="Adresse postale du fournisseur"></i>
                                                    <input 
                                                        type="text" 
                                                        placeholder="Adresse postale (Rue, CP, Ville)" 
                                                        value={f.adresse || ''} 
                                                        onChange={(e) => handleUpdateFournisseur(id, 'adresse', e.target.value)} 
                                                        class="flex-1 bg-gray-50 border rounded px-2 py-1 text-sm outline-none focus:border-pompier-red"
                                                    />
                                                </div>
                                                <div class="flex items-center"><i class="fa-solid fa-envelope w-6 text-gray-400"></i><input type="email" placeholder="Email" value={f.email || ''} onChange={(e) => handleUpdateFournisseur(id, 'email', e.target.value)} class="flex-1 bg-gray-50 border rounded px-2 py-1 text-sm outline-none focus:border-pompier-red"/></div>
                                                <div class="flex items-center"><i class="fa-solid fa-phone w-6 text-gray-400"></i><input type="tel" placeholder="Téléphone" value={f.tel || ''} onChange={(e) => handleUpdateFournisseur(id, 'tel', e.target.value)} class="flex-1 bg-gray-50 border rounded px-2 py-1 text-sm outline-none focus:border-pompier-red"/></div>
                                                <div class="flex items-center">
                                                    <i class="fa-solid fa-globe w-6 text-gray-400"></i>
                                                    <input type="url" placeholder="Site web (https://...)" value={f.siteWeb || ''} onChange={(e) => handleUpdateFournisseur(id, 'siteWeb', e.target.value)} class="flex-1 bg-gray-50 border rounded px-2 py-1 text-sm outline-none focus:border-pompier-red"/>
                                                    {f.siteWeb && (
                                                        <a href={f.siteWeb.startsWith('http') ? f.siteWeb : `https://${f.siteWeb}`} target="_blank" rel="noopener noreferrer" class="ml-2 text-pompier-navy hover:text-blue-600 transition-colors" title="Visiter le site">
                                                            <i class="fa-solid fa-arrow-up-right-from-square text-lg"></i>
                                                        </a>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'securite' && isAdmin && (
                            <SecuriteTab 
                                db={db} 
                                codesBureau={codesBureau} 
                                contactsAlerte={contactsAlerte} 
                                CODE_PURGE={CODE_PURGE} 
                                isSuperAdmin={isSuperAdmin}
                                itemsInAlert={itemsInAlert}
                                stockArray={stockArray}
                                triggerEmailAlerts={triggerEmailAlerts}
                                utilisateur={utilisateur}
                            />
                        )}
                    </main>

                    {showAdminLogin && (
                        <div class="no-print fixed inset-0 bg-pompier-anthracite bg-opacity-75 flex items-center justify-center p-4 z-50">
                            <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full overflow-hidden">
                                <div class="bg-pompier-navy text-white px-5 py-4 flex justify-between items-center">
                                    <h2 class="text-lg font-bold"><i class="fa-solid fa-lock mr-2"></i>Accès Bureau</h2>
                                    <button onClick={() => {setShowAdminLogin(false); setAdminPin('');}} class="text-white hover:text-gray-200"><i class="fa-solid fa-times text-xl"></i></button>
                                </div>
                                <form onSubmit={handleAdminLogin} class="p-6 space-y-5">
                                    <p class="text-sm text-gray-600 text-center">Saisis ton code PIN ou le code Administrateur.</p>
                                    <div>
                                        <input 
                                            autoFocus
                                            required 
                                            type="password" 
                                            pattern="[0-9]*"
                                            inputMode="numeric"
                                            maxLength="4"
                                            placeholder="Code à 4 chiffres"
                                            value={adminPin} 
                                            onChange={e => setAdminPin(e.target.value)} 
                                            class="w-full border-2 border-pompier-navy rounded-lg p-3 text-2xl font-bold text-center outline-none tracking-[0.5em] focus:ring-2 focus:ring-blue-400" 
                                        />
                                    </div>
                                    <button type="submit" class="w-full bg-pompier-navy hover:bg-blue-900 text-white font-bold py-3 rounded-lg shadow-md transition-colors">Déverrouiller</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODALE CRÉATION / MODIFICATION PRODUIT AVEC MULTI-CODES EAN ET CONTENANCE (MULTIPLICATEUR) */}
                    {showProductModal && editingProduct && isAdmin && (
                        <div class="no-print fixed inset-0 bg-pompier-anthracite bg-opacity-75 flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full overflow-hidden my-4">
                                <div class="bg-pompier-navy text-white px-6 py-4 flex justify-between items-center border-b-4 border-pompier-red">
                                    <h2 class="text-xl font-bold">{editingProduct.id ? 'Modifier le produit' : 'Nouveau Produit'}</h2>
                                    <button onClick={() => setShowProductModal(false)} class="text-white"><i class="fa-solid fa-times text-xl"></i></button>
                                </div>
                                <form onSubmit={handleSaveProduct} class="p-6 space-y-4 max-h-[82vh] overflow-y-auto">
                                    <div>
                                        <label class="block text-sm font-bold mb-1">Nom de l'article *</label>
                                        <input required type="text" placeholder="Ex: Coca-Cola" value={editingProduct.nom} onChange={e => setEditingProduct({...editingProduct, nom: e.target.value})} class="w-full border rounded-lg p-2 outline-none focus:border-pompier-navy" />
                                    </div>
                                    <div class="flex space-x-3">
                                        <div class="flex-1">
                                            <label class="block text-sm font-bold mb-1">Famille *</label>
                                            <select required value={editingProduct.famille} onChange={e => setEditingProduct({...editingProduct, famille: e.target.value})} class="w-full border rounded-lg p-2 bg-white font-semibold">
                                                {famillesList.map(f => <option key={f.id} value={f.nom}>{f.icon ? `${f.icon} ` : ''}{f.nom}</option>)}
                                            </select>
                                        </div>
                                        <div class="flex-1">
                                            <label class="block text-sm font-bold mb-1">Unité comptée en stock *</label>
                                            <input required type="text" placeholder="Ex: Canette 33cl, Bouteille..." value={editingProduct.format} onChange={e => setEditingProduct({...editingProduct, format: e.target.value})} class="w-full border rounded-lg p-2 outline-none focus:border-pompier-navy" />
                                        </div>
                                    </div>
                                    <div class="flex space-x-3">
                                        <div class="flex-1">
                                            <label class="block text-sm font-bold mb-1">Seuil d'alerte (en unités)</label>
                                            <input required type="number" min="0" value={editingProduct.seuil} onChange={e => setEditingProduct({...editingProduct, seuil: e.target.value})} class="w-full border rounded-lg p-2 outline-none focus:border-pompier-navy" />
                                        </div>
                                        {!editingProduct.id && (
                                            <div class="flex-1">
                                                <label class="block text-sm font-bold mb-1">Stock initial (en unités)</label>
                                                <input required type="number" min="0" value={editingProduct.quantite} onChange={e => setEditingProduct({...editingProduct, quantite: e.target.value})} class="w-full border rounded-lg p-2 outline-none focus:border-pompier-navy" />
                                            </div>
                                        )}
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold mb-1">Fournisseur attitré</label>
                                        <select value={editingProduct.fournisseurId} onChange={e => setEditingProduct({...editingProduct, fournisseurId: e.target.value})} class="w-full border rounded-lg p-2 bg-white">
                                            <option value="">-- Aucun --</option>
                                            {Object.entries(fournisseurs).map(([fId, f]) => <option key={fId} value={fId}>{f.nom}{f.numCompte ? ` (Compte: ${f.numCompte})` : ''}</option>)}
                                        </select>
                                    </div>

                                    {/* SECTION MULTI-CODES BARRES EAN AVEC MULTIPLICATEUR PAR PACK */}
                                    <div class="bg-blue-50/70 border border-blue-200 rounded-xl p-3.5 space-y-3">
                                        <div class="flex justify-between items-center">
                                            <div>
                                                <span class="text-xs font-extrabold uppercase text-pompier-navy block">
                                                    <i class="fa-solid fa-barcode text-pompier-red mr-1.5"></i>Codes-barres EAN ({editingProduct.codesEan.length})
                                                </span>
                                                <span class="text-[10px] text-gray-500">Indique combien d'unités contient chaque pack pour les entrées de stock</span>
                                            </div>
                                            <button 
                                                type="button" 
                                                onClick={() => setShowProductEanScanner(true)}
                                                class="bg-pompier-navy hover:bg-blue-900 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm flex items-center space-x-1.5 shrink-0"
                                            >
                                                <i class="fa-solid fa-camera"></i>
                                                <span>Scanner</span>
                                            </button>
                                        </div>

                                        {editingProduct.codesEan.length > 0 ? (
                                            <div class="space-y-1.5">
                                                {editingProduct.codesEan.map((entry) => (
                                                    <div key={entry.code} class="bg-white border border-blue-200 rounded-lg p-2 flex items-center justify-between gap-2 text-xs">
                                                        <div class="min-w-0 flex-1">
                                                            <input 
                                                                type="text"
                                                                list="ean-labels-suggestions"
                                                                value={entry.label}
                                                                onChange={e => handleUpdateEanLabel(entry.code, e.target.value)}
                                                                class="font-bold text-pompier-navy bg-gray-50 border border-gray-200 focus:border-pompier-navy focus:bg-white rounded px-1.5 py-0.5 w-full outline-none"
                                                                title="Libellé du conditionnement (ex: Pack de 6, Pack de 24, Unité)"
                                                            />
                                                            <div class="font-mono text-gray-400 text-[10px] px-1 mt-0.5">{entry.code}</div>
                                                        </div>

                                                        <div class="flex items-center space-x-1 bg-emerald-50 border border-emerald-200 rounded-lg px-2 py-1 shrink-0" title="Nombre d'unités ajoutées au stock quand on rentre 1 pack de ce code">
                                                            <span class="text-[10px] font-bold text-emerald-800">×</span>
                                                            <input 
                                                                type="number" 
                                                                min="1"
                                                                value={entry.multiplier !== undefined ? entry.multiplier : 1}
                                                                onChange={e => handleUpdateEanMultiplier(entry.code, e.target.value)}
                                                                onFocus={e => e.target.select()}
                                                                class="w-10 text-center font-extrabold text-emerald-900 bg-transparent outline-none text-xs"
                                                            />
                                                            <span class="text-[9px] text-emerald-700 font-semibold">u.</span>
                                                        </div>

                                                        <div class="flex items-center space-x-1 shrink-0">
                                                            <button 
                                                                type="button"
                                                                onClick={() => handleSetOrderEan(entry.code)}
                                                                class={`px-2 py-1 rounded text-[10px] font-bold border transition ${entry.isOrderCode ? 'bg-amber-100 border-amber-400 text-amber-900' : 'bg-gray-50 border-gray-200 text-gray-400 hover:text-gray-600'}`}
                                                                title="Afficher ce code EAN sur les Bons de Commande"
                                                            >
                                                                <i class="fa-solid fa-star"></i>
                                                            </button>
                                                            <button 
                                                                type="button"
                                                                onClick={() => handleRemoveEanFromProduct(entry.code)}
                                                                class="text-gray-400 hover:text-red-500 p-1"
                                                                title="Retirer ce code"
                                                            >
                                                                <i class="fa-solid fa-trash"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        ) : (
                                            <p class="text-[11px] text-gray-500 italic">Aucun code-barres enregistré. Scanne ou ajoute un code ci-dessous.</p>
                                        )}

                                        <div class="pt-2 border-t border-blue-200/80 grid grid-cols-1 sm:grid-cols-12 gap-2">
                                            <input 
                                                type="text" 
                                                inputMode="numeric"
                                                placeholder="N° EAN-13..." 
                                                value={newEanCodeInput}
                                                onChange={e => setNewEanCodeInput(e.target.value)}
                                                class="sm:col-span-4 bg-white border border-gray-300 rounded-lg px-2.5 py-1.5 text-xs font-mono outline-none focus:border-pompier-navy"
                                            />
                                            <input 
                                                type="text" 
                                                list="ean-labels-suggestions"
                                                placeholder="Ex: Pack de 6..." 
                                                value={newEanLabelInput}
                                                onChange={e => {
                                                    const val = e.target.value;
                                                    setNewEanLabelInput(val);
                                                    setNewEanMultiplierInput(guessMultiplierFromLabel(val));
                                                }}
                                                class="sm:col-span-4 bg-white border border-gray-300 rounded-lg px-2.5 py-1.5 text-xs outline-none focus:border-pompier-navy"
                                            />
                                            <div class="sm:col-span-2 flex items-center bg-white border border-gray-300 rounded-lg px-2 py-1" title="Nombre d'unités dans ce conditionnement">
                                                <span class="text-[10px] text-gray-400 font-bold mr-1">×</span>
                                                <input 
                                                    type="number" 
                                                    min="1"
                                                    value={newEanMultiplierInput}
                                                    onChange={e => setNewEanMultiplierInput(e.target.value)}
                                                    class="w-full text-center font-bold text-xs text-pompier-navy outline-none"
                                                />
                                            </div>
                                            <datalist id="ean-labels-suggestions">
                                                <option value="Pack de 24" />
                                                <option value="Pack de 12" />
                                                <option value="Pack de 6" />
                                                <option value="Canette / Unité" />
                                                <option value="Bouteille / Unité" />
                                                <option value="Carton de 24" />
                                            </datalist>
                                            <button 
                                                type="button"
                                                onClick={() => handleAddEanToProduct(newEanCodeInput, newEanLabelInput, newEanMultiplierInput)}
                                                class="sm:col-span-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg py-1.5 text-xs"
                                            >
                                                + Lier
                                            </button>
                                        </div>
                                    </div>

                                    <div class="pt-1">
                                        <label class="flex items-center justify-between p-3 rounded-lg border bg-gray-50 cursor-pointer">
                                            <div>
                                                <span class="text-sm font-bold text-pompier-navy block">Surveillance & Alerte mail</span>
                                                <span class="text-xs text-gray-500">Décochez pour suspendre temporairement cet article</span>
                                            </div>
                                            <input 
                                                type="checkbox" 
                                                checked={editingProduct.alerteActive !== false} 
                                                onChange={e => setEditingProduct({...editingProduct, alerteActive: e.target.checked})}
                                                class="w-5 h-5 accent-pompier-navy rounded cursor-pointer"
                                            />
                                        </label>
                                    </div>
                                    <div class="pt-2">
                                        <button type="submit" class="w-full bg-pompier-red text-white font-bold py-3 rounded-lg shadow-md"><i class="fa-solid fa-check mr-2"></i>Valider</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* SCANNER CAMÉRA POUR AJOUTER UN CODE DANS LA FICHE PRODUIT */}
                    <BarcodeScannerModal 
                        isOpen={showProductEanScanner}
                        onClose={() => setShowProductEanScanner(false)}
                        title="Scanner un code-barres à associer"
                        onDetected={(code) => {
                            setShowProductEanScanner(false);
                            handleAddEanToProduct(code, newEanLabelInput, newEanMultiplierInput);
                        }}
                    />

                    {/* SCANNER CAMÉRA POUR ENTRÉE DE STOCK (ONGLET STOCKS) */}
                    <BarcodeScannerModal 
                        isOpen={showStockEntryScanner}
                        onClose={() => setShowStockEntryScanner(false)}
                        title="Scanner une livraison (Entrée de stock)"
                        onDetected={handleStockTabScanDetected}
                    />

                    {/* MODALE CODE INCONNU (MODE BUREAU / ADMIN) AVEC CONTENANCE DU PACK */}
                    {unknownEanModalCode && isAdmin && (
                        <div class="no-print fixed inset-0 bg-pompier-anthracite bg-opacity-75 flex items-center justify-center p-4 z-50">
                            <div class="bg-white rounded-xl shadow-2xl max-w-md w-full overflow-hidden">
                                <div class="bg-amber-500 text-white px-5 py-4 flex justify-between items-center">
                                    <h2 class="text-lg font-bold"><i class="fa-solid fa-circle-question mr-2"></i>Code-barres non reconnu</h2>
                                    <button onClick={() => setUnknownEanModalCode(null)} class="text-white"><i class="fa-solid fa-times text-xl"></i></button>
                                </div>
                                <div class="p-5 space-y-4">
                                    <div class="bg-gray-100 border rounded-lg p-3 text-center">
                                        <span class="text-xs text-gray-500 block">Code scanné :</span>
                                        <span class="font-mono font-extrabold text-lg text-pompier-navy">{unknownEanModalCode}</span>
                                    </div>

                                    {stockArray.length > 0 && (
                                        <form onSubmit={handleAssociateUnknownEan} class="space-y-3 border-b pb-4">
                                            <p class="text-xs font-bold uppercase text-pompier-navy">Option 1 : Associer à un produit existant</p>
                                            <select 
                                                value={associateProductId} 
                                                onChange={e => setAssociateProductId(e.target.value)}
                                                class="w-full border rounded-lg p-2 text-sm bg-white font-semibold"
                                            >
                                                {stockArray.map(item => (
                                                    <option key={item.id} value={item.id}>{item.nom} ({item.format})</option>
                                                ))}
                                            </select>
                                            <div class="grid grid-cols-3 gap-2">
                                                <div class="col-span-2">
                                                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-0.5">Conditionnement</label>
                                                    <input 
                                                        type="text" 
                                                        list="ean-labels-suggestions"
                                                        placeholder="Ex: Pack de 6, Unité..." 
                                                        value={associateLabel}
                                                        onChange={e => {
                                                            const val = e.target.value;
                                                            setAssociateLabel(val);
                                                            setAssociateMultiplier(guessMultiplierFromLabel(val));
                                                        }}
                                                        class="w-full border rounded-lg p-2 text-sm"
                                                    />
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-0.5">Unités / Pack</label>
                                                    <div class="flex items-center border rounded-lg p-2 bg-emerald-50 border-emerald-300">
                                                        <span class="text-xs font-bold text-emerald-700 mr-1">×</span>
                                                        <input 
                                                            type="number" 
                                                            min="1"
                                                            value={associateMultiplier}
                                                            onChange={e => setAssociateMultiplier(e.target.value)}
                                                            onFocus={e => e.target.select()}
                                                            class="w-full font-extrabold text-sm text-emerald-900 bg-transparent outline-none text-center"
                                                        />
                                                    </div>
                                                </div>
                                            </div>
                                            <button type="submit" class="w-full bg-pompier-navy hover:bg-blue-900 text-white font-bold py-2.5 rounded-lg text-sm">
                                                <i class="fa-solid fa-link mr-1.5"></i>Associer à cet article
                                            </button>
                                        </form>
                                    )}

                                    <div>
                                        <p class="text-xs font-bold uppercase text-gray-500 mb-2">Option 2 : Nouvel article</p>
                                        <button 
                                            type="button"
                                            onClick={() => {
                                                const codeToUse = unknownEanModalCode;
                                                setUnknownEanModalCode(null);
                                                handleOpenAddModal(codeToUse);
                                            }}
                                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm"
                                        >
                                            <i class="fa-solid fa-plus mr-1.5"></i>Créer un nouveau produit avec ce code
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODALE GESTION DES FAMILLES, ICÔNES EMOJI & ORDRE D'AFFICHAGE */}
                    {showManageFamillesModal && isAdmin && (
                        <div class="no-print fixed inset-0 bg-pompier-anthracite bg-opacity-75 flex items-center justify-center p-4 z-50">
                            <div class="bg-white rounded-xl shadow-2xl max-w-md w-full overflow-hidden">
                                <div class="bg-pompier-navy text-white px-5 py-4 flex justify-between items-center border-b-4 border-pompier-red">
                                    <h2 class="text-lg font-bold"><i class="fa-solid fa-tags mr-2"></i>Familles, Icônes & Ordre</h2>
                                    <button onClick={() => setShowManageFamillesModal(false)} class="text-white"><i class="fa-solid fa-times text-xl"></i></button>
                                </div>
                                <div class="p-5 space-y-4">
                                    <form onSubmit={handleAddFamille} class="space-y-2.5 bg-gray-50 p-3 rounded-xl border border-gray-200">
                                        <label class="block text-xs font-bold text-pompier-navy uppercase">Créer une nouvelle famille :</label>
                                        <div class="flex space-x-2">
                                            <input 
                                                type="text" 
                                                maxLength="4"
                                                value={newFamilleIcon} 
                                                onChange={e => setNewFamilleIcon(e.target.value)} 
                                                class="w-12 border rounded-lg py-2 text-center text-lg bg-white outline-none focus:border-pompier-navy"
                                                title="Icône ou emoji"
                                            />
                                            <input 
                                                required 
                                                type="text" 
                                                placeholder="Nom de la famille..." 
                                                value={newFamilleInput} 
                                                onChange={e => setNewFamilleInput(e.target.value)} 
                                                class="flex-1 border rounded-lg px-3 py-2 text-sm bg-white outline-none focus:border-pompier-navy" 
                                            />
                                            <button type="submit" class="bg-pompier-navy text-white px-4 py-2 rounded-lg font-bold text-sm shrink-0">
                                                <i class="fa-solid fa-plus mr-1"></i>Créer
                                            </button>
                                        </div>
                                        <div class="flex flex-wrap gap-1 pt-1">
                                            {EMOJI_SUGGESTIONS.map(em => (
                                                <button 
                                                    key={em} 
                                                    type="button" 
                                                    onClick={() => setNewFamilleIcon(em)}
                                                    class={`w-7 h-7 rounded border text-sm flex items-center justify-center transition ${newFamilleIcon === em ? 'bg-pompier-navy border-pompier-navy text-white scale-110' : 'bg-white border-gray-200 hover:bg-gray-100'}`}
                                                >
                                                    {em}
                                                </button>
                                            ))}
                                        </div>
                                    </form>

                                    <p class="text-xs text-gray-500">
                                        Clique sur l'emoji d'une famille pour le changer, ou utilise les flèches <strong>▲ / ▼</strong> pour modifier l'ordre des boutons :
                                    </p>

                                    <div class="divide-y max-h-72 overflow-y-auto border rounded-xl">
                                        {famillesList.map((fam, idx) => {
                                            const count = stockArray.filter(i => i.famille === fam.nom).length;
                                            return (
                                                <div key={fam.id} class="flex justify-between items-center p-2.5 hover:bg-gray-50">
                                                    <div class="flex items-center space-x-2 min-w-0">
                                                        <span class="w-5 h-5 rounded-full bg-pompier-navy text-white text-[10px] font-bold flex items-center justify-center shrink-0">
                                                            {idx + 1}
                                                        </span>
                                                        <input 
                                                            type="text" 
                                                            maxLength="4"
                                                            value={fam.icon || ''} 
                                                            placeholder="🏷️"
                                                            onChange={e => handleUpdateFamilleIcon(fam.id, e.target.value)}
                                                            class="w-10 h-9 border border-gray-200 hover:border-gray-300 focus:border-pompier-navy rounded-lg text-center text-base bg-white outline-none shrink-0"
                                                            title="Modifier l'emoji de cette famille"
                                                        />
                                                        <div class="truncate">
                                                            <span class="font-bold text-sm text-pompier-navy block truncate">{fam.nom}</span>
                                                            <span class="text-[11px] text-gray-400 block">{count} produit(s)</span>
                                                        </div>
                                                    </div>
                                                    <div class="flex items-center space-x-1 shrink-0">
                                                        <button 
                                                            type="button"
                                                            onClick={() => handleMoveFamille(idx, -1)} 
                                                            disabled={idx === 0}
                                                            class={`w-8 h-8 rounded-lg border flex items-center justify-center transition ${idx === 0 ? 'text-gray-300 border-gray-100 cursor-not-allowed' : 'text-pompier-navy border-gray-300 hover:bg-blue-50'}`}
                                                            title="Monter cette famille"
                                                        >
                                                            <i class="fa-solid fa-arrow-up text-xs"></i>
                                                        </button>
                                                        <button 
                                                            type="button"
                                                            onClick={() => handleMoveFamille(idx, 1)} 
                                                            disabled={idx === famillesList.length - 1}
                                                            class={`w-8 h-8 rounded-lg border flex items-center justify-center transition ${idx === famillesList.length - 1 ? 'text-gray-300 border-gray-100 cursor-not-allowed' : 'text-pompier-navy border-gray-300 hover:bg-blue-50'}`}
                                                            title="Descendre cette famille"
                                                        >
                                                            <i class="fa-solid fa-arrow-down text-xs"></i>
                                                        </button>
                                                        <button 
                                                            type="button"
                                                            onClick={() => handleDeleteFamille(fam.id, fam.nom)} 
                                                            class="w-8 h-8 rounded-lg text-gray-400 hover:text-red-500 flex items-center justify-center ml-0.5"
                                                            title="Supprimer"
                                                        >
                                                            <i class="fa-solid fa-trash text-xs"></i>
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODALE ENTRÉE DE STOCK AVEC MULTIPLICATEUR AUTOMATIQUE (PACK -> UNITÉS) */}
                    {showRestockModal && restockItem && isAdmin && (() => {
                        const packCount = Math.max(0, parseInt(restockQty, 10) || 0);
                        const mult = Math.max(1, parseInt(restockMultiplier, 10) || 1);
                        const totalUnitsAdded = packCount * mult;
                        const packOptions = Array.isArray(restockItem.codesEan) ? restockItem.codesEan.filter(e => getEffectiveMultiplier(e) > 1) : [];

                        return (
                            <div class="no-print fixed inset-0 bg-pompier-anthracite bg-opacity-75 flex items-center justify-center p-4 z-50">
                                <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full overflow-hidden">
                                    <div class="bg-emerald-600 text-white px-5 py-4 flex justify-between items-center">
                                        <h2 class="text-lg font-bold"><i class="fa-solid fa-arrow-down-to-bracket mr-2"></i>Entrée de stock</h2>
                                        <button onClick={() => setShowRestockModal(false)} class="text-white"><i class="fa-solid fa-times"></i></button>
                                    </div>
                                    <form onSubmit={handleConfirmRestock} class="p-5 space-y-4">
                                        <div>
                                            {restockScannedLabel && (
                                                <span class="inline-block bg-emerald-100 text-emerald-800 text-[11px] font-bold px-2.5 py-0.5 rounded-full mb-1">
                                                    <i class="fa-solid fa-barcode mr-1"></i>Scanné : {restockScannedLabel} (×{mult} u.)
                                                </span>
                                            )}
                                            <h3 class="text-lg font-bold text-pompier-navy">{restockItem.nom}</h3>
                                            <p class="text-xs text-gray-500">Stock actuel : <strong>{restockItem.quantite}</strong> ({restockItem.format})</p>
                                        </div>

                                        {/* Choix rapide Unité ou Pack si plusieurs formats existent */}
                                        <div class="bg-gray-50 p-2.5 rounded-xl border border-gray-200 space-y-2">
                                            <span class="text-[10px] font-bold uppercase text-gray-500 block">Mode de comptage de cette entrée :</span>
                                            <div class="flex flex-wrap gap-1.5">
                                                <button 
                                                    type="button"
                                                    onClick={() => { setRestockMultiplier(1); setRestockScannedLabel('Unité'); }}
                                                    class={`px-2.5 py-1 rounded-lg text-xs font-bold border transition ${mult === 1 ? 'bg-pompier-navy text-white border-pompier-navy' : 'bg-white text-gray-600 border-gray-300'}`}
                                                >
                                                    À l'unité (×1)
                                                </button>
                                                {packOptions.map(p => {
                                                    const m = getEffectiveMultiplier(p);
                                                    return (
                                                        <button 
                                                            key={p.code}
                                                            type="button"
                                                            onClick={() => { setRestockMultiplier(m); setRestockScannedLabel(p.label); }}
                                                            class={`px-2.5 py-1 rounded-lg text-xs font-bold border transition ${mult === m && restockScannedLabel === p.label ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-gray-700 border-gray-300'}`}
                                                        >
                                                            {p.label} (×{m})
                                                        </button>
                                                    );
                                                })}
                                                {[6, 12, 24].filter(n => !packOptions.some(p => getEffectiveMultiplier(p) === n)).map(n => (
                                                    <button 
                                                        key={n}
                                                        type="button"
                                                        onClick={() => { setRestockMultiplier(n); setRestockScannedLabel(`Pack de ${n}`); }}
                                                        class={`px-2.5 py-1 rounded-lg text-xs font-bold border transition ${mult === n ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-gray-600 border-gray-300'}`}
                                                    >
                                                        Pack de {n} (×{n})
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <label class="block text-sm font-bold text-pompier-navy text-center mb-2">
                                                {mult > 1 ? `Combien de [${restockScannedLabel || `Pack de ${mult}`}] rentres-tu ?` : `Quantité d'unités à ajouter :`}
                                            </label>
                                            <div class="flex items-center justify-center space-x-3">
                                                <button 
                                                    type="button" 
                                                    onClick={() => setRestockQty(q => String(Math.max(1, (parseInt(q, 10) || 1) - 1)))}
                                                    class="w-11 h-11 rounded-xl bg-gray-100 hover:bg-gray-200 font-extrabold text-xl text-pompier-navy"
                                                >-</button>
                                                <input 
                                                    autoFocus 
                                                    required 
                                                    type="number" 
                                                    inputMode="numeric"
                                                    min="1" 
                                                    value={restockQty} 
                                                    onChange={e => setRestockQty(e.target.value)} 
                                                    onFocus={e => e.target.select()}
                                                    class="w-24 border-2 border-emerald-500 rounded-xl p-2 text-2xl font-extrabold text-center text-pompier-navy outline-none focus:ring-2 focus:ring-emerald-300" 
                                                />
                                                <button 
                                                    type="button" 
                                                    onClick={() => setRestockQty(q => String((parseInt(q, 10) || 1) + 1))}
                                                    class="w-11 h-11 rounded-xl bg-emerald-600 hover:bg-emerald-700 font-extrabold text-xl text-white"
                                                >+</button>
                                            </div>
                                        </div>

                                        {/* Affichage clair de la conversion en unités */}
                                        <div class="bg-emerald-50 border border-emerald-300 rounded-xl p-3 text-center">
                                            <span class="text-xs text-emerald-800 block">Mise à jour automatique du stock :</span>
                                            <span class="font-extrabold text-base text-emerald-900">
                                                {mult > 1 ? `${packCount} × ${mult} = +${totalUnitsAdded} unités ajoutées` : `+${totalUnitsAdded} unité(s) ajoutée(s)`}
                                            </span>
                                            <span class="text-[11px] text-emerald-700 block mt-0.5">
                                                Nouveau stock : <strong>{(restockItem.quantite || 0) + totalUnitsAdded}</strong>
                                            </span>
                                        </div>

                                        <div class="pt-2 border-t border-gray-100">
                                            <label class="block text-sm font-bold text-gray-700 mb-1.5">Qui fait cette entrée ?</label>
                                            <div class="flex items-center bg-gray-50 border rounded-lg px-3 py-2 focus-within:ring-2 ring-emerald-400">
                                                <i class="fa-solid fa-user text-gray-400 mr-2"></i>
                                                <input 
                                                    type="text" 
                                                    placeholder="Ton nom / surnom..." 
                                                    value={utilisateur}
                                                    onChange={e => setUtilisateur(e.target.value)}
                                                    class="bg-transparent outline-none flex-1 text-sm font-semibold text-pompier-navy"
                                                />
                                            </div>
                                        </div>
                                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow transition-colors">
                                            Valider (+{totalUnitsAdded} en stock)
                                        </button>
                                    </form>
                                </div>
                            </div>
                        );
                    })()}
                </div>
            );
        }

        // ONGLET COMMANDES & CENTRE D'IMPRESSION A4 / PDF / MAIL AVEC PIÈCE JOINTE PDF
        function CommandesTab({ stock, fournisseurs, contactsAlerte }) {
            const [orderQties, setOrderQties] = useState({});
            const [customAddedIds, setCustomAddedIds] = useState([]);
            const [selectedFournisseurFilter, setSelectedFournisseurFilter] = useState('Tous');
            const [previewSupplierId, setPreviewSupplierId] = useState(null);
            const [orderNotes, setOrderNotes] = useState({});
            const [selectedRecipientBySupplier, setSelectedRecipientBySupplier] = useState({});
            const [addArticleSelect, setAddArticleSelect] = useState({});

            const [respNom, setRespNom] = useState(() => localStorage.getItem('foyer_resp_nom') || '');
            const [respTel, setRespTel] = useState(() => localStorage.getItem('foyer_resp_tel') || '');
            const [respEmail, setRespEmail] = useState(() => localStorage.getItem('foyer_resp_email') || '');

            const handleRespNomChange = (val) => {
                setRespNom(val);
                localStorage.setItem('foyer_resp_nom', val);
            };

            const handleRespTelChange = (val) => {
                setRespTel(val);
                localStorage.setItem('foyer_resp_tel', val);
            };

            const handleRespEmailChange = (val) => {
                setRespEmail(val);
                localStorage.setItem('foyer_resp_email', val);
            };

            const verifyRespInfo = () => {
                if (!respNom.trim() || !respTel.trim()) {
                    alert("🚨 Merci de renseigner le Nom / Fonction et le Téléphone du responsable de la commande dans l'encadré en haut de la page (ces informations seront mémorisées sur ton appareil).");
                    return false;
                }
                return true;
            };

            // Initialiser avec les produits actifs en alerte (calcul intelligent du nombre de packs selon le seuil en unités)
            useEffect(() => {
                setOrderQties(prev => {
                    const next = { ...prev };
                    stock.forEach(item => {
                        const isAlert = item.alerteActive !== false && item.quantite <= item.seuil;
                        if (isAlert && next[item.id] === undefined) {
                            const primaryEan = getPrimaryEan(item);
                            const packMult = primaryEan ? getEffectiveMultiplier(primaryEan) : guessMultiplierFromLabel(item.format);
                            const unitsNeeded = Math.max(1, (item.seuil - item.quantite) + (packMult > 1 ? packMult : 2));
                            next[item.id] = packMult > 1
                                ? Math.max(1, Math.ceil((item.seuil - item.quantite + 1) / packMult))
                                : unitsNeeded;
                        }
                    });
                    return next;
                });
            }, [stock]);

            const adjustQty = (id, amount) => {
                setOrderQties(prev => ({ ...prev, [id]: Math.max(0, (Number(prev[id]) || 0) + amount) }));
            };

            const setDirectQty = (id, val) => {
                const parsed = val === '' ? 0 : Math.max(0, parseInt(val, 10) || 0);
                setOrderQties(prev => ({ ...prev, [id]: parsed }));
            };

            const handleAddExtraProduct = (fId) => {
                const prodId = addArticleSelect[fId];
                if (!prodId) return;
                if (!customAddedIds.includes(prodId)) {
                    setCustomAddedIds(prev => [...prev, prodId]);
                }
                setOrderQties(prev => ({ ...prev, [prodId]: Math.max(1, Number(prev[prodId]) || 1) }));
                setAddArticleSelect(prev => ({ ...prev, [fId]: '' }));
            };

            const handleRemoveFromOrder = (id) => {
                setOrderQties(prev => ({ ...prev, [id]: 0 }));
                setCustomAddedIds(prev => prev.filter(item => item !== id));
            };

            const supplierIds = useMemo(() => {
                const ids = Object.keys(fournisseurs);
                const hasUnassigned = stock.some(i => !i.fournisseurId || !fournisseurs[i.fournisseurId]);
                if (hasUnassigned) ids.push('unassigned');
                return ids;
            }, [fournisseurs, stock]);

            const groupedOrders = useMemo(() => {
                const groups = {};
                supplierIds.forEach(fId => {
                    const supplierProducts = stock.filter(item => {
                        const itemFId = (item.fournisseurId && fournisseurs[item.fournisseurId]) ? item.fournisseurId : 'unassigned';
                        if (itemFId !== fId) return false;
                        const isAlert = item.alerteActive !== false && item.quantite <= item.seuil;
                        const isCustom = customAddedIds.includes(item.id);
                        const hasQty = (orderQties[item.id] || 0) > 0;
                        return isAlert || isCustom || hasQty;
                    });
                    if (supplierProducts.length > 0 || fId !== 'unassigned') {
                        groups[fId] = supplierProducts;
                    }
                });
                return groups;
            }, [supplierIds, stock, fournisseurs, customAddedIds, orderQties]);

            const getOrderNumber = (fId) => {
                const now = new Date();
                const yyyy = now.getFullYear();
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const dd = String(now.getDate()).padStart(2, '0');
                const suffix = fId === 'unassigned' ? 'DIV' : fId.slice(-3).toUpperCase();
                return `BC-${yyyy}${mm}${dd}-${suffix}`;
            };

            const handleOpenPreview = (fId) => {
                if (!verifyRespInfo()) return;
                setPreviewSupplierId(fId);
            };

            const handleSendPurchaseOrderEmail = (fId, targetChoice) => {
                if (!verifyRespInfo()) return;

                const contactNomActif = respNom.trim();
                const contactTelActif = respTel.trim();
                const contactEmailActif = respEmail.trim();

                const fData = fId === 'unassigned' ? { nom: "Fournisseur Divers", numCompte: "", adresse: "", email: "", tel: "" } : (fournisseurs[fId] || { nom: "Fournisseur" });
                const items = (groupedOrders[fId] || []).filter(i => (orderQties[i.id] || 0) > 0);

                if (items.length === 0) {
                    return alert("Aucun article avec une quantité supérieure à 0 dans ce bon de commande.");
                }

                let targetEmails = [];
                let targetLabel = "";

                if (targetChoice === 'fournisseur') {
                    if (!fData.email) return alert("Aucune adresse e-mail n'est renseignée sur la fiche de ce fournisseur.");
                    targetEmails = [fData.email.trim()];
                    targetLabel = `le fournisseur ${fData.nom} (${fData.email})`;
                } else if (targetChoice === 'tous_contacts') {
                    const active = Object.values(contactsAlerte).filter(c => c.actif && c.email);
                    if (active.length === 0) return alert("Aucun contact d'alerte actif enregistré.");
                    targetEmails = active.map(c => c.email.trim());
                    targetLabel = `tous les contacts d'alerte actifs (${targetEmails.join(', ')})`;
                } else if (targetChoice && targetChoice.startsWith('contact:')) {
                    const cId = targetChoice.replace('contact:', '');
                    const cObj = contactsAlerte[cId];
                    if (!cObj || !cObj.email) return alert("Contact introuvable ou sans adresse e-mail.");
                    targetEmails = [cObj.email.trim()];
                    targetLabel = `${cObj.nom} (${cObj.email})`;
                } else {
                    return alert("Veuillez choisir un destinataire valide.");
                }

                let copyNotice = "";
                if (contactEmailActif) {
                    const alreadyIncluded = targetEmails.some(e => e.toLowerCase() === contactEmailActif.toLowerCase());
                    if (!alreadyIncluded) {
                        targetEmails.push(contactEmailActif);
                    }
                    copyNotice = `\n• Copie automatique au responsable : ${contactEmailActif}`;
                }

                const numBon = getOrderNumber(fId);
                const dateStr = new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const note = (orderNotes[fId] || '').trim();
                const totalUnitCount = items.reduce((acc, i) => acc + (Number(orderQties[i.id]) || 0), 0);
                
                const logoPublicUrl = LOGO_PUBLIC_URL;
                const cleanSupplierName = (fData.nom || 'Fournisseur').replace(/[^a-zA-Z0-9_-]/g, '_');
                const pdfFileName = `${numBon}_${cleanSupplierName}.pdf`;

                const confirmationMessage = `⚠️ Confirmation d'envoi par e-mail :\n\n` +
                    `• Document : Bon de Commande ${numBon} (${fData.nom})\n` +
                    `• Contenu : ${items.length} référence(s) (${totalUnitCount} colis/unité(s))\n` +
                    `• Responsable : ${contactNomActif} (${contactTelActif})\n` +
                    (note ? `• Observation : "${note}"\n` : '') +
                    `• Pièce jointe : ${pdfFileName}\n\n` +
                    `👉 Destinataire(s) :\n${targetLabel}${copyNotice}\n\n` +
                    `Confirmer l'envoi de cet e-mail ?`;

                if (!confirm(confirmationMessage)) {
                    return;
                }

                const rowsHtml = items.map((item, idx) => {
                    const primaryEan = getPrimaryEan(item);
                    const condLabel = primaryEan && primaryEan.label ? primaryEan.label : item.format;
                    const eanHtml = primaryEan 
                        ? `<div style="font-size:11px; color:#4b5563; font-family:monospace; margin-top:2px;">EAN : ${primaryEan.code}${primaryEan.label ? ` (${primaryEan.label})` : ''}</div>` 
                        : '';
                    return `
                        <tr style="border-bottom: 1px solid #d1d5db; background-color: ${idx % 2 === 0 ? '#ffffff' : '#f9fafb'};">
                            <td style="padding: 10px 12px; font-size: 12px; color: #4b5563; text-align: center; border: 1px solid #d1d5db;">${idx + 1}</td>
                            <td style="padding: 10px 12px; font-size: 13px; color: #1a2b4c; border: 1px solid #d1d5db;">
                                <div style="font-weight: bold;">${item.nom}</div>
                                ${eanHtml}
                            </td>
                            <td style="padding: 10px 12px; font-size: 12px; color: #4b5563; border: 1px solid #d1d5db;">${item.famille || 'Stock'}</td>
                            <td style="padding: 10px 12px; font-size: 12px; color: #374151; font-weight: 600; border: 1px solid #d1d5db;">${condLabel}</td>
                            <td style="padding: 10px 12px; font-size: 14px; font-weight: 800; color: #e3001b; text-align: center; border: 1px solid #d1d5db;">${orderQties[item.id]}</td>
                        </tr>
                    `;
                }).join('');

                const textLines = items.map(i => {
                    const primaryEan = getPrimaryEan(i);
                    const condLabel = primaryEan && primaryEan.label ? primaryEan.label : i.format;
                    const eanTxt = primaryEan ? ` [EAN: ${primaryEan.code}]` : '';
                    return `- ${orderQties[i.id]}x ${i.nom} (${condLabel})${eanTxt}`;
                }).join('\n');

                const pdfObservationsBlock = note
                    ? `
                        <div style="margin-top:18px; background-color:#fffbeb; border:1.5px solid #f59e0b; border-radius:6px; padding:10px 12px;">
                            <div style="font-size:10px; font-weight:bold; text-transform:uppercase; color:#92400e; margin-bottom:4px;">Observations / Consignes particulières :</div>
                            <div style="font-size:12px; color:#1f2937; white-space:pre-line; line-height:1.5;">${note}</div>
                        </div>
                    `
                    : `
                        <div style="margin-top:18px; border:1px dashed #9ca3af; border-radius:6px; padding:10px 12px; background-color:#fafafa;">
                            <div style="font-size:10px; font-weight:bold; text-transform:uppercase; color:#6b7280; margin-bottom:14px;">Observations / Notes manuscrites :</div>
                            <div style="border-bottom:1px dotted #d1d5db; height:16px; margin-bottom:12px;"></div>
                            <div style="border-bottom:1px dotted #d1d5db; height:16px;"></div>
                        </div>
                    `;

                const htmlEmailBody = `
                <!DOCTYPE html>
                <html lang="fr">
                <body style="margin:0; padding:0; background-color:#f3f4f6; font-family: Arial, Helvetica, sans-serif;">
                    <div style="max-width:680px; margin:20px auto; background-color:#ffffff; border-radius:10px; overflow:hidden; border:1px solid #d1d5db;">
                        <div style="background-color:#1a2b4c; color:#ffffff; padding:20px 24px; border-bottom:5px solid #e3001b;">
                            <table style="width:100%; border-collapse:collapse;">
                                <tr>
                                    <td style="width:65px; vertical-align:middle;">
                                        <img src="${logoPublicUrl}" alt="Logo" width="54" height="54" style="display:block; background:#ffffff; padding:3px; border-radius:8px; object-fit:contain;" />
                                    </td>
                                    <td style="vertical-align:middle; padding-left:10px;">
                                        <div style="font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:#fca5a5; font-weight:bold;">BON DE COMMANDE N° ${numBon}</div>
                                        <h1 style="margin:3px 0 0 0; font-size:18px; font-weight:800; text-transform:uppercase; color:#ffffff;">${AMICALE_INFO.nom}</h1>
                                        <div style="font-size:12px; color:#d1d5db; margin-top:2px;">${AMICALE_INFO.adresse} • Contact : ${contactNomActif} (${contactTelActif})</div>
                                    </td>
                                </tr>
                            </table>
                        </div>

                        <div style="padding:24px;">
                            <p style="font-size:14px; color:#1f2937; line-height:1.6; margin:0 0 16px 0;">
                                Bonjour,<br/><br/>
                                Veuillez trouver en <strong>pièce jointe (fichier PDF <em>${pdfFileName}</em>)</strong> ainsi que ci-dessous notre bon de commande N° <strong>${numBon}</strong> du <strong>${dateStr}</strong> pour l'<strong>${AMICALE_INFO.nom}</strong>.
                            </p>

                            <div style="background-color:#f8fafc; border:1px solid #cbd5e1; border-left:4px solid #1a2b4c; border-radius:6px; padding:12px 16px; margin-bottom:20px;">
                                <div style="font-size:11px; text-transform:uppercase; color:#64748b; font-weight:bold;">Fournisseur Destinataire</div>
                                <div style="font-size:16px; font-weight:800; color:#1a2b4c; margin-top:2px;">${fData.nom}</div>
                                ${fData.adresse ? `<div style="font-size:12px; color:#374151; margin-top:3px;">${fData.adresse}</div>` : ''}
                                ${fData.numCompte ? `<div style="margin-top:6px; display:inline-block; background-color:#1a2b4c; color:#ffffff; padding:3px 10px; border-radius:4px; font-size:12px; font-weight:bold;">N° DE COMPTE CLIENT : ${fData.numCompte}</div>` : ''}
                            </div>

                            <table style="width:100%; border-collapse:collapse; text-align:left; border:1px solid #d1d5db;">
                                <thead>
                                    <tr style="background-color:#1a2b4c; color:#ffffff;">
                                        <th style="padding:9px 10px; font-size:11px; text-transform:uppercase; width:36px; text-align:center;">Réf.</th>
                                        <th style="padding:9px 10px; font-size:11px; text-transform:uppercase;">Désignation</th>
                                        <th style="padding:9px 10px; font-size:11px; text-transform:uppercase;">Famille</th>
                                        <th style="padding:9px 10px; font-size:11px; text-transform:uppercase;">Conditionnement</th>

                if (!fData || !fData.tel) return alert("Numéro du fournisseur non renseigné.");
                const activeItems = items.filter(i => (orderQties[i.id] || 0) > 0);
                if (activeItems.length === 0) return alert("Aucune quantité sélectionnée.");
                const list = activeItems.map(i => {
                    const primaryEan = getPrimaryEan(i);
                    const condLabel = primaryEan && primaryEan.label ? primaryEan.label : i.format;
                    return `- ${orderQties[i.id]}x ${i.nom} (${condLabel})`;
                }).join('\n');
                const hasCompte = fData.numCompte && fData.numCompte.trim() !== '';
                const compteSms = hasCompte ? `\nN° Compte client : ${fData.numCompte.trim()}` : '';
                const emailSms = contactEmailActif ? `\nEmail contact : ${contactEmailActif}` : '';
                const note = (orderNotes[fId] || '').trim();
                const noteSms = note ? `\nNote : ${note}` : '';

                const body = `Bonjour, voici la commande pour l'${AMICALE_INFO.nom} :${compteSms}\n${list}${noteSms}\n\nAdresse : ${AMICALE_INFO.adresse}\nContact : ${contactNomActif} (${contactTelActif})${emailSms}\nMerci !`;

                const itemsToPrint = (groupedOrders[fId] || []).filter(i => (orderQties[i.id] || 0) > 0);
                const numBon = getOrderNumber(fId);
                const dateStr = new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });

                const currentRecipient = selectedRecipientBySupplier[fId] || (fData.email ? 'fournisseur' : 'tous_contacts');
                const contactNomActif = respNom.trim() || AMICALE_INFO.contact;
                const contactTelActif = respTel.trim() || AMICALE_INFO.telFormat;

                                                >
                                                    Ajouter au bon

                                            </div>

                                            <div class="bg-amber-50/60 border border-amber-300 rounded-xl p-3.5">
                                                <div class="flex justify-between items-center mb-1.5">
                                                    <label class="text-xs font-bold text-amber-900 uppercase tracking-wide flex items-center">
                                                        <i class="fa-solid fa-comment-medical mr-1.5 text-pompier-red"></i>
                                                        Observations / Consignes particulières sur ce bon :
                                                    </label>
                                                    {(orderNotes[fId] || '').trim() !== '' && (
