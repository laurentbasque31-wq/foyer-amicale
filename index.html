<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->

</head>
<body class="bg-gray-950 text-gray-100 selection:bg-red-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- ICÔNES SVG INTÉGRÉES ---
    const Icon = ({ children, className = "w-5 h-5" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );

    const Flame = ({ className }) => <Icon className={className}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></Icon>;
    const LayoutDashboard = ({ className }) => <Icon className={className}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></Icon>;
    const List = ({ className }) => <Icon className={className}><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></Icon>;
    const Plus = ({ className }) => <Icon className={className}><path d="M5 12h14"/><path d="M12 5v14"/></Icon>;
    const Trash2 = ({ className }) => <Icon className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></Icon>;
    const CheckCircle = ({ className }) => <Icon className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></Icon>;
    const Circle = ({ className }) => <Icon className={className}><circle cx="12" cy="12" r="10"/></Icon>;
    const ArrowUpRight = ({ className }) => <Icon className={className}><path d="M7 7h10v10"/><path d="M7 17 17 7"/></Icon>;
    const ArrowDownRight = ({ className }) => <Icon className={className}><path d="m7 7 10 10"/><path d="M17 7v10H7"/></Icon>;
    const X = ({ className }) => <Icon className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;
    const FileText = ({ className }) => <Icon className={className}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></Icon>;
    const CreditCard = ({ className }) => <Icon className={className}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></Icon>;
    const Download = ({ className }) => <Icon className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></Icon>;
    const Printer = ({ className }) => <Icon className={className}><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></Icon>;
    const Settings = ({ className }) => <Icon className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></Icon>;
    const Repeat = ({ className }) => <Icon className={className}><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></Icon>;
    const Paperclip = ({ className }) => <Icon className={className}><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></Icon>;
    const Menu = ({ className }) => <Icon className={className}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></Icon>;
    const Lock = ({ className }) => <Icon className={className}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>;
    const Unlock = ({ className }) => <Icon className={className}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></Icon>;
    const Pencil = ({ className }) => <Icon className={className}><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></Icon>;
    const Database = ({ className }) => <Icon className={className}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></Icon>;
    const Upload = ({ className }) => <Icon className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></Icon>;
    const Calendar = ({ className }) => <Icon className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></Icon>;
    const ChevronDown = ({ className }) => <Icon className={className}><path d="m6 9 6 6 6-6"/></Icon>;
    const Users = ({ className }) => <Icon className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>;

    // --- CONFIGURATION FIREBASE ---
    const DEFAULT_FIREBASE_URL = "https://tresorerie-amicale-sp-rieumes-default-rtdb.europe-west1.firebasedatabase.app";
    const FALLBACK_FIREBASE_URL = "https://tresorerie-amicale-sp-rieumes-default-rtdb.firebaseio.com";

    // --- SÉCURITÉ : VÉRIFICATION MASQUÉE DU MOT DE PASSE ---
    // Le mot de passe (Admins@31) est vérifié via ses codes caractères pour ne pas apparaître en clair
    const EXPECTED_VAULT_KEY = "vault_sp_51a9496ee31d9c64";
    const checkPassword = (pwd) => {
      const clean = (pwd || '').trim();
      const targetCodes = [65, 100, 109, 105, 110, 115, 64, 51, 49]; // Admins@31
      if (clean.length !== targetCodes.length) return false;
      return targetCodes.every((code, idx) => clean.charCodeAt(idx) === code);
    };

    // --- COMPOSANT : Liste déroulante de recherche intelligente (s'ouvre vers le haut dans les modales) ---
    function AutocompleteInput({ value, onChange, options, placeholder, className, required, direction = 'down' }) {
      const [isOpen, setIsOpen] = useState(false);
      const safeValue = value || '';
      const filteredOptions = options.filter(opt => opt.toLowerCase().includes(safeValue.toLowerCase()));

      const dropdownPositionClasses = direction === 'up'
        ? 'bottom-full mb-1.5 shadow-[0_-10px_25px_-5px_rgba(0,0,0,0.6)]'
        : 'top-full mt-1 shadow-2xl';

      return (
        <div className="relative w-full">
          <input 
            type="text" 
            required={required}
            className={className}
            value={safeValue} 
            onChange={(e) => { onChange(e.target.value); setIsOpen(true); }}
            onFocus={() => setIsOpen(true)}
            onBlur={() => setTimeout(() => setIsOpen(false), 180)}
            placeholder={placeholder}
          />
          {isOpen && filteredOptions.length > 0 && (
            <ul className={`absolute z-[200] w-full bg-gray-800 border border-gray-600 rounded-xl max-h-52 overflow-y-auto left-0 text-sm ${dropdownPositionClasses}`}>
              {filteredOptions.map((opt, i) => (
                <li 
                  key={i} 
                  className="px-3.5 py-2.5 text-gray-200 hover:bg-red-600 hover:text-white cursor-pointer border-b border-gray-700/50 last:border-0 transition-colors"
                  onMouseDown={(e) => { e.preventDefault(); onChange(opt); setIsOpen(false); }}
                >
                  {opt}
                </li>
              ))}
            </ul>
          )}
        </div>
      );
    }

    // --- COMPOSANT PRINCIPAL ---
    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [passwordError, setPasswordError] = useState(false);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [currentYear, setCurrentYear] = useState(new Date().getFullYear().toString());
      const [currentAccountId, setCurrentAccountId] = useState('acc1');
      const [isAccountPickerOpen, setIsAccountPickerOpen] = useState(false);
      const [isYearPickerOpen, setIsYearPickerOpen] = useState(false);
      const [hasSelectedAccountOnce, setHasSelectedAccountOnce] = useState(false);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      // Chargement local par défaut (Sauvegarde Hors-Ligne instantanée)
      const [closedYears, setClosedYears] = useState(() => {
        const saved = localStorage.getItem('sp_rieumes_closedYears');
        return saved ? JSON.parse(saved) : [];
      });

      const [accounts, setAccounts] = useState(() => {
        const saved = localStorage.getItem('sp_rieumes_accounts');
        return saved ? JSON.parse(saved) : [
          { id: 'acc1', name: 'Compte Courant' },
          { id: 'acc2', name: 'Livret A' },
          { id: 'acc3', name: 'Caisse' }
        ];
      });

      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem('sp_rieumes_categories');
        return saved ? JSON.parse(saved) : [
          { id: 'cat1', name: 'Cotisations' },
          { id: 'cat2', name: 'Achats Équipement' },
          { id: 'cat3', name: 'Ventes (Calendriers, etc.)' },
          { id: 'cat4', name: 'Frais Bancaires' },
          { id: 'cat5', name: 'Cérémonies / Repas' },
          { id: 'cat6', name: 'Subventions / Dons' },
          { id: 'cat7', name: 'Autre' }
        ];
      });

      const [suppliers, setSuppliers] = useState(() => {
        const saved = localStorage.getItem('sp_rieumes_suppliers');
        return saved ? JSON.parse(saved) : [
          { id: 'sup1', name: 'Super U Rieumes' },
          { id: 'sup2', name: 'Boulangerie Rieumes' },
          { id: 'sup3', name: 'UDSP 31' },
          { id: 'sup4', name: 'Mairie de Rieumes' },
          { id: 'sup5', name: 'Crédit Agricole' }
        ];
      });

      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('sp_rieumes_transactions');
        return saved ? JSON.parse(saved) : [];
      });

      const [automations, setAutomations] = useState(() => {
        const saved = localStorage.getItem('sp_rieumes_automations');
        return saved ? JSON.parse(saved) : [];
      });

      const [manuallyOpenedYears, setManuallyOpenedYears] = useState(() => {
        const saved = localStorage.getItem('sp_rieumes_manuallyOpenedYears');
        return saved ? JSON.parse(saved) : [];
      });

      const [pendingOfflineSync, setPendingOfflineSync] = useState(() => {
        return localStorage.getItem('sp_rieumes_pending_sync') === 'true';
      });

      // --- SYNCHRONISATION CLOUD FIREBASE SÉCURISÉE (AVEC PROTECTION HORS-LIGNE & MODE FICHIER LOCAL PC) ---
      const [firebaseDbUrl, setFirebaseDbUrl] = useState(() => localStorage.getItem('sp_rieumes_fb_url') || DEFAULT_FIREBASE_URL);
      const [tempFbUrl, setTempFbUrl] = useState(() => localStorage.getItem('sp_rieumes_fb_url') || DEFAULT_FIREBASE_URL);
      const [cloudStatus, setCloudStatus] = useState('connecting');
      const [cloudErrorDetail, setCloudErrorDetail] = useState('');
      const dbRef = useRef(null);
      const activeRestUrl = useRef(null);
      const isUpdatingFromCloud = useRef(false);

      // Écriture universelle (fonctionne à la fois sur serveur web et depuis un fichier local sur le Bureau PC)
      const writeDataToCloud = async (payload) => {
        if (dbRef.current) {
          try {
            await dbRef.current.set(payload);
            return true;
          } catch (e) {
            console.warn("Repli sur écriture HTTPS directe :", e);
          }
        }
        if (activeRestUrl.current) {
          const res = await fetch(`${activeRestUrl.current}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return true;
        }
        throw new Error('Aucune connexion active');
      };

      useEffect(() => {
        const handleOnline = () => setCloudStatus('connecting');
        const handleOffline = () => setCloudStatus('offline');
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        if (!navigator.onLine) setCloudStatus('offline');
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      useEffect(() => {
        if (!isAuthenticated) return;

        const cleanUrl = (firebaseDbUrl || '').trim().replace(/\/$/, '');
        if (!cleanUrl || !cleanUrl.startsWith('https://')) {
          setCloudStatus('local');
          dbRef.current = null;
          activeRestUrl.current = null;
          return;
        }

        let isCancelled = false;
        let activeRef = null;
        let onValueChange = null;

        const applyCloudData = (data, saveCallback) => {
          const localUpdatedAt = localStorage.getItem('sp_rieumes_updatedAt') || '1970-01-01T00:00:00.000Z';
          const hasPendingLocalChanges = localStorage.getItem('sp_rieumes_pending_sync') === 'true';

          if (data) {
            const cloudUpdatedAt = data.updatedAt || '1970-01-01T00:00:00.000Z';

            if (hasPendingLocalChanges && localUpdatedAt > cloudUpdatedAt) {
              saveCallback({
                transactions,
                accounts,
                categories,
                suppliers,
                automations,
                closedYears,
                manuallyOpenedYears,
                updatedAt: localUpdatedAt
              }).then(() => {
                localStorage.setItem('sp_rieumes_pending_sync', 'false');
                setPendingOfflineSync(false);
              }).catch(() => {});
            } else {
              isUpdatingFromCloud.current = true;
              setTransactions(data.transactions || []);
              if (data.accounts) setAccounts(data.accounts);
              if (data.categories) setCategories(data.categories);
              if (data.suppliers) setSuppliers(data.suppliers);
              setAutomations(data.automations || []);
              setClosedYears(data.closedYears || []);
              setManuallyOpenedYears(data.manuallyOpenedYears || []);
              localStorage.setItem('sp_rieumes_updatedAt', cloudUpdatedAt);
              localStorage.setItem('sp_rieumes_pending_sync', 'false');
              setPendingOfflineSync(false);
              setTimeout(() => { isUpdatingFromCloud.current = false; }, 250);
            }
          } else {
            const nowIso = new Date().toISOString();
            saveCallback({
              transactions,
              accounts,
              categories,
              suppliers,
              automations,
              closedYears,
              manuallyOpenedYears,
              updatedAt: nowIso
            }).then(() => {
              localStorage.setItem('sp_rieumes_updatedAt', nowIso);
              localStorage.setItem('sp_rieumes_pending_sync', 'false');
              setPendingOfflineSync(false);
            }).catch(() => {});
          }
        };

        // Test rapide par HTTPS (contourne le blocage WebSocket des fichiers locaux file:// sur PC)
        const connectSmart = async () => {
          setCloudStatus(navigator.onLine ? 'connecting' : 'offline');
          setCloudErrorDetail('');

          const urlsToTry = [cleanUrl];
          if (cleanUrl === DEFAULT_FIREBASE_URL) urlsToTry.push(FALLBACK_FIREBASE_URL);

          const pathsToTry = [
            `coffre_fort/${EXPECTED_VAULT_KEY}`,
            `coffre_fort/vault_sp_51a9496e7121b924`,
            `tresorerie_amicale`
          ];

          for (const baseUrl of urlsToTry) {
            for (const path of pathsToTry) {
              if (isCancelled) return;
              try {
                const testResp = await fetch(`${baseUrl}/${path}.json`);
                if (testResp.ok) {
                  const initialData = await testResp.json();
                  activeRestUrl.current = `${baseUrl}/${path}`;
                  setCloudStatus('connected');

                  // Initialisation du SDK temps réel en parallèle
                  try {
                    const appName = 'fb_app_' + Date.now();
                    const app = firebase.initializeApp({ databaseURL: baseUrl }, appName);
                    const db = firebase.database(app);
                    const ref = db.ref(path);
                    activeRef = ref;
                    dbRef.current = ref;

                    onValueChange = ref.on('value', (snapshot) => {
                      if (isCancelled) return;
                      setCloudStatus('connected');
                      applyCloudData(snapshot.val(), (payload) => writeDataToCloud(payload));
                    });
                  } catch (sdkErr) {
                    console.warn("SDK WebSocket indisponible en local, mode HTTPS actif :", sdkErr);
                  }

                  applyCloudData(initialData, (payload) => writeDataToCloud(payload));
                  return;
                } else if (testResp.status === 401 || testResp.status === 403) {
                  setCloudErrorDetail('Règles Firebase verrouillées (Permission refusée)');
                }
              } catch (netErr) {
                console.warn("Tentative échouée sur", baseUrl, path, netErr);
              }
            }
          }

          if (!isCancelled) {
            setCloudStatus(navigator.onLine ? 'error' : 'offline');
          }
        };

        connectSmart();

        return () => {
          isCancelled = true;
          if (activeRef && onValueChange) {
            activeRef.off('value', onValueChange);
          }
        };
      }, [firebaseDbUrl, isAuthenticated]);

      // Sauvegarde automatique dans le navigateur (Hors-ligne) ET dans le Cloud (En ligne)
      useEffect(() => {
        localStorage.setItem('sp_rieumes_transactions', JSON.stringify(transactions));
        localStorage.setItem('sp_rieumes_accounts', JSON.stringify(accounts));
        localStorage.setItem('sp_rieumes_categories', JSON.stringify(categories));
        localStorage.setItem('sp_rieumes_suppliers', JSON.stringify(suppliers));
        localStorage.setItem('sp_rieumes_automations', JSON.stringify(automations));
        localStorage.setItem('sp_rieumes_closedYears', JSON.stringify(closedYears));
        localStorage.setItem('sp_rieumes_manuallyOpenedYears', JSON.stringify(manuallyOpenedYears));

        if (!isUpdatingFromCloud.current && isAuthenticated) {
          const nowIso = new Date().toISOString();
          localStorage.setItem('sp_rieumes_updatedAt', nowIso);

          if ((dbRef.current || activeRestUrl.current) && cloudStatus === 'connected' && navigator.onLine) {
            writeDataToCloud({
              transactions,
              accounts,
              categories,
              suppliers,
              automations,
              closedYears,
              manuallyOpenedYears,
              updatedAt: nowIso
            }).then(() => {
              localStorage.setItem('sp_rieumes_pending_sync', 'false');
              setPendingOfflineSync(false);
            }).catch(() => {
              localStorage.setItem('sp_rieumes_pending_sync', 'true');
              setPendingOfflineSync(true);
              setCloudStatus('offline');
            });
          } else {
            localStorage.setItem('sp_rieumes_pending_sync', 'true');
            setPendingOfflineSync(true);
          }
        }
      }, [transactions, accounts, categories, suppliers, automations, closedYears, manuallyOpenedYears, isAuthenticated]);

      const forcePushToCloud = () => {
        const nowIso = new Date().toISOString();
        writeDataToCloud({
          transactions,
          accounts,
          categories,
          suppliers,
          automations,
          closedYears,
          manuallyOpenedYears,
          updatedAt: nowIso
        }).then(() => {
          localStorage.setItem('sp_rieumes_updatedAt', nowIso);
          localStorage.setItem('sp_rieumes_pending_sync', 'false');
          setPendingOfflineSync(false);
          setCloudStatus('connected');
        }).catch(() => {
          setCloudStatus('error');
        });
      };

      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isAddAutomationOpen, setIsAddAutomationOpen] = useState(false);
      const [editModalTx, setEditModalTx] = useState(null);
      const [restoreData, setRestoreData] = useState(null);
      
      // États du Bilan Annuel (Catégorie ou Fournisseur)
      const [balanceGroupBy, setBalanceGroupBy] = useState('category'); // 'category' | 'supplier'
      const [balanceViewMode, setBalanceViewMode] = useState('global'); // 'global' | 'detailed'
      const [balanceItemFilter, setBalanceItemFilter] = useState('all');
      const [balanceTypeFilter, setBalanceTypeFilter] = useState('all');

      const [newAccountName, setNewAccountName] = useState('');
      const [newCategoryName, setNewCategoryName] = useState('');
      const [newSupplierName, setNewSupplierName] = useState('');

      const [inlineTx, setInlineTx] = useState({
        date: new Date().toISOString().split('T')[0],
        accountId: '',
        description: '',
        supplier: '',
        category: '',
        paymentMethod: 'CB',
        checkNumber: '',
        type: 'expense',
        amount: ''
      });

      const formatCurrency = (amount) => {
        return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(amount);
      };

      const availableYears = useMemo(() => {
        const years = new Set(transactions.map(tx => tx.date.split('-')[0]));
        years.add(new Date().getFullYear().toString());
        manuallyOpenedYears.forEach(y => years.add(y));
        const maxYear = Math.max(...Array.from(years).map(Number));
        if (closedYears.includes(maxYear.toString())) {
          years.add((maxYear + 1).toString());
        }
        return Array.from(years).sort().reverse();
      }, [transactions, closedYears, manuallyOpenedYears]);

      useEffect(() => {
        if (!availableYears.includes(currentYear) && availableYears.length > 0) {
          setCurrentYear(availableYears[0]);
        }
      }, [availableYears, currentYear]);

      useEffect(() => {
        if (currentAccountId !== 'all') {
          setInlineTx(prev => ({ ...prev, accountId: currentAccountId }));
        } else if (!inlineTx.accountId && accounts.length > 0) {
          setInlineTx(prev => ({ ...prev, accountId: accounts[0].id }));
        }
      }, [accounts, currentAccountId, inlineTx.accountId]);

      const ensureCategoryAndSupplierExist = (catName, supName) => {
        const cleanCat = (catName || '').trim();
        const cleanSup = (supName || '').trim();
        if (cleanCat && !categories.some(c => c.name.toLowerCase() === cleanCat.toLowerCase())) {
          setCategories(prev => [...prev, { id: 'cat_' + Date.now(), name: cleanCat }]);
        }
        if (cleanSup && !suppliers.some(s => s.name.toLowerCase() === cleanSup.toLowerCase())) {
          setSuppliers(prev => [...prev, { id: 'sup_' + Date.now(), name: cleanSup }]);
        }
      };

      const filteredTransactions = useMemo(() => {
        return transactions
          .filter(tx => tx.date.startsWith(currentYear))
          .filter(tx => currentAccountId === 'all' || tx.accountId === currentAccountId)
          .sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [transactions, currentYear, currentAccountId]);

      const isCurrentYearClosed = closedYears.includes(currentYear);

      const balances = useMemo(() => {
        let pointed = 0;
        let unpointed = 0;
        const relevantTransactions = currentAccountId === 'all' 
          ? transactions 
          : transactions.filter(tx => tx.accountId === currentAccountId);

        relevantTransactions.forEach(tx => {
          const modifier = tx.type === 'income' ? 1 : -1;
          if (tx.reconciled) pointed += tx.amount * modifier;
          else unpointed += tx.amount * modifier;
        });
        return { pointed, unpointed, theoretical: pointed + unpointed };
      }, [transactions, currentAccountId]);

      const accountBalances = useMemo(() => {
        const balancesByAccount = {};
        accounts.forEach(acc => {
          balancesByAccount[acc.id] = { pointed: 0, unpointed: 0, theoretical: 0 };
        });

        transactions.forEach(tx => {
          if (balancesByAccount[tx.accountId]) {
            const modifier = tx.type === 'income' ? 1 : -1;
            if (tx.reconciled) balancesByAccount[tx.accountId].pointed += tx.amount * modifier;
            else balancesByAccount[tx.accountId].unpointed += tx.amount * modifier;
            balancesByAccount[tx.accountId].theoretical += tx.amount * modifier;
          }
        });
        return balancesByAccount;
      }, [transactions, accounts]);

      const categorySummary = useMemo(() => {
        const summary = {};
        categories.forEach(cat => {
          summary[cat.name] = { income: 0, expense: 0, total: 0 };
        });
        
        filteredTransactions.forEach(tx => {
          const catName = tx.category || 'Non catégorisé';
          if (!summary[catName]) {
            summary[catName] = { income: 0, expense: 0, total: 0 };
          }
          if (tx.type === 'income') {
            summary[catName].income += tx.amount;
            summary[catName].total += tx.amount;
          } else {
            summary[catName].expense += tx.amount;
            summary[catName].total -= tx.amount;
          }
        });
        return summary;
      }, [filteredTransactions, categories]);

      const supplierSummary = useMemo(() => {
        const summary = {};
        suppliers.forEach(sup => {
          summary[sup.name] = { income: 0, expense: 0, total: 0 };
        });
        
        filteredTransactions.forEach(tx => {
          const supName = (tx.supplier || '').trim() || 'Non renseigné';
          if (!summary[supName]) {
            summary[supName] = { income: 0, expense: 0, total: 0 };
          }
          if (tx.type === 'income') {
            summary[supName].income += tx.amount;
            summary[supName].total += tx.amount;
          } else {
            summary[supName].expense += tx.amount;
            summary[supName].total -= tx.amount;
          }
        });
        return summary;
      }, [filteredTransactions, suppliers]);

      const activeSummary = balanceGroupBy === 'category' ? categorySummary : supplierSummary;

      const reportANouveau = useMemo(() => {
        const relevantTransactions = currentAccountId === 'all' 
          ? transactions 
          : transactions.filter(tx => tx.accountId === currentAccountId);

        return relevantTransactions
          .filter(tx => tx.date.localeCompare(`${currentYear}-01-01`) < 0)
          .reduce((acc, tx) => acc + (tx.type === 'income' ? tx.amount : -tx.amount), 0);
      }, [transactions, currentAccountId, currentYear]);

      // Actions
      const addTransaction = (tx) => {
        ensureCategoryAndSupplierExist(tx.category, tx.supplier);
        setTransactions(prev => [{ ...tx, id: Date.now().toString() }, ...prev]);
        setIsAddModalOpen(false);
      };

      const handleEditTransaction = (updatedTx) => {
        ensureCategoryAndSupplierExist(updatedTx.category, updatedTx.supplier);
        setTransactions(prev => prev.map(tx => tx.id === updatedTx.id ? updatedTx : tx));
        setEditModalTx(null);
      };

      const deleteTransaction = (id) => {
        setTransactions(prev => prev.filter(tx => tx.id !== id));
      };

      const toggleReconciled = (id) => {
        setTransactions(prev => prev.map(tx => 
          tx.id === id ? { ...tx, reconciled: !tx.reconciled } : tx
        ));
      };

      const handleInlineSubmit = () => {
        if (!inlineTx.amount || !inlineTx.description || !inlineTx.accountId || !inlineTx.category) return;
        ensureCategoryAndSupplierExist(inlineTx.category, inlineTx.supplier);
        const newTx = {
          id: Date.now().toString(),
          type: inlineTx.type,
          amount: parseFloat(inlineTx.amount),
          description: inlineTx.description,
          supplier: inlineTx.supplier.trim(),
          category: inlineTx.category.trim(),
          date: inlineTx.date,
          accountId: inlineTx.accountId,
          paymentMethod: inlineTx.paymentMethod,
          checkNumber: inlineTx.paymentMethod === 'Chèque' ? inlineTx.checkNumber.trim() : null,
          receiptUrl: null,
          reconciled: false
        };
        setTransactions(prev => [newTx, ...prev]);
        setInlineTx(prev => ({ ...prev, description: '', supplier: '', category: '', amount: '', checkNumber: '' }));
      };

      const addAutomation = (automation) => {
        ensureCategoryAndSupplierExist(automation.category, automation.supplier);
        setAutomations(prev => [...prev, { ...automation, id: Date.now().toString() }]);
        setIsAddAutomationOpen(false);
      };

      const deleteAutomation = (id) => {
        setAutomations(prev => prev.filter(a => a.id !== id));
      };

      const addAccount = (e) => {
        e.preventDefault();
        if (newAccountName.trim()) {
          setAccounts(prev => [...prev, { id: 'acc' + Date.now(), name: newAccountName.trim() }]);
          setNewAccountName('');
        }
      };

      const deleteAccount = (id) => {
        if (accounts.length > 1) {
          setAccounts(prev => prev.filter(a => a.id !== id));
          if (currentAccountId === id) setCurrentAccountId('all');
        }
      };

      const addCategory = (e) => {
        e.preventDefault();
        if (newCategoryName.trim()) {
          setCategories(prev => [...prev, { id: 'cat' + Date.now(), name: newCategoryName.trim() }]);
          setNewCategoryName('');
        }
      };

      const deleteCategory = (id) => {
        if (categories.length > 1) {
          setCategories(prev => prev.filter(c => c.id !== id));
        }
      };

      const addSupplier = (e) => {
        e.preventDefault();
        if (newSupplierName.trim()) {
          setSuppliers(prev => [...prev, { id: 'sup' + Date.now(), name: newSupplierName.trim() }]);
          setNewSupplierName('');
        }
      };

      const deleteSupplier = (id) => {
        setSuppliers(prev => prev.filter(s => s.id !== id));
      };

      const toggleYearClosure = (year) => {
        if (closedYears.includes(year)) {
          setClosedYears(prev => prev.filter(y => y !== year));
        } else {
          setClosedYears(prev => [...prev, year]);
        }
      };

      const exportCSV = () => {
        const separator = ';';
        let csvContent = '\uFEFF'; 
        csvContent += `BILAN FINANCIER ${currentYear} - Amicale SP Rieumes\n\n`;
        csvContent += `RÉSUMÉ PAR CATÉGORIE\n`;
        csvContent += `Catégorie${separator}Recettes${separator}Dépenses${separator}Solde\n`;
        
        Object.entries(categorySummary).forEach(([cat, data]) => {
          csvContent += `${cat}${separator}${data.income.toString().replace('.', ',')}${separator}${data.expense.toString().replace('.', ',')}${separator}${data.total.toString().replace('.', ',')}\n`;
        });

        csvContent += `\nRÉSUMÉ PAR FOURNISSEUR / TIERS\n`;
        csvContent += `Fournisseur / Tiers${separator}Recettes${separator}Dépenses${separator}Solde\n`;
        Object.entries(supplierSummary).forEach(([sup, data]) => {
          if (data.income > 0 || data.expense > 0) {
            csvContent += `${sup}${separator}${data.income.toString().replace('.', ',')}${separator}${data.expense.toString().replace('.', ',')}${separator}${data.total.toString().replace('.', ',')}\n`;
          }
        });
        
        const totalInc = Object.values(categorySummary).reduce((acc, curr) => acc + curr.income, 0);
        const totalExp = Object.values(categorySummary).reduce((acc, curr) => acc + curr.expense, 0);
        const totalSolde = Object.values(categorySummary).reduce((acc, curr) => acc + curr.total, 0);
        
        csvContent += `\nTOTAL DES MOUVEMENTS${separator}${totalInc.toString().replace('.', ',')}${separator}${totalExp.toString().replace('.', ',')}${separator}${totalSolde.toString().replace('.', ',')}\n`;
        csvContent += `Report à nouveau${separator}${separator}${separator}${reportANouveau.toString().replace('.', ',')}\n`;
        csvContent += `SOLDE FINAL (Avec report)${separator}${separator}${separator}${(reportANouveau + totalSolde).toString().replace('.', ',')}\n\n\n`;
        csvContent += `DÉTAIL DES OPÉRATIONS\n`;
        const headers = ['Date', 'Compte', 'Libellé', 'Fournisseur / Tiers', 'Catégorie', 'Mode', 'N° Chèque', 'Type', 'Montant', 'Pointé'];
        csvContent += headers.join(separator) + '\n';

        const rows = filteredTransactions.map(tx => [
          new Date(tx.date).toLocaleDateString('fr-FR'),
          accounts.find(a => a.id === tx.accountId)?.name || '-',
          `"${(tx.description || '').replace(/"/g, '""')}"`,
          `"${(tx.supplier || '-').replace(/"/g, '""')}"`,
          tx.category,
          tx.paymentMethod || '-',
          tx.checkNumber ? `"${tx.checkNumber}"` : '-',
          tx.type === 'income' ? 'Recette' : 'Dépense',
          tx.amount.toString().replace('.', ','),
          tx.reconciled ? 'Oui' : 'Non'
        ]);
        csvContent += rows.map(e => e.join(separator)).join("\n");
          
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `Bilan_SP_Rieumes_${currentYear}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const exportBackup = () => {
        const data = { transactions, accounts, categories, suppliers, automations, closedYears, manuallyOpenedYears, exportDate: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `sauvegarde_tresorerie_${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.transactions && data.accounts) setRestoreData(data);
          } catch (err) {
            console.error("Erreur de lecture", err);
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const confirmRestore = () => {
        if (restoreData) {
          setTransactions(restoreData.transactions || []);
          setAccounts(restoreData.accounts || []);
          setCategories(restoreData.categories || []);
          if (restoreData.suppliers) setSuppliers(restoreData.suppliers);
          setAutomations(restoreData.automations || []);
          setClosedYears(restoreData.closedYears || []);
          setManuallyOpenedYears(restoreData.manuallyOpenedYears || []);
          setRestoreData(null);
        }
      };

      const handleNavClick = (tabId) => {
        setActiveTab(tabId);
        setIsMobileMenuOpen(false);
        if (tabId === 'transactions' && !hasSelectedAccountOnce) {
          setIsAccountPickerOpen(true);
        }
      };

      const navItems = [
        { id: 'dashboard', label: 'Tableau de Bord', icon: LayoutDashboard },
        { id: 'transactions', label: 'Livre de Comptes', icon: List },
        { id: 'balance', label: 'Bilan Annuel', icon: FileText },
        { id: 'automations', label: 'Automatisations', icon: Repeat },
        { id: 'settings', label: 'Paramètres', icon: Settings }
      ];

      const filteredSummaryEntries = Object.entries(activeSummary).filter(([itemKey, data]) => {
        if (balanceItemFilter !== 'all' && itemKey !== balanceItemFilter) return false;
        if (balanceTypeFilter === 'income' && data.income === 0) return false;
        if (balanceTypeFilter === 'expense' && data.expense === 0) return false;
        if (balanceItemFilter === 'all' && data.income === 0 && data.expense === 0) return false;
        return true;
      });

      const sumIncome = filteredSummaryEntries.reduce((acc, [_, data]) => acc + data.income, 0);
      const sumExpense = filteredSummaryEntries.reduce((acc, [_, data]) => acc + data.expense, 0);
      const sumTotal = filteredSummaryEntries.reduce((acc, [_, data]) => acc + data.total, 0);

      const currentAccountName = currentAccountId === 'all' 
        ? 'Tous les comptes (Cumul)' 
        : (accounts.find(a => a.id === currentAccountId)?.name || 'Compte');

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-gray-950 flex flex-col items-center justify-center p-4">
            <div className="bg-gray-900 border border-gray-800 p-8 rounded-3xl w-full max-w-md shadow-2xl flex flex-col items-center">
              <div className="bg-red-600 p-4 rounded-2xl shadow-lg shadow-red-600/20 mb-6">
                <Flame className="w-10 h-10 text-white" />
              </div>
              <h1 className="text-2xl font-bold text-white mb-2 text-center tracking-tight">Amicale SP Rieumes</h1>
              <p className="text-gray-400 mb-8 text-center text-sm font-medium">Accès sécurisé à la trésorerie</p>
              <form onSubmit={(e) => { 
                e.preventDefault(); 
                if (checkPassword(passwordInput)) { 
                  setIsAuthenticated(true); 
                  setPasswordError(false); 
                } else { 
                  setPasswordError(true); 
                } 
              }} className="w-full space-y-5">
                <div>
                  <input type="password" placeholder="Mot de passe d'accès" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} className={`w-full bg-gray-950 border ${passwordError ? 'border-red-500' : 'border-gray-700'} rounded-xl p-4 text-white outline-none focus:border-red-500 transition-all text-center text-lg tracking-widest`} />
                  {passwordError && <p className="text-red-500 text-xs mt-2 text-center font-medium">Mot de passe incorrect.</p>}
                </div>
                <button type="submit" className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-4 rounded-xl transition-colors flex items-center justify-center shadow-lg shadow-red-600/20">
                  <Lock className="w-5 h-5 mr-2" /> Déverrouiller
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-950 text-gray-100 font-sans">
          <div className="flex h-screen overflow-hidden">
            {/* SIDEBAR DESKTOP */}
            <aside className="hidden md:flex w-64 flex-col bg-gray-900 border-r border-gray-800 print:hidden">
              <div className="p-6 flex items-center space-x-3">
                <div className="bg-red-600 p-2 rounded-xl shadow-lg shadow-red-600/20 flex-shrink-0">
                  <Flame className="w-6 h-6 text-white" />
                </div>
                <div>
                  <h1 className="text-lg font-bold text-white tracking-tight leading-tight">Trésorerie Amicale</h1>
                  <p className="text-xs text-red-400 font-medium mt-0.5">Sapeurs-Pompiers de Rieumes</p>
                </div>
              </div>
              <nav className="flex-1 px-4 py-4 space-y-2">
                {navItems.map((item) => (
                  <button key={item.id} onClick={() => handleNavClick(item.id)} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all ${activeTab === item.id ? 'bg-red-600 text-white shadow-md shadow-red-600/10' : 'text-gray-400 hover:bg-gray-800 hover:text-white'}`}>
                    <item.icon className="w-5 h-5" />
                    <span className="font-medium">{item.label}</span>
                  </button>
                ))}
              </nav>
              <div className="p-4 space-y-3 border-t border-gray-800">
                <div className={`flex flex-col items-center justify-center p-2.5 rounded-xl text-xs font-medium border ${
                  cloudStatus === 'connected' && !pendingOfflineSync ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' :
                  cloudStatus === 'offline' || pendingOfflineSync ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' :
                  cloudStatus === 'error' ? 'bg-red-500/10 text-red-400 border-red-500/20' :
                  'bg-gray-800 text-gray-400 border-gray-700'
                }`}>
                  <div className="flex items-center space-x-2">
                    <span className={`w-2 h-2 rounded-full ${
                      cloudStatus === 'connected' && !pendingOfflineSync ? 'bg-emerald-400 animate-pulse' :
                      cloudStatus === 'offline' || pendingOfflineSync ? 'bg-amber-400 animate-pulse' :
                      cloudStatus === 'error' ? 'bg-red-500' : 'bg-yellow-400 animate-pulse'
                    }`}></span>
                    <span>
                      {cloudStatus === 'connected' && !pendingOfflineSync ? 'Synchronisé (Firebase)' :
                       pendingOfflineSync ? 'Sauvegardé sur PC (Attente réseau)' :
                       cloudStatus === 'offline' ? 'Hors-ligne (Sauvegarde PC active)' :
                       cloudStatus === 'error' ? 'Mode Local (Vérifier Règles)' :
                       'Connexion Firebase...'}
                    </span>
                  </div>
                  {pendingOfflineSync && cloudStatus === 'connected' && (
                    <button onClick={forcePushToCloud} className="mt-1.5 text-[11px] underline text-amber-300 hover:text-white">
                      Synchroniser maintenant
                    </button>
                  )}
                </div>
                <p className="text-xs text-gray-500 text-center font-medium">
                  © {new Date().getFullYear()} - Amicale SP Rieumes<br/>Laurent Basque
                </p>
              </div>
            </aside>

            {/* HEADER MOBILE */}
            <div className="md:hidden fixed top-0 left-0 right-0 h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-4 z-40 print:hidden">
              <div className="flex items-center space-x-2 overflow-hidden mr-2">
                 <Flame className="w-6 h-6 text-red-500 flex-shrink-0" />
                 <h1 className="text-base font-bold text-white truncate">Trésorerie Amicale SP Rieumes</h1>
              </div>
              <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="text-gray-400 flex-shrink-0">
                {isMobileMenuOpen ? <X className="w-6 h-6" /> : <Menu className="w-6 h-6" />}
              </button>
            </div>

            {isMobileMenuOpen && (
              <div className="md:hidden fixed inset-0 top-16 bg-gray-900 z-30 flex flex-col p-4 print:hidden">
                 <div className="flex-1 space-y-2 overflow-y-auto">
                   {navItems.map((item) => (
                    <button key={item.id} onClick={() => handleNavClick(item.id)} className={`w-full flex items-center space-x-3 px-4 py-4 rounded-xl transition-all ${activeTab === item.id ? 'bg-red-600 text-white' : 'text-gray-400'}`}>
                      <item.icon className="w-5 h-5" />
                      <span className="font-medium text-lg">{item.label}</span>
                    </button>
                  ))}
                 </div>
              </div>
            )}

            {/* CONTENU PRINCIPAL */}
            <main className="flex-1 flex flex-col h-full overflow-hidden w-full pt-16 md:pt-0">
              <header className="bg-gray-900/50 backdrop-blur-sm border-b border-gray-800 p-4 flex flex-col sm:flex-row justify-between items-center z-10 print:hidden space-y-3 sm:space-y-0">
                <div className="flex flex-wrap sm:flex-nowrap gap-3 w-full sm:w-auto">
                  <button 
                    onClick={() => setIsAccountPickerOpen(true)}
                    className="flex items-center justify-between space-x-3 bg-gray-800 hover:bg-gray-750 border border-gray-700 hover:border-red-500/50 text-white px-4 py-2.5 rounded-xl transition-all shadow-sm flex-1 sm:flex-initial group"
                  >
                    <div className="flex items-center space-x-2.5">
                      <div className="bg-red-500/10 text-red-400 p-1.5 rounded-lg group-hover:bg-red-600 group-hover:text-white transition-colors">
                        <CreditCard className="w-4 h-4" />
                      </div>
                      <div className="text-left">
                        <span className="block text-[10px] uppercase tracking-wider text-gray-400 font-semibold leading-none mb-0.5">Compte actif</span>
                        <span className="text-sm font-bold text-white">{currentAccountName}</span>
                      </div>
                    </div>
                    <ChevronDown className="w-4 h-4 text-gray-400 group-hover:text-white transition-colors" />
                  </button>

                  <button 
                    onClick={() => setIsYearPickerOpen(true)}
                    className="flex items-center justify-between space-x-3 bg-gray-800 hover:bg-gray-750 border border-gray-700 hover:border-red-500/50 text-white px-4 py-2.5 rounded-xl transition-all shadow-sm group"
                  >
                    <div className="flex items-center space-x-2.5">
                      <div className="bg-blue-500/10 text-blue-400 p-1.5 rounded-lg group-hover:bg-blue-600 group-hover:text-white transition-colors">
                        <Calendar className="w-4 h-4" />
                      </div>
                      <div className="text-left">
                        <span className="block text-[10px] uppercase tracking-wider text-gray-400 font-semibold leading-none mb-0.5">Exercice</span>
                        <span className="text-sm font-bold text-white flex items-center gap-1.5">
                          {currentYear}
                          {isCurrentYearClosed && <Lock className="w-3.5 h-3.5 text-yellow-500" />}
                        </span>
                      </div>
                    </div>
                    <ChevronDown className="w-4 h-4 text-gray-400 group-hover:text-white transition-colors" />
                  </button>
                </div>

                {!isCurrentYearClosed && (
                  <button onClick={() => setIsAddModalOpen(true)} className="w-full sm:w-auto flex items-center justify-center space-x-2 bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-xl font-medium transition-colors shadow-lg shadow-red-600/20">
                    <Plus className="w-5 h-5" /><span>Nouvelle Opération</span>
                  </button>
                )}
              </header>

              <div className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
                <div className="max-w-[1600px] w-full mx-auto">
                  
                  {/* ONGLET 1 : TABLEAU DE BORD */}
                  {activeTab === 'dashboard' && (
                    <div className="space-y-6">
                      {isCurrentYearClosed && (
                        <div className="bg-yellow-500/10 border border-yellow-500/20 text-yellow-500 p-4 rounded-xl flex items-center">
                          <Lock className="w-6 h-6 mr-3 flex-shrink-0" />
                          <div>
                            <h4 className="font-bold">Exercice Clôturé</h4>
                            <p className="text-sm">L'année {currentYear} est verrouillée.</p>
                          </div>
                        </div>
                      )}
                      <div>
                        <h2 className="text-2xl font-bold text-white mb-6">Aperçu Financier ({currentAccountName})</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                          <div className="bg-gray-900 border border-gray-800 p-6 rounded-2xl relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-10"><CheckCircle className="w-24 h-24" /></div>
                            <p className="text-sm font-medium text-gray-400 mb-1">Solde Bancaire (Pointé)</p>
                            <h3 className={`text-4xl font-bold ${balances.pointed >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>{formatCurrency(balances.pointed)}</h3>
                          </div>
                          <div className="bg-gray-900 border border-gray-800 p-6 rounded-2xl relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-10"><Circle className="w-24 h-24" /></div>
                            <p className="text-sm font-medium text-gray-400 mb-1">Opérations non pointées</p>
                            <h3 className={`text-4xl font-bold ${balances.unpointed >= 0 ? 'text-blue-400' : 'text-yellow-500'}`}>{balances.unpointed > 0 ? '+' : ''}{formatCurrency(balances.unpointed)}</h3>
                          </div>
                          <div className="bg-gray-900 border border-gray-800 p-6 rounded-2xl relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-10"><LayoutDashboard className="w-24 h-24" /></div>
                            <p className="text-sm font-medium text-gray-400 mb-1">Solde Théorique</p>
                            <h3 className={`text-4xl font-bold ${balances.theoretical >= 0 ? 'text-white' : 'text-red-400'}`}>{formatCurrency(balances.theoretical)}</h3>
                          </div>
                        </div>
                      </div>

                      {accounts.length > 0 && (
                        <div className="mt-8">
                          <h3 className="text-lg font-bold text-white mb-4">Soldes par compte (cliquer pour ouvrir le Livre de Comptes)</h3>
                          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {accounts.map(acc => {
                              const bal = accountBalances[acc.id] || { pointed: 0, unpointed: 0, theoretical: 0 };
                              return (
                                <div 
                                  key={acc.id} 
                                  onClick={() => { setCurrentAccountId(acc.id); setHasSelectedAccountOnce(true); setActiveTab('transactions'); }}
                                  className="bg-gray-900 hover:bg-gray-800/80 cursor-pointer transition-all p-5 rounded-2xl border border-gray-800 hover:border-red-500/50 flex flex-col justify-between group"
                                >
                                  <div className="flex items-center justify-between mb-4">
                                    <div className="flex items-center space-x-2.5">
                                      <CreditCard className="w-5 h-5 text-red-500" />
                                      <h4 className="font-bold text-gray-100 group-hover:text-white">{acc.name}</h4>
                                    </div>
                                    <span className="text-xs text-gray-500 group-hover:text-red-400">Ouvrir →</span>
                                  </div>
                                  <div className="flex justify-between items-end pt-2 border-t border-gray-800">
                                    <div><p className="text-xs text-gray-500 mb-1">Pointé</p><p className={`font-bold text-lg ${bal.pointed >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>{formatCurrency(bal.pointed)}</p></div>
                                    <div className="text-right"><p className="text-xs text-gray-500 mb-1">Théorique</p><p className={`font-bold text-lg ${bal.theoretical >= 0 ? 'text-white' : 'text-red-400'}`}>{formatCurrency(bal.theoretical)}</p></div>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {/* ONGLET 2 : LIVRE DE COMPTES */}
                  {activeTab === 'transactions' && (
                    <div className="space-y-6">
                      {/* BANDEAU DES SOLDES DU COMPTE TRAITÉ */}
                      <div className="bg-gradient-to-br from-gray-900 via-gray-900 to-gray-950 border border-gray-800 rounded-2xl p-5 shadow-lg">
                        <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                          <div className="flex items-center space-x-4">
                            <div className="bg-red-600/20 border border-red-500/30 p-3.5 rounded-2xl text-red-400">
                              <CreditCard className="w-7 h-7" />
                            </div>
                            <div>
                              <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold">Compte en cours de traitement</span>
                              <div className="flex items-center space-x-3 mt-0.5">
                                <h2 className="text-2xl font-extrabold text-white">{currentAccountName}</h2>
                                <button 
                                  onClick={() => setIsAccountPickerOpen(true)}
                                  className="text-xs bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg border border-gray-700 transition-colors flex items-center space-x-1"
                                >
                                  <Repeat className="w-3.5 h-3.5 mr-1 text-red-400" />
                                  <span>Changer de compte</span>
                                </button>
                              </div>
                            </div>
                          </div>

                          <div className="grid grid-cols-3 gap-3 w-full lg:w-auto">
                            <div className="bg-gray-950/90 border border-gray-800 px-4 py-3 rounded-xl">
                              <p className="text-xs text-gray-400">Solde Pointé</p>
                              <p className={`text-lg sm:text-xl font-bold mt-0.5 ${balances.pointed >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                                {formatCurrency(balances.pointed)}
                              </p>
                            </div>
                            <div className="bg-gray-950/90 border border-gray-800 px-4 py-3 rounded-xl">
                              <p className="text-xs text-gray-400">Non Pointé</p>
                              <p className={`text-lg sm:text-xl font-bold mt-0.5 ${balances.unpointed >= 0 ? 'text-blue-400' : 'text-yellow-400'}`}>
                                {balances.unpointed > 0 ? '+' : ''}{formatCurrency(balances.unpointed)}
                              </p>
                            </div>
                            <div className="bg-gray-950/90 border border-gray-700 px-4 py-3 rounded-xl">
                              <p className="text-xs text-gray-300 font-medium">Solde Théorique</p>
                              <p className={`text-lg sm:text-xl font-extrabold mt-0.5 ${balances.theoretical >= 0 ? 'text-white' : 'text-red-400'}`}>
                                {formatCurrency(balances.theoretical)}
                              </p>
                            </div>
                          </div>
                        </div>
                      </div>

                      {/* TABLEAU DES ÉCRITURES */}
                      <div className="bg-gray-900 border border-gray-800 rounded-2xl shadow-sm overflow-visible">
                        <div className="p-5 border-b border-gray-800 flex justify-between items-center">
                          <h3 className="text-lg font-bold text-white">Écritures de l'exercice {currentYear}</h3>
                          <span className="text-xs text-gray-400">{filteredTransactions.length} opération(s)</span>
                        </div>
                        
                        <div className="overflow-x-auto pb-28">
                          <table className="w-full text-sm text-left text-gray-300">
                            <thead className="text-xs text-gray-400 uppercase bg-gray-950 border-b border-gray-800">
                              <tr>
                                <th className="px-3 py-3">Date</th>
                                <th className="px-3 py-3">Compte</th>
                                <th className="px-3 py-3">Libellé</th>
                                <th className="px-3 py-3">Fournisseur / Tiers</th>
                                <th className="px-3 py-3">Catégorie</th>
                                <th className="px-3 py-3">Mode</th>
                                <th className="px-3 py-3 text-right">Montant</th>
                                <th className="px-3 py-3 text-center">Pointé</th>
                                <th className="px-3 py-3 text-center print:hidden">Actions</th>
                              </tr>
                            </thead>
                            <tbody>
                              {!isCurrentYearClosed && (
                                <tr className="bg-gray-800/40 border-b border-gray-700 print:hidden">
                                  <td className="px-3 py-3"><input type="date" value={inlineTx.date} onChange={e => setInlineTx({...inlineTx, date: e.target.value})} className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white w-full outline-none" /></td>
                                  <td className="px-3 py-3">
                                    {currentAccountId === 'all' ? (
                                      <select value={inlineTx.accountId} onChange={e => setInlineTx({...inlineTx, accountId: e.target.value})} className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white w-full outline-none min-w-[110px]">
                                        {accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}
                                      </select>
                                    ) : (
                                      <div className="bg-gray-800/70 border border-gray-700 rounded p-1.5 text-xs text-red-300 font-medium w-full min-w-[110px]">
                                        {accounts.find(a => a.id === currentAccountId)?.name}
                                      </div>
                                    )}
                                  </td>
                                  <td className="px-3 py-3"><input type="text" placeholder="Nouveau libellé..." value={inlineTx.description} onChange={e => setInlineTx({...inlineTx, description: e.target.value})} className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white w-full outline-none min-w-[130px]" /></td>
                                  <td className="px-3 py-3">
                                    <AutocompleteInput 
                                      value={inlineTx.supplier} 
                                      onChange={val => setInlineTx({...inlineTx, supplier: val})} 
                                      options={suppliers.map(s => s.name)} 
                                      placeholder="Fournisseur / Tiers..." 
                                      className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white w-full outline-none min-w-[130px]" 
                                    />
                                  </td>
                                  <td className="px-3 py-3">
                                    <AutocompleteInput 
                                      value={inlineTx.category} 
                                      onChange={val => setInlineTx({...inlineTx, category: val})} 
                                      options={categories.map(c => c.name)} 
                                      placeholder="Choisir catégorie..." 
                                      className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white w-full outline-none min-w-[130px]" 
                                    />
                                  </td>
                                  <td className="px-3 py-3">
                                    <div className="flex flex-col space-y-1 min-w-[100px]">
                                      <select value={inlineTx.paymentMethod} onChange={e => setInlineTx({...inlineTx, paymentMethod: e.target.value})} className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white w-full outline-none">
                                        <option value="CB">CB</option>
                                        <option value="Chèque">Chèque</option>
                                        <option value="Prélèvement">Prélèvement</option>
                                        <option value="Virement">Virement</option>
                                        <option value="Espèces">Espèces</option>
                                      </select>
                                      {inlineTx.paymentMethod === 'Chèque' && (
                                        <input type="text" placeholder="N° chèque" value={inlineTx.checkNumber} onChange={e => setInlineTx({...inlineTx, checkNumber: e.target.value})} className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white w-full outline-none" />
                                      )}
                                    </div>
                                  </td>
                                  <td className="px-3 py-3 text-right min-w-[160px]">
                                    <div className="flex items-center justify-end space-x-2">
                                      <select value={inlineTx.type} onChange={e => setInlineTx({...inlineTx, type: e.target.value})} className={`bg-gray-900 border border-gray-700 rounded p-1.5 text-xs outline-none font-bold ${inlineTx.type === 'income' ? 'text-emerald-500' : 'text-red-400'}`}>
                                        <option value="expense">Dépense</option>
                                        <option value="income">Recette</option>
                                      </select>
                                      <input type="number" step="0.01" placeholder="0.00" value={inlineTx.amount} onChange={e => setInlineTx({...inlineTx, amount: e.target.value})} className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white w-20 outline-none text-right font-bold" />
                                    </div>
                                  </td>
                                  <td className="px-3 py-3 text-center">-</td>
                                  <td className="px-3 py-3 text-center">
                                    <button onClick={handleInlineSubmit} disabled={!inlineTx.amount || !inlineTx.description || !inlineTx.category} className="bg-red-600 hover:bg-red-700 disabled:opacity-40 text-white p-2 rounded-lg" title="Ajouter l'écriture">
                                      <Plus className="w-4 h-4 mx-auto"/>
                                    </button>
                                  </td>
                                </tr>
                              )}
                              {filteredTransactions.length === 0 ? (
                                <tr>
                                  <td colSpan="9" className="px-4 py-8 text-center text-gray-500">Aucune écriture pour ce compte sur l'année {currentYear}.</td>
                                </tr>
                              ) : (
                                filteredTransactions.map((tx) => (
                                  <tr key={tx.id} className="bg-gray-900 border-b border-gray-800 hover:bg-gray-800/50">
                                    <td className="px-3 py-3 whitespace-nowrap">{new Date(tx.date).toLocaleDateString('fr-FR')}</td>
                                    <td className="px-3 py-3 whitespace-nowrap">{accounts.find(a => a.id === tx.accountId)?.name || '-'}</td>
                                    <td className="px-3 py-3 font-medium text-gray-200">{tx.description}</td>
                                    <td className="px-3 py-3 whitespace-nowrap">
                                      {tx.supplier ? (
                                        <span className="bg-blue-500/10 text-blue-300 text-xs px-2.5 py-1 rounded-full border border-blue-500/20">{tx.supplier}</span>
                                      ) : (
                                        <span className="text-gray-600 text-xs">-</span>
                                      )}
                                    </td>
                                    <td className="px-3 py-3 whitespace-nowrap"><span className="bg-gray-800 text-gray-300 text-xs px-2.5 py-1 rounded-full border border-gray-700">{tx.category}</span></td>
                                    <td className="px-3 py-3 text-sm text-gray-300 whitespace-nowrap">
                                      <span className="block font-medium">{tx.paymentMethod || '-'}</span>
                                      {tx.paymentMethod === 'Chèque' && tx.checkNumber && <span className="block text-xs text-gray-500">N° {tx.checkNumber}</span>}
                                    </td>
                                    <td className={`px-3 py-3 text-right font-bold whitespace-nowrap ${tx.type === 'income' ? 'text-emerald-500' : 'text-red-400'}`}>
                                      {tx.type === 'income' ? '+' : '-'}{formatCurrency(tx.amount)}
                                    </td>
                                    <td className="px-3 py-3 text-center">
                                      {isCurrentYearClosed ? (
                                        <div className="flex justify-center">{tx.reconciled ? <CheckCircle className="w-6 h-6 text-gray-500" /> : <Circle className="w-6 h-6 text-gray-600" />}</div>
                                      ) : (
                                        <button onClick={() => toggleReconciled(tx.id)} className={`print:hidden ${tx.reconciled ? 'text-emerald-500' : 'text-gray-600'}`}>
                                          {tx.reconciled ? <CheckCircle className="w-6 h-6 mx-auto" /> : <Circle className="w-6 h-6 mx-auto" />}
                                        </button>
                                      )}
                                    </td>
                                    <td className="px-3 py-3 text-center print:hidden">
                                      {!isCurrentYearClosed && (
                                        <div className="flex justify-center space-x-2">
                                          <button onClick={() => setEditModalTx(tx)} className="text-gray-400 hover:text-white"><Pencil className="w-4 h-4"/></button>
                                          <button onClick={() => deleteTransaction(tx.id)} className="text-gray-400 hover:text-red-500"><Trash2 className="w-4 h-4"/></button>
                                        </div>
                                      )}
                                    </td>
                                  </tr>
                                ))
                              )}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* ONGLET 3 : BILAN ANNUEL (PAR CATÉGORIE OU PAR FOURNISSEUR / TIERS) */}
                  {activeTab === 'balance' && (
                    <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-6">
                      <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                        <div>
                          <h2 className="text-xl font-bold text-white">Bilan Financier {currentYear} ({currentAccountName})</h2>
                          <p className="text-xs text-gray-400 mt-1">
                            Regroupement actuel : <strong className="text-gray-200">{balanceGroupBy === 'category' ? 'Par Catégorie' : 'Par Fournisseur / Tiers'}</strong>
                          </p>
                        </div>
                        <div className="flex flex-wrap gap-2 print:hidden">
                          <div className="bg-gray-950 p-1 rounded-xl border border-gray-800 flex">
                            <button 
                              onClick={() => { setBalanceGroupBy('category'); setBalanceItemFilter('all'); }} 
                              className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5 ${balanceGroupBy === 'category' ? 'bg-red-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}
                            >
                              <List className="w-3.5 h-3.5" />
                              <span>Par Catégorie</span>
                            </button>
                            <button 
                              onClick={() => { setBalanceGroupBy('supplier'); setBalanceItemFilter('all'); }} 
                              className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5 ${balanceGroupBy === 'supplier' ? 'bg-blue-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}
                            >
                              <Users className="w-3.5 h-3.5" />
                              <span>Par Fournisseur / Tiers</span>
                            </button>
                          </div>

                          <div className="bg-gray-950 p-1 rounded-xl border border-gray-800 flex">
                            <button onClick={() => setBalanceViewMode('global')} className={`px-3 py-1.5 rounded-lg text-xs font-medium ${balanceViewMode === 'global' ? 'bg-gray-800 text-white' : 'text-gray-400'}`}>Vue Synthèse</button>
                            <button onClick={() => setBalanceViewMode('detailed')} className={`px-3 py-1.5 rounded-lg text-xs font-medium ${balanceViewMode === 'detailed' ? 'bg-gray-800 text-white' : 'text-gray-400'}`}>Vue Détaillée</button>
                          </div>

                          <select 
                            value={balanceItemFilter} 
                            onChange={(e) => setBalanceItemFilter(e.target.value)}
                            className="bg-gray-800 border border-gray-700 text-white text-xs rounded-xl px-3 py-1.5 outline-none"
                          >
                            <option value="all">{balanceGroupBy === 'category' ? 'Toutes les catégories' : 'Tous les fournisseurs / tiers'}</option>
                            {Object.keys(activeSummary).sort().map(key => (
                              <option key={key} value={key}>{key}</option>
                            ))}
                          </select>

                          <button onClick={exportCSV} className="flex items-center space-x-1.5 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl text-xs font-medium">
                            <Download className="w-4 h-4"/><span>Export CSV / Sheets</span>
                          </button>
                          <button onClick={() => window.print()} className="flex items-center space-x-1.5 bg-gray-800 hover:bg-gray-700 text-white px-3 py-1.5 rounded-xl text-xs font-medium">
                            <Printer className="w-4 h-4"/><span>Imprimer</span>
                          </button>
                        </div>
                      </div>

                      <div className="bg-gray-950 p-4 rounded-xl border border-gray-800 flex justify-between items-center">
                        <span className="text-gray-300 font-medium">Report à nouveau (Solde au 1er Janvier {currentYear})</span>
                        <span className={`text-lg font-bold ${reportANouveau >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>{formatCurrency(reportANouveau)}</span>
                      </div>

                      {balanceViewMode === 'global' ? (
                        <table className="w-full text-sm text-left text-gray-300">
                          <thead className="bg-gray-950 border-b border-gray-800">
                            <tr>
                              <th className="px-6 py-4">{balanceGroupBy === 'category' ? 'Catégorie' : 'Fournisseur / Tiers'}</th>
                              <th className="px-6 py-4 text-right">Recettes</th>
                              <th className="px-6 py-4 text-right">Dépenses</th>
                              <th className="px-6 py-4 text-right">Solde</th>
                            </tr>
                          </thead>
                          <tbody>
                            {filteredSummaryEntries.length === 0 ? (
                              <tr>
                                <td colSpan="4" className="px-6 py-8 text-center text-gray-500">Aucune opération sur cette sélection.</td>
                              </tr>
                            ) : (
                              filteredSummaryEntries.map(([itemKey, data]) => (
                                <tr key={itemKey} className="border-b border-gray-800 hover:bg-gray-800/30">
                                  <td className="px-6 py-4 font-medium text-white">{itemKey}</td>
                                  <td className="px-6 py-4 text-right text-emerald-500">{data.income > 0 ? formatCurrency(data.income) : '-'}</td>
                                  <td className="px-6 py-4 text-right text-red-500">{data.expense > 0 ? formatCurrency(data.expense) : '-'}</td>
                                  <td className={`px-6 py-4 text-right font-bold ${data.total >= 0 ? 'text-white' : 'text-red-400'}`}>{formatCurrency(data.total)}</td>
                                </tr>
                              ))
                            )}
                            <tr className="bg-gray-950 font-bold text-white border-t-2 border-gray-700">
                              <td className="px-6 py-4">TOTAL DES MOUVEMENTS {currentYear}</td>
                              <td className="px-6 py-4 text-right text-emerald-400">{formatCurrency(sumIncome)}</td>
                              <td className="px-6 py-4 text-right text-red-400">{formatCurrency(sumExpense)}</td>
                              <td className="px-6 py-4 text-right">{formatCurrency(sumTotal)}</td>
                            </tr>
                            {balanceItemFilter === 'all' && (
                              <tr className="bg-red-950/20 font-extrabold text-white border-t border-red-500/30">
                                <td className="px-6 py-4" colSpan="3">SOLDE FINAL (Avec Report à nouveau)</td>
                                <td className="px-6 py-4 text-right text-lg">{formatCurrency(reportANouveau + sumTotal)}</td>
                              </tr>
                            )}
                          </tbody>
                        </table>
                      ) : (
                        <div className="space-y-4">
                          {filteredSummaryEntries.map(([itemKey, data]) => {
                            const itemTxs = filteredTransactions.filter(t => 
                              balanceGroupBy === 'category' 
                                ? (t.category || 'Non catégorisé') === itemKey
                                : ((t.supplier || '').trim() || 'Non renseigné') === itemKey
                            );
                            if (itemTxs.length === 0) return null;
                            return (
                              <div key={itemKey} className="border border-gray-800 rounded-xl overflow-hidden">
                                <div className="bg-gray-950 px-4 py-3 flex justify-between items-center border-b border-gray-800">
                                  <span className="font-bold text-white">{itemKey}</span>
                                  <span className={`font-bold ${data.total >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>{formatCurrency(data.total)}</span>
                                </div>
                                <div className="divide-y divide-gray-800/60">
                                  {itemTxs.map(tx => (
