                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ONGLET COMMANDES & CENTRE D'IMPRESSION A4 / PDF / MAIL AVEC PIÈCE JOINTE PDF
        function CommandesTab({ stock, fournisseurs, contactsAlerte }) {
            const [orderQties, setOrderQties] = useState({});
            const [customAddedIds, setCustomAddedIds] = useState([]);
            const [selectedFournisseurFilter, setSelectedFournisseurFilter] = useState('Tous');
            const [previewSupplierId, setPreviewSupplierId] = useState(null);
            const [orderNotes, setOrderNotes] = useState({});
            const [selectedRecipientBySupplier, setSelectedRecipientBySupplier] = useState({});
            const [addArticleSelect, setAddArticleSelect] = useState({});

            // Initialiser avec les produits actifs en alerte
            useEffect(() => {
                setOrderQties(prev => {
                    const next = { ...prev };
                    stock.forEach(item => {
                        const isAlert = item.alerteActive !== false && item.quantite <= item.seuil;
                        if (isAlert && next[item.id] === undefined) {
                            next[item.id] = Math.max(1, (item.seuil - item.quantite) + 2);
                        }
                    });
                    return next;
                });
            }, [stock]);

            const adjustQty = (id, amount) => {
                setOrderQties(prev => ({ ...prev, [id]: Math.max(0, (Number(prev[id]) || 0) + amount) }));
            };

            const setDirectQty = (id, val) => {
                const parsed = val === '' ? 0 : Math.max(0, parseInt(val, 10) || 0);
                setOrderQties(prev => ({ ...prev, [id]: parsed }));
            };

            const handleAddExtraProduct = (fId) => {
                const prodId = addArticleSelect[fId];
                if (!prodId) return;
                if (!customAddedIds.includes(prodId)) {
                    setCustomAddedIds(prev => [...prev, prodId]);
                }
                setOrderQties(prev => ({ ...prev, [prodId]: Math.max(1, Number(prev[prodId]) || 1) }));
                setAddArticleSelect(prev => ({ ...prev, [fId]: '' }));
            };

            const handleRemoveFromOrder = (id) => {
                setOrderQties(prev => ({ ...prev, [id]: 0 }));
                setCustomAddedIds(prev => prev.filter(item => item !== id));
            };

            // Liste de tous les fournisseurs + groupe "unassigned"
            const supplierIds = useMemo(() => {
                const ids = Object.keys(fournisseurs);
                const hasUnassigned = stock.some(i => !i.fournisseurId || !fournisseurs[i.fournisseurId]);
                if (hasUnassigned) ids.push('unassigned');
                return ids;
            }, [fournisseurs, stock]);

            // Regrouper les articles par fournisseur
            const groupedOrders = useMemo(() => {
                const groups = {};
                supplierIds.forEach(fId => {
                    const supplierProducts = stock.filter(item => {
                        const itemFId = (item.fournisseurId && fournisseurs[item.fournisseurId]) ? item.fournisseurId : 'unassigned';
                        if (itemFId !== fId) return false;
                        const isAlert = item.alerteActive !== false && item.quantite <= item.seuil;
                        const isCustom = customAddedIds.includes(item.id);
                        const hasQty = (orderQties[item.id] || 0) > 0;
                        return isAlert || isCustom || hasQty;
                    });
                    if (supplierProducts.length > 0 || fId !== 'unassigned') {
                        groups[fId] = supplierProducts;
                    }
                });
                return groups;
            }, [supplierIds, stock, fournisseurs, customAddedIds, orderQties]);

            const getOrderNumber = (fId) => {
                const now = new Date();
                const yyyy = now.getFullYear();
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const dd = String(now.getDate()).padStart(2, '0');
                const suffix = fId === 'unassigned' ? 'DIV' : fId.slice(-3).toUpperCase();
                return `BC-${yyyy}${mm}${dd}-${suffix}`;
            };

            // Envoi du Bon de Commande par mail (Objet + Corps HTML + Pièce jointe PDF A4 avec logo)
            const handleSendPurchaseOrderEmail = (fId, targetChoice) => {
                const fData = fId === 'unassigned' ? { nom: "Fournisseur Divers", numCompte: "", email: "", tel: "" } : (fournisseurs[fId] || { nom: "Fournisseur" });
                const items = (groupedOrders[fId] || []).filter(i => (orderQties[i.id] || 0) > 0);

                if (items.length === 0) {
                    return alert("Aucun article avec une quantité supérieure à 0 dans ce bon de commande.");
                }

                let targetEmails = [];
                let targetLabel = "";

                if (targetChoice === 'fournisseur') {
                    if (!fData.email) return alert("Aucune adresse e-mail n'est renseignée sur la fiche de ce fournisseur.");
                    targetEmails = [fData.email.trim()];
                    targetLabel = `le fournisseur ${fData.nom} (${fData.email})`;
                } else if (targetChoice === 'tous_contacts') {
                    const active = Object.values(contactsAlerte).filter(c => c.actif && c.email);
                    if (active.length === 0) return alert("Aucun contact d'alerte actif enregistré.");
                    targetEmails = active.map(c => c.email.trim());
                    targetLabel = `tous les contacts d'alerte actifs (${targetEmails.length})`;
                } else if (targetChoice && targetChoice.startsWith('contact:')) {
                    const cId = targetChoice.replace('contact:', '');
                    const cObj = contactsAlerte[cId];
                    if (!cObj || !cObj.email) return alert("Contact introuvable ou sans adresse e-mail.");
                    targetEmails = [cObj.email.trim()];
                    targetLabel = `${cObj.nom} (${cObj.email})`;
                } else {
                    return alert("Veuillez choisir un destinataire valide.");
                }

                const numBon = getOrderNumber(fId);
                const dateStr = new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const note = (orderNotes[fId] || '').trim();
                const totalUnitCount = items.reduce((acc, i) => acc + (Number(orderQties[i.id]) || 0), 0);
                
                // URL publique absolue du logo hébergé sur GitHub Pages
                const logoPublicUrl = new URL('./logo.png', window.location.href).href;
                const cleanSupplierName = (fData.nom || 'Fournisseur').replace(/[^a-zA-Z0-9_-]/g, '_');
                const pdfFileName = `${numBon}_${cleanSupplierName}.pdf`;

                const rowsHtml = items.map((item, idx) => `
                    <tr style="border-bottom: 1px solid #d1d5db; background-color: ${idx % 2 === 0 ? '#ffffff' : '#f9fafb'};">
                        <td style="padding: 10px 12px; font-size: 12px; color: #4b5563; text-align: center; border: 1px solid #d1d5db;">${idx + 1}</td>
                        <td style="padding: 10px 12px; font-size: 13px; font-weight: bold; color: #1a2b4c; border: 1px solid #d1d5db;">${item.nom}</td>
                        <td style="padding: 10px 12px; font-size: 12px; color: #4b5563; border: 1px solid #d1d5db;">${item.famille || 'Stock'}</td>
                        <td style="padding: 10px 12px; font-size: 12px; color: #374151; font-weight: 600; border: 1px solid #d1d5db;">${item.format}</td>
                        <td style="padding: 10px 12px; font-size: 14px; font-weight: 800; color: #e3001b; text-align: center; border: 1px solid #d1d5db;">${orderQties[item.id]}</td>
                    </tr>
                `).join('');

                const textLines = items.map(i => `- ${orderQties[i.id]}x ${i.nom} (${i.format})`).join('\n');

                // 1. CORPS DU MAIL HTML (message d'accompagnement + récapitulatif direct)
                const htmlEmailBody = `
                <!DOCTYPE html>
                <html lang="fr">
                <body style="margin:0; padding:0; background-color:#f3f4f6; font-family: Arial, Helvetica, sans-serif;">
                    <div style="max-width:680px; margin:20px auto; background-color:#ffffff; border-radius:10px; overflow:hidden; border:1px solid #d1d5db;">
                        <div style="background-color:#1a2b4c; color:#ffffff; padding:20px 24px; border-bottom:5px solid #e3001b;">
                            <table style="width:100%; border-collapse:collapse;">
                                <tr>
                                    <td style="width:65px; vertical-align:middle;">
                                        <img src="${logoPublicUrl}" alt="Logo" width="54" height="54" style="display:block; background:#ffffff; padding:3px; border-radius:8px; object-fit:contain;" />
                                    </td>
                                    <td style="vertical-align:middle; padding-left:10px;">
                                        <div style="font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:#fca5a5; font-weight:bold;">BON DE COMMANDE N° ${numBon}</div>
                                        <h1 style="margin:3px 0 0 0; font-size:18px; font-weight:800; text-transform:uppercase; color:#ffffff;">${AMICALE_INFO.nom}</h1>
                                        <div style="font-size:12px; color:#d1d5db; margin-top:2px;">${AMICALE_INFO.adresse} • Tél : ${AMICALE_INFO.telFormat}</div>
                                    </td>
                                </tr>
                            </table>
                        </div>

                        <div style="padding:24px;">
                            <p style="font-size:14px; color:#1f2937; line-height:1.6; margin:0 0 16px 0;">
                                Bonjour,<br/><br/>
                                Veuillez trouver en <strong>pièce jointe (fichier PDF <em>${pdfFileName}</em>)</strong> ainsi que ci-dessous notre bon de commande N° <strong>${numBon}</strong> du <strong>${dateStr}</strong> pour l'<strong>${AMICALE_INFO.nom}</strong>.
                            </p>

                            <div style="background-color:#f8fafc; border:1px solid #cbd5e1; border-left:4px solid #1a2b4c; border-radius:6px; padding:12px 16px; margin-bottom:20px;">
                                <div style="font-size:11px; text-transform:uppercase; color:#64748b; font-weight:bold;">Fournisseur Destinataire</div>
                                <div style="font-size:16px; font-weight:800; color:#1a2b4c; margin-top:2px;">${fData.nom}</div>
                                ${fData.numCompte ? `<div style="margin-top:6px; display:inline-block; background-color:#1a2b4c; color:#ffffff; padding:3px 10px; border-radius:4px; font-size:12px; font-weight:bold;">N° DE COMPTE CLIENT : ${fData.numCompte}</div>` : ''}
                            </div>

                            <table style="width:100%; border-collapse:collapse; text-align:left; border:1px solid #d1d5db;">
                                <thead>
                                    <tr style="background-color:#1a2b4c; color:#ffffff;">
                                        <th style="padding:9px 10px; font-size:11px; text-transform:uppercase; width:36px; text-align:center;">Réf.</th>
                                        <th style="padding:9px 10px; font-size:11px; text-transform:uppercase;">Désignation</th>
                                        <th style="padding:9px 10px; font-size:11px; text-transform:uppercase;">Famille</th>
                                        <th style="padding:9px 10px; font-size:11px; text-transform:uppercase;">Format</th>
                                        <th style="padding:9px 10px; font-size:11px; text-transform:uppercase; text-align:center; width:80px;">Quantité</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rowsHtml}
                                </tbody>
                                <tfoot>
                                    <tr style="background-color:#f3f4f6;">
                                        <td colspan="4" style="padding:10px 12px; font-size:13px; font-weight:bold; color:#1a2b4c; text-align:right; border:1px solid #d1d5db;">Total d'unités commandées (${items.length} réf.) :</td>
                                        <td style="padding:10px 12px; font-size:15px; font-weight:800; color:#1a2b4c; text-align:center; border:1px solid #d1d5db;">${totalUnitCount}</td>
                                    </tr>
                                </tfoot>
                            </table>

                            ${note ? `
                                <div style="margin-top:16px; background-color:#fffbeb; border:1px solid #fde68a; border-radius:6px; padding:12px 14px;">
                                    <div style="font-size:11px; font-weight:bold; text-transform:uppercase; color:#92400e; margin-bottom:4px;">Observations / Consignes de livraison :</div>
                                    <div style="font-size:13px; color:#78350f; white-space:pre-line;">${note}</div>
                                </div>
                            ` : ''}

                            <div style="margin-top:20px; padding-top:16px; border-top:1px solid #e5e7eb; font-size:13px; color:#374151; line-height:1.6;">
                                <strong>Coordonnées de facturation et de livraison :</strong><br/>
                                ${AMICALE_INFO.nom}<br/>
                                ${AMICALE_INFO.adresse}<br/>
                                Personne à contacter : <strong>${AMICALE_INFO.contact} (${AMICALE_INFO.telFormat})</strong><br/>
                                E-mail : <a href="mailto:${AMICALE_INFO.email}" style="color:#e3001b; font-weight:bold;">${AMICALE_INFO.email}</a>
                            </div>

                            <p style="font-size:13px; color:#4b5563; margin-top:18px;">
                                En vous remerciant par avance pour la bonne prise en compte de cette commande.<br/>
                                Cordialement,<br/>
                                <strong>${AMICALE_INFO.contact}</strong> — ${AMICALE_INFO.nom}
                            </p>
                        </div>
                    </div>
                </body>
                </html>
                `;

                // 2. DOCUMENT A4 OFFICIEL POUR CONVERSION EN PIÈCE JOINTE PDF
                const htmlForPdfAttachment = `
                <!DOCTYPE html>
                <html lang="fr">
                <head>
                    <meta charset="UTF-8">
                    <style>
                        @page { size: A4 portrait; margin: 14mm; }
                        body { font-family: Arial, Helvetica, sans-serif; color: #111827; margin: 0; padding: 0; font-size: 12px; }
                    </style>
                </head>
                <body>
                    <table style="width:100%; border-collapse:collapse; border-bottom:4px solid #e3001b; padding-bottom:16px;">
                        <tr>
                            <td style="width:85px; vertical-align:top;">
                                <img src="${logoPublicUrl}" alt="Logo Amicale" width="75" height="75" style="object-fit:contain;" />
                            </td>
                            <td style="vertical-align:top; padding-left:12px;">
                                <div style="font-size:10px; font-weight:bold; text-transform:uppercase; color:#e3001b; letter-spacing:1px;">Réserve du Foyer</div>
                                <div style="font-size:18px; font-weight:800; color:#1a2b4c; text-transform:uppercase; margin-top:2px;">${AMICALE_INFO.nom}</div>
                                <div style="font-size:11px; color:#374151; margin-top:6px; line-height:1.5;">
                                    Adresse : <strong>${AMICALE_INFO.adresse}</strong><br/>
                                    E-mail : ${AMICALE_INFO.email}<br/>
                                    Contact : <strong>${AMICALE_INFO.contact} (${AMICALE_INFO.telFormat})</strong>
                                </div>
                            </td>
                            <td style="vertical-align:top; text-align:right; width:210px;">

                                </div>
                            </td>
