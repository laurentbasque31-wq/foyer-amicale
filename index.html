                                    <div key={tx.id} className="px-4 py-2.5 flex justify-between items-center text-xs">
                                      <div className="flex flex-wrap items-center gap-2">
                                        <span className="text-gray-400">{new Date(tx.date).toLocaleDateString('fr-FR')}</span>
                                        <span className="text-gray-200 font-medium">{tx.description}</span>
                                        {balanceGroupBy === 'category' && tx.supplier && (
                                          <span className="bg-blue-500/10 text-blue-300 px-2 py-0.5 rounded-full border border-blue-500/20">{tx.supplier}</span>
                                        )}
                                        {balanceGroupBy === 'supplier' && tx.category && (
                                          <span className="bg-gray-800 text-gray-300 px-2 py-0.5 rounded-full border border-gray-700">{tx.category}</span>
                                        )}
                                      </div>
                                      <span className={`font-bold ${tx.type === 'income' ? 'text-emerald-400' : 'text-red-400'}`}>
                                        {tx.type === 'income' ? '+' : '-'}{formatCurrency(tx.amount)}
                                      </span>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  )}

                  {/* ONGLET 4 : AUTOMATISATIONS */}
                  {activeTab === 'automations' && (
                    <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                      <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold text-white">Opérations Récurrentes</h2>
                        <button onClick={() => setIsAddAutomationOpen(true)} className="flex items-center space-x-2 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
                          <Plus className="w-4 h-4"/><span>Ajouter</span>
                        </button>
                      </div>
                      {automations.length === 0 ? (
                        <p className="text-gray-500 text-sm">Aucune automatisation enregistrée.</p>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          {automations.map(auto => (
                            <div key={auto.id} className="bg-gray-950 border border-gray-800 p-4 rounded-xl flex justify-between items-center">
                              <div>
                                <p className="font-bold text-white">{auto.description}</p>
                                <p className="text-xs text-gray-400">
                                  {auto.supplier ? `${auto.supplier} • ` : ''}{auto.category} • {auto.frequency === 'monthly' ? 'Mensuel' : 'Annuel'}
                                </p>
                              </div>
                              <div className="flex items-center space-x-3">
                                <span className={`font-bold ${auto.type === 'income' ? 'text-emerald-400' : 'text-red-400'}`}>{formatCurrency(auto.amount)}</span>
                                <button onClick={() => deleteAutomation(auto.id)} className="text-gray-500 hover:text-red-500"><Trash2 className="w-4 h-4"/></button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {/* ONGLET 5 : PARAMÈTRES */}
                  {activeTab === 'settings' && (
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      {/* COMPTES */}
                      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                        <h2 className="text-lg font-bold text-white mb-4 flex items-center"><CreditCard className="w-5 h-5 mr-2 text-red-500"/> Comptes Bancaires</h2>
                        <ul className="space-y-3 mb-6">
                          {accounts.map(acc => (
                            <li key={acc.id} className="flex justify-between items-center bg-gray-950 p-3 rounded-lg border border-gray-800">
                              <span className="text-gray-200 font-medium">{acc.name}</span>
                              <button onClick={() => deleteAccount(acc.id)} className="text-gray-500 hover:text-red-500"><Trash2 className="w-4 h-4"/></button>
                            </li>
                          ))}
                        </ul>
                        <form onSubmit={addAccount} className="flex space-x-2">
                          <input type="text" value={newAccountName} onChange={e => setNewAccountName(e.target.value)} placeholder="Nouveau compte..." className="flex-1 bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none" />
                          <button className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium">Ajouter</button>
                        </form>
                      </div>

                      {/* CATÉGORIES */}
                      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                        <h2 className="text-lg font-bold text-white mb-4 flex items-center"><List className="w-5 h-5 mr-2 text-red-500"/> Catégories</h2>
                        <ul className="space-y-2.5 mb-6 max-h-64 overflow-y-auto pr-1">
                          {categories.map(cat => (
                            <li key={cat.id} className="flex justify-between items-center bg-gray-950 p-3 rounded-lg border border-gray-800">
                              <span className="text-gray-200 text-sm">{cat.name}</span>
                              <button onClick={() => deleteCategory(cat.id)} className="text-gray-500 hover:text-red-500"><Trash2 className="w-4 h-4"/></button>
                            </li>
                          ))}
                        </ul>
                        <form onSubmit={addCategory} className="flex space-x-2">
                          <input type="text" value={newCategoryName} onChange={e => setNewCategoryName(e.target.value)} placeholder="Nouvelle catégorie..." className="flex-1 bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none" />
                          <button className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium">Ajouter</button>
                        </form>
                      </div>

                      {/* FOURNISSEURS / TIERS */}
                      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                        <h2 className="text-lg font-bold text-white mb-4 flex items-center"><Users className="w-5 h-5 mr-2 text-blue-400"/> Fournisseurs / Tiers</h2>
                        <ul className="space-y-2.5 mb-6 max-h-64 overflow-y-auto pr-1">
                          {suppliers.map(sup => (
                            <li key={sup.id} className="flex justify-between items-center bg-gray-950 p-3 rounded-lg border border-gray-800">
                              <span className="text-gray-200 text-sm">{sup.name}</span>
                              <button onClick={() => deleteSupplier(sup.id)} className="text-gray-500 hover:text-red-500"><Trash2 className="w-4 h-4"/></button>
                            </li>
                          ))}
                        </ul>
                        <form onSubmit={addSupplier} className="flex space-x-2">
                          <input type="text" value={newSupplierName} onChange={e => setNewSupplierName(e.target.value)} placeholder="Nouveau fournisseur..." className="flex-1 bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none" />
                          <button className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium">Ajouter</button>
                        </form>
                      </div>

                      {/* CONNEXION CLOUD FIREBASE */}
                      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:col-span-3">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
                          <h2 className="text-lg font-bold text-white flex items-center">
                            <Database className="w-5 h-5 mr-2 text-emerald-400"/> Synchronisation en ligne (Firebase)
                          </h2>
                          <span className={`text-xs px-3 py-1 rounded-full font-semibold ${
                            cloudStatus === 'connected' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' :
                            cloudStatus === 'error' ? 'bg-red-500/10 text-red-400 border border-red-500/30' :
                            'bg-amber-500/10 text-amber-400 border border-amber-500/30'
                          }`}>
                            {cloudStatus === 'connected' ? '✓ Connecté en temps réel à Firebase' :
                             cloudStatus === 'error' ? `⚠️ ${cloudErrorDetail || 'Vérifier les Règles Firebase'}` :
                             'Connexion / Attente synchronisation...'}
                          </span>
                        </div>
                        {cloudStatus === 'error' && (
                          <div className="mb-4 p-3.5 bg-red-950/40 border border-red-500/30 rounded-xl text-xs text-gray-200 space-y-1.5">
                            <p className="font-bold text-red-400">Pourquoi Firebase refuse la connexion ?</p>
                            <p>Dans votre console Firebase &gt; <strong>Realtime Database</strong> &gt; onglet <strong>Règles</strong>, assurez-vous d'avoir publié ces règles puis cliquez sur <strong>Publier</strong> :</p>
                            <pre className="bg-gray-950 p-2.5 rounded-lg text-emerald-400 font-mono text-[11px] overflow-x-auto select-all">{`{\n  "rules": {\n    "coffre_fort": {\n      "${EXPECTED_VAULT_KEY}": {\n        ".read": true,\n        ".write": true\n      }\n    }\n  }\n}`}</pre>
                          </div>
                        )}
                        <div className="flex flex-col sm:flex-row gap-3">
                          <input 
                            type="url" 
                            value={tempFbUrl} 
                            onChange={(e) => setTempFbUrl(e.target.value)} 
                            placeholder="https://tresorerie-amicale-sp-rieumes-default-rtdb.europe-west1.firebasedatabase.app" 
                            className="flex-1 bg-gray-950 border border-gray-700 rounded-xl p-3 text-sm text-white outline-none focus:border-emerald-500"
                          />
                          <button 
                            onClick={() => {
                              localStorage.setItem('sp_rieumes_fb_url', tempFbUrl.trim());
                              setFirebaseDbUrl(tempFbUrl.trim());
                              setTimeout(() => forcePushToCloud(), 400);
                            }}
                            className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-bold text-sm transition-colors"
                          >
                            Connecter / Synchroniser
                          </button>
                        </div>
                      </div>

                      {/* CLÔTURE D'EXERCICE */}
                      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:col-span-3">
                        <h2 className="text-lg font-bold text-white mb-4 flex items-center"><Lock className="w-5 h-5 mr-2 text-red-500"/> Gestion des Exercices Annuels</h2>
                        <div className="flex flex-wrap gap-3">
                          {availableYears.map(year => {
                            const closed = closedYears.includes(year);
                            return (
                              <button key={year} onClick={() => toggleYearClosure(year)} className={`flex items-center space-x-2 px-4 py-2.5 rounded-xl border text-sm font-medium ${closed ? 'bg-yellow-500/10 border-yellow-500/30 text-yellow-400' : 'bg-gray-950 border-gray-800 text-gray-300'}`}>
                                {closed ? <Lock className="w-4 h-4"/> : <Unlock className="w-4 h-4"/>}
                                <span>{year} ({closed ? 'Clôturé' : 'Ouvert'})</span>
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      {/* SAUVEGARDE JSON */}
                      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:col-span-3">
                        <h2 className="text-lg font-bold text-white mb-4 flex items-center"><Database className="w-5 h-5 mr-2 text-red-500"/> Sauvegarde sur Ordinateur (.json)</h2>
                        <div className="flex flex-col sm:flex-row gap-4">
                          <button onClick={exportBackup} className="flex-1 flex items-center justify-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-medium">
                            <Download className="w-5 h-5"/><span>Sauvegarder sur le PC (.json)</span>
                          </button>
                          <label className="flex-1 flex items-center justify-center space-x-2 bg-gray-800 hover:bg-gray-700 text-white py-3 rounded-xl cursor-pointer font-medium">
                            <Upload className="w-5 h-5"/><span>Restaurer un fichier (.json)</span>
                            <input type="file" accept=".json" onChange={handleFileUpload} className="hidden" />
                          </label>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </main>
          </div>

          {/* FENÊTRE DE SÉLECTION DU COMPTE */}
          {isAccountPickerOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex justify-center items-center z-50 p-4">
              <div className="bg-gray-900 border border-gray-700 rounded-3xl w-full max-w-2xl overflow-hidden shadow-2xl">
                <div className="p-6 border-b border-gray-800 flex justify-between items-center">
                  <div className="flex items-center space-x-3">
                    <div className="bg-red-600 p-2.5 rounded-xl text-white">
                      <CreditCard className="w-6 h-6" />
                    </div>
                    <div>
                      <h3 className="text-xl font-bold text-white">Quel compte souhaitez-vous traiter ?</h3>
                      <p className="text-xs text-gray-400">Sélectionnez le compte sur lequel saisir ou pointer vos écritures</p>
                    </div>
                  </div>
                  <button onClick={() => setIsAccountPickerOpen(false)} className="text-gray-400 hover:text-white p-1">
                    <X className="w-6 h-6" />
                  </button>
                </div>

                <div className="p-6 grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[75vh] overflow-y-auto">
                  {accounts.map(acc => {
                    const bal = accountBalances[acc.id] || { pointed: 0, unpointed: 0, theoretical: 0 };
                    const isSelected = currentAccountId === acc.id;
                    return (
                      <button
                        key={acc.id}
                        onClick={() => { setCurrentAccountId(acc.id); setHasSelectedAccountOnce(true); setIsAccountPickerOpen(false); }}
                        className={`text-left p-5 rounded-2xl border transition-all flex flex-col justify-between group ${isSelected ? 'bg-red-600/15 border-red-500 shadow-lg shadow-red-600/10' : 'bg-gray-950 hover:bg-gray-800 border-gray-800 hover:border-gray-600'}`}
                      >
                        <div className="flex items-center justify-between mb-4">
                          <span className="text-lg font-bold text-white group-hover:text-red-400 transition-colors">{acc.name}</span>
                          <span className={`text-xs px-2.5 py-1 rounded-full font-semibold ${isSelected ? 'bg-red-600 text-white' : 'bg-gray-800 text-gray-400'}`}>
                            {isSelected ? 'Actif' : 'Choisir'}
                          </span>
                        </div>
                        <div className="space-y-1.5 pt-3 border-t border-gray-800/80 w-full">
                          <div className="flex justify-between text-xs">
                            <span className="text-gray-400">Solde Pointé :</span>
                            <span className={`font-bold ${bal.pointed >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>{formatCurrency(bal.pointed)}</span>
                          </div>
                          <div className="flex justify-between text-xs">
                            <span className="text-gray-400">Non pointé :</span>
                            <span className="font-medium text-blue-400">{bal.unpointed > 0 ? '+' : ''}{formatCurrency(bal.unpointed)}</span>
                          </div>
                          <div className="flex justify-between text-sm pt-1 border-t border-gray-800/50">
                            <span className="text-gray-300 font-semibold">Solde Théorique :</span>
                            <span className={`font-extrabold ${bal.theoretical >= 0 ? 'text-white' : 'text-red-400'}`}>{formatCurrency(bal.theoretical)}</span>
                          </div>
                        </div>
                      </button>
                    );
                  })}

                  <button
                    onClick={() => { setCurrentAccountId('all'); setHasSelectedAccountOnce(true); setIsAccountPickerOpen(false); }}
                    className={`sm:col-span-2 text-left p-4 rounded-2xl border transition-all flex items-center justify-between ${currentAccountId === 'all' ? 'bg-red-600/15 border-red-500' : 'bg-gray-950 hover:bg-gray-800 border-gray-800'}`}
                  >
                    <div>
                      <span className="font-bold text-white block">Voir tous les comptes (Cumul global)</span>
                      <span className="text-xs text-gray-400">Affiche toutes les écritures confondues</span>
                    </div>
                    <span className="text-xs bg-gray-800 text-gray-300 px-3 py-1.5 rounded-xl border border-gray-700">Vue globale</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FENÊTRE DE SÉLECTION DE L'ANNÉE */}
          {isYearPickerOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex justify-center items-center z-50 p-4">
              <div className="bg-gray-900 border border-gray-700 rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl">
                <div className="p-6 border-b border-gray-800 flex justify-between items-center">
                  <div className="flex items-center space-x-3">
                    <div className="bg-blue-600 p-2.5 rounded-xl text-white">
                      <Calendar className="w-6 h-6" />
                    </div>
                    <div>
                      <h3 className="text-xl font-bold text-white">Choisir l'exercice comptable</h3>
                      <p className="text-xs text-gray-400">Sélectionnez l'année à consulter ou modifier</p>
                    </div>
                  </div>
                  <button onClick={() => setIsYearPickerOpen(false)} className="text-gray-400 hover:text-white p-1">
                    <X className="w-6 h-6" />
                  </button>
                </div>

                <div className="p-6 grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[65vh] overflow-y-auto">
                  {availableYears.map(year => {
                    const isSelected = currentYear === year;
                    const isClosed = closedYears.includes(year);
                    const countTx = transactions.filter(t => t.date.startsWith(year)).length;
                    return (
                      <button
                        key={year}
                        onClick={() => { setCurrentYear(year); setIsYearPickerOpen(false); }}
                        className={`p-4 rounded-2xl border text-left transition-all flex flex-col justify-between ${
                          isSelected 
                            ? 'bg-blue-600/15 border-blue-500 shadow-lg shadow-blue-600/10' 
                            : 'bg-gray-950 hover:bg-gray-800 border-gray-800 hover:border-gray-600'
                        }`}
                      >
                        <div className="flex items-center justify-between mb-2">
                          <span className="text-2xl font-extrabold text-white">{year}</span>
                          {isClosed ? (
                            <span className="flex items-center space-x-1 text-[11px] bg-yellow-500/10 text-yellow-400 border border-yellow-500/30 px-2 py-0.5 rounded-full">
                              <Lock className="w-3 h-3" /><span>Clôturé</span>
                            </span>
                          ) : (
                            <span className="text-[11px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full">
                              Ouvert
                            </span>
                          )}
                        </div>
                        <p className="text-xs text-gray-400">{countTx} écriture(s) enregistrée(s)</p>
                      </button>
                    );
                  })}
                </div>

                <div className="p-4 bg-gray-950 border-t border-gray-800 flex justify-between items-center">
                  <span className="text-xs text-gray-400">Besoin de préparer l'année suivante ?</span>
                  <button
                    onClick={() => {
                      const maxYear = Math.max(...availableYears.map(Number));
                      const nextYear = (maxYear + 1).toString();
                      if (!manuallyOpenedYears.includes(nextYear)) {
                        setManuallyOpenedYears(prev => [...prev, nextYear]);
                      }
                      setCurrentYear(nextYear);
                      setIsYearPickerOpen(false);
                    }}
                    className="flex items-center space-x-1.5 text-xs bg-gray-800 hover:bg-gray-700 text-white px-3 py-2 rounded-xl border border-gray-700 transition-colors"
                  >
                    <Plus className="w-3.5 h-3.5 text-blue-400" />
                    <span>Ouvrir l'exercice {Math.max(...availableYears.map(Number)) + 1}</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE : NOUVELLE OPÉRATION */}
          {isAddModalOpen && (
            <AddTransactionModal 
              onClose={() => setIsAddModalOpen(false)} 
              onSave={addTransaction} 
              accounts={accounts} 
              currentAccountId={currentAccountId} 
              categories={categories} 
              suppliers={suppliers}
            />
          )}

          {/* MODALE : MODIFIER OPÉRATION */}
          {editModalTx && (
            <EditTransactionModal
              tx={editModalTx}
              onClose={() => setEditModalTx(null)}
              onSave={handleEditTransaction}
              accounts={accounts}
              categories={categories}
              suppliers={suppliers}
            />
          )}

          {/* MODALE : NOUVELLE AUTOMATISATION */}
          {isAddAutomationOpen && (
            <AddAutomationModal 
              onClose={() => setIsAddAutomationOpen(false)} 
              onSave={addAutomation} 
              accounts={accounts} 
              categories={categories} 
              suppliers={suppliers}
            />
          )}

          {/* MODALE : CONFIRMATION RESTAURATION */}
          {restoreData && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4">
              <div className="bg-gray-900 border border-gray-700 rounded-2xl p-6 max-w-md w-full space-y-4">
                <h3 className="text-xl font-bold text-white">Restaurer la sauvegarde ?</h3>
                <p className="text-sm text-gray-300">Cette action remplacera les données actuelles par celles du fichier sélectionné.</p>
                <div className="flex space-x-3 pt-2">
                  <button onClick={() => setRestoreData(null)} className="flex-1 py-2.5 bg-gray-800 text-white rounded-xl">Annuler</button>
                  <button onClick={confirmRestore} className="flex-1 py-2.5 bg-red-600 text-white rounded-xl font-bold">Confirmer</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function AddTransactionModal({ onClose, onSave, accounts, currentAccountId, categories, suppliers }) {
      const [type, setType] = useState('expense');
      const [amount, setAmount] = useState('');
      const [description, setDescription] = useState('');
      const [supplier, setSupplier] = useState('');
      const [category, setCategory] = useState('');
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [accountId, setAccountId] = useState(currentAccountId === 'all' && accounts.length > 0 ? accounts[0].id : currentAccountId);
      const [paymentMethod, setPaymentMethod] = useState('CB');
      const [checkNumber, setCheckNumber] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!amount || !description || !category) return;
        onSave({ type, amount: parseFloat(amount), description, supplier: supplier.trim(), category: category.trim(), date, accountId, paymentMethod, checkNumber: paymentMethod === 'Chèque' ? checkNumber.trim() : null, reconciled: false });
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4">
          <div className="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-md overflow-visible shadow-2xl">
            <div className="flex justify-between items-center p-6 border-b border-gray-800">
              <h3 className="text-xl font-bold text-white">Nouvelle Opération</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white"><X className="w-6 h-6"/></button>
            </div>
            <form onSubmit={handleSubmit} className="p-6 space-y-4 max-h-[82vh] overflow-y-auto">
              <div className="grid grid-cols-2 gap-4">
                <button type="button" onClick={() => setType('expense')} className={`p-3 rounded-xl border flex items-center justify-center space-x-2 ${type === 'expense' ? 'bg-red-500/10 border-red-500 text-red-500' : 'bg-gray-800 border-gray-700 text-gray-400'}`}><ArrowDownRight className="w-5 h-5"/><span className="font-medium">Dépense</span></button>
                <button type="button" onClick={() => setType('income')} className={`p-3 rounded-xl border flex items-center justify-center space-x-2 ${type === 'income' ? 'bg-emerald-500/10 border-emerald-500 text-emerald-500' : 'bg-gray-800 border-gray-700 text-gray-400'}`}><ArrowUpRight className="w-5 h-5"/><span className="font-medium">Recette</span></button>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-sm text-gray-400 mb-1">Montant (€)</label><input type="number" step="0.01" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={amount} onChange={(e) => setAmount(e.target.value)} /></div>
                <div><label className="block text-sm text-gray-400 mb-1">Date</label><input type="date" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={date} onChange={(e) => setDate(e.target.value)} /></div>
              </div>
              <div><label className="block text-sm text-gray-400 mb-1">Compte</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={accountId} onChange={(e) => setAccountId(e.target.value)}>{accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}</select></div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-sm text-gray-400 mb-1">Mode</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}><option value="CB">CB</option><option value="Chèque">Chèque</option><option value="Prélèvement">Prélèvement</option><option value="Virement">Virement</option><option value="Espèces">Espèces</option></select></div>
                {paymentMethod === 'Chèque' && <div><label className="block text-sm text-gray-400 mb-1">N° chèque</label><input type="text" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={checkNumber} onChange={(e) => setCheckNumber(e.target.value)} /></div>}
              </div>
              <div><label className="block text-sm text-gray-400 mb-1">Libellé</label><input type="text" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={description} onChange={(e) => setDescription(e.target.value)} /></div>
              <div>
                <label className="block text-sm text-gray-400 mb-1">Fournisseur / Tiers (optionnel)</label>
                <AutocompleteInput direction="up" value={supplier} onChange={setSupplier} options={suppliers.map(s => s.name)} required={false} placeholder="Rechercher ou saisir un nouveau tiers..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
              </div>
              <div>
                <label className="block text-sm text-gray-400 mb-1">Catégorie</label>
                <AutocompleteInput direction="up" value={category} onChange={setCategory} options={categories.map(c => c.name)} required={true} placeholder="Choisir ou taper une catégorie..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
              </div>
              <div className="pt-4 flex space-x-3"><button type="button" onClick={onClose} className="flex-1 py-3 bg-gray-800 text-white rounded-xl">Annuler</button><button type="submit" className="flex-1 py-3 bg-red-600 text-white rounded-xl font-bold">Enregistrer</button></div>
            </form>
          </div>
        </div>
      );
    }

    function EditTransactionModal({ tx, onClose, onSave, accounts, categories, suppliers }) {
      const [type, setType] = useState(tx.type);
      const [amount, setAmount] = useState(tx.amount);
      const [description, setDescription] = useState(tx.description);
      const [supplier, setSupplier] = useState(tx.supplier || '');
      const [category, setCategory] = useState(tx.category);
      const [date, setDate] = useState(tx.date);
      const [accountId, setAccountId] = useState(tx.accountId);
      const [paymentMethod, setPaymentMethod] = useState(tx.paymentMethod || 'CB');
      const [checkNumber, setCheckNumber] = useState(tx.checkNumber || '');

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({ ...tx, type, amount: parseFloat(amount), description, supplier: supplier.trim(), category: category.trim(), date, accountId, paymentMethod, checkNumber: paymentMethod === 'Chèque' ? checkNumber : null });
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4">
          <div className="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-md overflow-visible shadow-2xl">
            <div className="flex justify-between items-center p-6 border-b border-gray-800">
              <h3 className="text-xl font-bold text-white">Modifier l'Opération</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white"><X className="w-6 h-6"/></button>
            </div>
            <form onSubmit={handleSubmit} className="p-6 space-y-4 max-h-[82vh] overflow-y-auto">
              <div className="grid grid-cols-2 gap-4">
                <button type="button" onClick={() => setType('expense')} className={`p-3 rounded-xl border flex items-center justify-center space-x-2 ${type === 'expense' ? 'bg-red-500/10 border-red-500 text-red-500' : 'bg-gray-800 border-gray-700 text-gray-400'}`}><ArrowDownRight className="w-5 h-5"/><span className="font-medium">Dépense</span></button>
                <button type="button" onClick={() => setType('income')} className={`p-3 rounded-xl border flex items-center justify-center space-x-2 ${type === 'income' ? 'bg-emerald-500/10 border-emerald-500 text-emerald-500' : 'bg-gray-800 border-gray-700 text-gray-400'}`}><ArrowUpRight className="w-5 h-5"/><span className="font-medium">Recette</span></button>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-sm text-gray-400 mb-1">Montant (€)</label><input type="number" step="0.01" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={amount} onChange={(e) => setAmount(e.target.value)} /></div>
                <div><label className="block text-sm text-gray-400 mb-1">Date</label><input type="date" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={date} onChange={(e) => setDate(e.target.value)} /></div>
              </div>
              <div><label className="block text-sm text-gray-400 mb-1">Compte</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={accountId} onChange={(e) => setAccountId(e.target.value)}>{accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}</select></div>
              <div><label className="block text-sm text-gray-400 mb-1">Libellé</label><input type="text" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={description} onChange={(e) => setDescription(e.target.value)} /></div>
              <div>
                <label className="block text-sm text-gray-400 mb-1">Fournisseur / Tiers</label>
                <AutocompleteInput direction="up" value={supplier} onChange={setSupplier} options={suppliers.map(s => s.name)} required={false} placeholder="Rechercher ou saisir un tiers..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
              </div>
              <div>
                <label className="block text-sm text-gray-400 mb-1">Catégorie</label>
                <AutocompleteInput direction="up" value={category} onChange={setCategory} options={categories.map(c => c.name)} required={true} placeholder="Choisir catégorie..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
              </div>
              <div className="pt-4 flex space-x-3"><button type="button" onClick={onClose} className="flex-1 py-3 bg-gray-800 text-white rounded-xl">Annuler</button><button type="submit" className="flex-1 py-3 bg-red-600 text-white rounded-xl font-bold">Mettre à jour</button></div>
            </form>
          </div>
        </div>
      );
    }

    function AddAutomationModal({ onClose, onSave, accounts, categories, suppliers }) {
      const [type, setType] = useState('expense');
      const [amount, setAmount] = useState('');
      const [description, setDescription] = useState('');
      const [supplier, setSupplier] = useState('');
      const [category, setCategory] = useState('');
      const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
      const [frequency, setFrequency] = useState('monthly');
      const [paymentMethod, setPaymentMethod] = useState('Prélèvement');
      const [accountId, setAccountId] = useState(accounts.length > 0 ? accounts[0].id : '');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!amount || !description || !category) return;
        onSave({ type, amount: parseFloat(amount), description, supplier: supplier.trim(), category: category.trim(), startDate, nextDate: startDate, frequency, paymentMethod, accountId });
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4">
          <div className="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-md overflow-visible shadow-2xl">
            <div className="flex justify-between items-center p-6 border-b border-gray-800"><h3 className="text-xl font-bold text-white">Nouvelle Automatisation</h3><button onClick={onClose} className="text-gray-400 hover:text-white"><X className="w-6 h-6"/></button></div>
            <form onSubmit={handleSubmit} className="p-6 space-y-4 max-h-[82vh] overflow-y-auto">
              <div className="grid grid-cols-2 gap-4">
                <button type="button" onClick={() => setType('expense')} className={`p-3 rounded-xl border flex items-center justify-center space-x-2 ${type === 'expense' ? 'bg-red-500/10 border-red-500 text-red-500' : 'bg-gray-800 border-gray-700 text-gray-400'}`}><ArrowDownRight className="w-5 h-5"/><span className="font-medium">Dépense</span></button>
                <button type="button" onClick={() => setType('income')} className={`p-3 rounded-xl border flex items-center justify-center space-x-2 ${type === 'income' ? 'bg-emerald-500/10 border-emerald-500 text-emerald-500' : 'bg-gray-800 border-gray-700 text-gray-400'}`}><ArrowUpRight className="w-5 h-5"/><span className="font-medium">Recette</span></button>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-sm text-gray-400 mb-1">Montant (€)</label><input type="number" step="0.01" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={amount} onChange={(e) => setAmount(e.target.value)} /></div>
                <div><label className="block text-sm text-gray-400 mb-1">Date de début</label><input type="date" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={startDate} onChange={(e) => setStartDate(e.target.value)} /></div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-sm text-gray-400 mb-1">Fréquence</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={frequency} onChange={(e) => setFrequency(e.target.value)}><option value="monthly">Mensuelle</option><option value="yearly">Annuelle</option></select></div>
                <div><label className="block text-sm text-gray-400 mb-1">Mode</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}><option value="Prélèvement">Prélèvement</option><option value="Virement">Virement</option></select></div>
              </div>
              <div><label className="block text-sm text-gray-400 mb-1">Compte</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={accountId} onChange={(e) => setAccountId(e.target.value)}>{accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}</select></div>
              <div><label className="block text-sm text-gray-400 mb-1">Libellé</label><input type="text" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={description} onChange={(e) => setDescription(e.target.value)} /></div>
              <div>
                <label className="block text-sm text-gray-400 mb-1">Fournisseur / Tiers</label>
                <AutocompleteInput direction="up" value={supplier} onChange={setSupplier} options={suppliers.map(s => s.name)} required={false} placeholder="Choisir un fournisseur..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
              </div>
              <div>
                <label className="block text-sm text-gray-400 mb-1">Catégorie</label>
                <AutocompleteInput direction="up" value={category} onChange={setCategory} options={categories.map(c => c.name)} required={true} placeholder="Choisir catégorie..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
              </div>
              <div className="pt-4 flex space-x-3"><button type="button" onClick={onClose} className="flex-1 py-3 bg-gray-800 text-white rounded-xl">Annuler</button><button type="submit" className="flex-1 py-3 bg-red-600 text-white rounded-xl font-bold">Enregistrer</button></div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
